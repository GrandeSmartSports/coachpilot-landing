<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B9C4CC">
<title>Rig Card</title>
<link rel="manifest" href="/rigs/manifest.webmanifest">
<link rel="apple-touch-icon" href="/rigs/icon-v4-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rig Card">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="/rigs/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/rigs/kit.css">
<link rel="stylesheet" href="/rigs/scene.css">
<script src="/rigs/sky.js"></script>
<script src="/rigs/scene.js"></script>
<script>
// The sky before anything is drawn, so the page never opens in the wrong
// light. The clock alone decides here; the forecast refines it once it is read.
(function () {
  try {
    var n = new Date(), m = null;
    try { m = localStorage.getItem("rig.skymode.v1"); } catch (e) { /* private mode */ }
    var r = RIG.sky.resolve(n.getHours() + n.getMinutes() / 60, null, null, m === "light" || m === "dark" ? m : "auto");
    RIG.sky.apply(document.documentElement, r);
    RIG.water.dress(document.documentElement, r.p);
  } catch (e) { /* the overcast floor in kit.css stands */ }
})();
</script>
<style>
:root{
  /* What the older screens and the rig drawings read. The sky's own colours
     and the look's tokens are in kit.css. rigs/sky.js sets the panel and line
     shades for the sky as soon as it runs; these are the floor. */
  --panel:var(--paper);
  --panel2:color-mix(in srgb,var(--paper) 96.5%,var(--ink));
  --panel3:color-mix(in srgb,var(--paper) 93%,var(--ink));
  --bg2:color-mix(in srgb,var(--bg) 97%,var(--ink));
  --line2:color-mix(in srgb,var(--line) 75%,var(--ink));
  --sh:var(--e1);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* the drawings' own inks: they sit on a dark card in every sky */
  --water:#123243; --rope:#f0f4f7;
  --steel:#8c99a3; --steel2:#6b7883; --hi:#fff;
  --roe:#f0a071; --roe2:#d9542f; --roe3:#8e2f22; --lure:#f2563a; --lure2:#e8442c;
  --yarn:#ff3d8a; --chart:#8ef06a; --brass:#d9a441; --brass2:#b8862c;
}
/* The scene is painted once and stays put while the screens under it are
   redrawn. It sits straight in the phone column, so it reaches both edges. */
.phone>.scene{left:0;right:0}
/* An installed app on an iPhone draws the clock and battery in white over the
   top of the page. The sky there is often pale, so the strip they sit in is
   shaded with the shore tone. In a browser tab the inset is zero and this is
   nothing. */
.phone::before{content:"";position:fixed;z-index:50;left:0;right:0;top:0;height:env(safe-area-inset-top);pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--shore) 86%,transparent),color-mix(in srgb,var(--shore) 62%,transparent))}


.when{font-size:15px;color:var(--ink2);margin:0;max-width:52ch}

/* specs */
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.sp{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--sh)}
.sp .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:700}
.sp .v{font-family:var(--mono);font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.3;color:var(--ink)}
.sp .have{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font-size:10.5px;font-family:var(--mono);color:var(--t3);line-height:1.3}

/* diagram */
/* The rig and knot drawings are built for a dark ground, so they keep one in
   every sky, like a photograph printed on the page. */
.dia,.tyer{--bg:#0a0d10;--panel:#141a20;--panel2:#1a222a;--panel3:#212b34;--line:#26313a;--line2:#334049;
  --ink:#f4f7f9;--ink2:#c3cfd8;--dim:#8899a5;--accent:#ff6a2b;--accent2:#ffa066;
  --go:#8fe85f;--warn:#ffc53d;--no:#ff5a4e;--hi:#fff;color:var(--ink);
  /* the kit's text tones, mixed again from the card's own inks */
  --t1:var(--ink);--t2:var(--ink2);--t3:color-mix(in srgb,var(--dim) 68%,var(--ink))}
.dia{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:8px;margin:0 0 18px;
  box-shadow:var(--e1);overflow:hidden}
.dia svg{display:block;width:100%;height:auto;border-radius:10px}


ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 15px 40px;font-size:15px;color:var(--ink2)}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(180deg,var(--panel3),var(--panel2));
  border:1px solid var(--line2);color:var(--accent);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;
  display:grid;place-items:center
}
ol.steps li:last-child{padding-bottom:0}
ol.steps b{font-weight:650;color:var(--ink)}
ol.steps .k{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600;
  background:color-mix(in srgb,var(--accent) 12%,transparent);padding:2px 7px;border-radius:5px;white-space:normal;overflow-wrap:anywhere}

.box{border-radius:14px;padding:13px 15px;font-size:14.5px;margin:16px 0 0;
  border:1px solid var(--edge);background:var(--pan-a);color:var(--t2);box-shadow:var(--e1)}
.card .box,.float .box{box-shadow:none}
.box a{text-decoration:underline;text-underline-offset:2px}
.box strong{font-weight:680;color:var(--ink)}
.box b{display:block;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:14px;margin-bottom:5px;color:var(--ink)}
.box.law{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 9%,var(--panel)),var(--panel))}
.box.law b{color:var(--warn)}
.box.tip{border-color:color-mix(in srgb,var(--go) 35%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--go) 8%,var(--panel)),var(--panel))}
.box.tip b{color:var(--go)}
.box.red{border-color:color-mix(in srgb,var(--no) 50%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--no) 10%,var(--panel)),var(--panel))}
.box.red b{color:var(--no)}

.chk{display:grid;gap:7px;margin:12px 0 0}
.chk label{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:11px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;transition:border-color .15s,opacity .15s}
.chk label:has(input:checked){opacity:.42}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 20px;width:20px;height:20px;margin:1px 0 0;border-radius:6px;border:2px solid var(--line2);background:transparent;position:relative;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk .t{min-width:0}
.chk .t b{display:block;font-weight:650;font-size:14.5px;line-height:1.3;color:var(--ink)}
.chk .t i{display:block;font-style:normal;font-size:12.5px;line-height:1.4;color:var(--t3);margin-top:2px}

/* ---- knot tyer ---- */
.tyer{margin:0 0 6px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.tyer .stage{background:var(--panel2);position:relative}
.tyer svg{display:block;width:100%;height:auto}
.tyer .bar{display:flex;align-items:center;gap:8px;padding:11px 13px;border-top:1px solid var(--line)}
.rail{display:flex;gap:5px;flex:1}
.rail button{
  flex:1;height:30px;border-radius:8px;cursor:pointer;
  background:var(--panel3);border:1px solid var(--line);color:var(--t3);
  font-family:var(--mono);font-size:12.5px;font-weight:600;transition:all .15s;
}
.rail button:hover{border-color:var(--line2);color:var(--ink2)}
.rail button[aria-current="true"]{
  background:var(--gold);color:var(--on-gold);border-color:transparent}
.rail button.done{color:var(--go);border-color:color-mix(in srgb,var(--go) 35%,var(--line))}
.play{
  flex:0 0 auto;height:30px;padding:0 14px;border-radius:8px;cursor:pointer;
  background:var(--panel3);border:1px solid var(--line2);color:var(--ink);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:13px;transition:all .15s;
}
.play:hover{background:var(--line);border-color:var(--accent)}
.tyer .cap{padding:0 15px 15px;font-size:14.5px;color:var(--ink2);min-height:52px}
.tyer .cap b{color:var(--ink);font-weight:650}
.kstep{opacity:0;transition:opacity .18s}
.kstep.on{opacity:1}
.kstep .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.kstep.on .draw{stroke-dashoffset:0;transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
.klink{display:inline-flex;align-items:center;gap:7px;margin:12px 0 0;font-size:14px;
  color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--panel)}
.klink:hover{border-color:var(--accent)}
.klink span{color:var(--t3);font-weight:400;font-size:13px}
.card h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:17px;color:var(--ink);margin:22px 0 8px}

/* bite */
.bite{display:flex;gap:14px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:16px;box-shadow:var(--sh)}
.bite svg{flex:0 0 92px;width:92px;height:70px;border-radius:8px}
.bite .t{font-size:14.5px;color:var(--ink2)}
.bite .t b{display:block;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:14px;color:var(--accent);margin-bottom:3px}
@keyframes dip{
  0%,42%{transform:translateY(0) rotate(0)} 52%{transform:translateY(3px) rotate(-7deg)}
  60%{transform:translateY(1px) rotate(3deg)} 72%,100%{transform:translateY(0) rotate(0)}
  80%,92%{transform:translateY(26px) rotate(-16deg)}
}
.floatbob{animation:dip 4s ease-in-out infinite;transform-origin:50% 85%}

/* buy links */
.buy{display:grid;gap:9px;margin:14px 0 0}
.buy a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);text-decoration:none}
.buy a:hover{border-color:var(--accent)}
.buy .n{flex:1;min-width:0}
.buy .n b{display:block;color:var(--ink);font-weight:650;font-size:14.5px;line-height:1.3}
.buy .n span{display:block;color:var(--t3);font-size:12.5px;margin-top:3px;line-height:1.35}
.buy .p{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.buy .go{color:var(--line2);font-size:17px;line-height:1;flex:0 0 auto}

.card{scroll-margin-top:var(--toph,130px)}
.card p a,.card .box a,.card li a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
/* ---- video tiles ---- */
.vids{display:grid;gap:10px;margin:12px 0 0}
.vid{display:flex;align-items:center;gap:13px;padding:12px;border-radius:14px;text-decoration:none;
  background:linear-gradient(180deg,var(--panel3),var(--panel2));border:1px solid var(--line2)}
.vid:hover,.vid:active{border-color:var(--accent)}
.vid .play{flex:0 0 52px;height:52px;border-radius:12px;position:relative;
  background:var(--gold);
  box-shadow:0 2px 12px -2px color-mix(in srgb,var(--gold) 55%,transparent)}
.vid .play::after{content:"";position:absolute;left:21px;top:16px;border-style:solid;
  border-width:10px 0 10px 16px;border-color:transparent transparent transparent var(--on-gold)}
.vid .vt{flex:1;min-width:0}
.vid .vt b{display:block;color:var(--ink);font-weight:650;font-size:15px;line-height:1.3}
.vid .by{display:block;color:var(--accent);font-size:12.5px;font-weight:600;margin-top:3px}
.vid .why{display:block;color:var(--t3);font-size:13px;line-height:1.4;margin-top:4px}
.vid .len{flex:0 0 auto;align-self:flex-start;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--t3);line-height:1.4}
.card .box + ol.steps,.card .box + .box{margin-top:14px}
.card ol.steps + .box{margin-top:6px}


/* ---- the library, until its own stage: tiles, rows, one card at a time ---- */
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wtile{display:flex;flex-direction:column;gap:2px;min-height:128px;padding:16px 15px 14px;color:var(--t1)}
.wtile:active{transform:translateY(1px)}
.wtile .ic{width:40px;height:40px;color:var(--accent);margin-bottom:auto}
.wtile .nm{font:700 24px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-top:12px}
.wtile .meta{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent2)}
.ic{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chip .ic{flex:0 0 auto;width:18px;height:18px;color:var(--accent)}
.row .rm{flex:0 0 auto;max-width:42%;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent2)}
.row .tx>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a line that must not be cut (a rule): it wraps */
.row .tx>span.whole{white-space:normal}
.grp{margin:26px 0 0}
.grp>.sect{margin-top:0}
/* A heading that lands on the picture gets glass under it, and the title
   gives up a little sky so the first card still crosses the waterline. */
.sect.lead{display:inline-flex;margin:0 0 10px;padding:8px 13px 7px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:var(--e1),inset 0 1px 0 var(--rim)}
.sect.lead .n{margin-left:4px}
.hero.tight{min-height:calc(var(--sw)*268/390 - 114px - var(--jumph,0px))}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* ---- hot trips ---- */
.gear{list-style:none;margin:14px 0 0;padding:0}
.gear li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink)}
.gear li:first-child{border-top:0}
.gear li span:last-child{flex:1;min-width:0}
.gear li small{display:block;color:var(--t3);font-size:13px;margin-top:2px}
.gear .tag{min-width:58px;text-align:center}
.hrs{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:13.5px;color:var(--ink2)}
.hrs td{padding:7px 4px;border-top:1px solid var(--line)}
.hrs td:first-child{font-family:var(--mono);color:var(--accent2);white-space:nowrap}
/* The map follows the sky like every other surface: plain tiles by day,
   turned dark only under the three dark skies. */
.mapbox{height:calc(100dvh - var(--sw)*268/390 - 104px);min-height:380px;border-radius:20px;overflow:hidden;isolation:isolate;
  box-shadow:var(--e2),inset 0 0 0 1px var(--edge)}
.mapbox,.mapbox.leaflet-container{background:var(--panel2)}
.mapbox .well{margin:16px}
.tiles-dark{filter:saturate(.55) contrast(.96)}
:root[data-dark="1"] .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.92) saturate(.6)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -20px 0;padding:2px 20px 12px;align-self:stretch}
.days::-webkit-scrollbar{display:none}
.days .chip{flex:0 0 auto}
.mk{display:flex !important;align-items:center;gap:6px;white-space:nowrap;background:none;border:0}
.mk i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);background:var(--paper)}
.mk b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--ink);
  text-shadow:0 0 2px var(--paper),0 0 4px var(--paper),0 0 7px var(--paper)}
.mk b{pointer-events:none}
.mk.group i{width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink)}
.mk.group.hot i{color:var(--on-gold)}
.leaflet-popup-content .pg + .pg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mk.hot i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 35%,transparent),0 0 0 1px var(--on-gold)}
.mk.dim i{border-color:var(--dim);opacity:.75}
.mk.dim b{opacity:.75;font-weight:600}
.mk.home i{border-radius:5px;border-color:var(--ink);background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 4px 0;font-size:12.5px;color:var(--t2)}
.legend .mk{font-size:12.5px}
.legend .mk i{width:13px;height:13px;border-width:2px}
.legend .mk.hot i{margin:0 4px}
.mapbox .leaflet-popup-content-wrapper,.mapbox .leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.mapbox .leaflet-popup-content{margin:14px 16px;font:14px/1.4 Inter,sans-serif}
.mapbox .leaflet-popup-content small{color:var(--t3)}
.mapbox .leaflet-popup-content a.pt{color:var(--ink)}
.mapbox .leaflet-popup-content .pt{display:block;margin-top:10px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.mapbox .leaflet-popup-content .pt span{display:block;font-family:var(--mono);font-size:11px;color:var(--accent2);font-weight:600}
.mapbox .leaflet-popup-content .pq{margin:8px 0 0;color:var(--t3)}
.mapbox.leaflet-container a.leaflet-popup-close-button{color:var(--t3)}
.mapbox .leaflet-control-attribution{background:color-mix(in srgb,var(--paper) 82%,transparent) !important;color:var(--ink2) !important}
.mapbox .leaflet-control-attribution a{color:var(--ink2) !important}
.ruleacts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ruleacts a{color:var(--ink);font-weight:600}
.ack{font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.rulestamp{margin:14px 4px 0;font-size:12.5px;color:var(--t3)}
.card .rulestamp{font-size:12.5px;color:var(--t3);margin:0 0 12px}
/* ---- the crew ---- */
/* Every class here starts cw- so no other part of the app can collide with
   it. An earlier bare .go rule turned the bait card's buy arrows into gold bars. */
.cw{max-width:430px}
.cw-fld{display:block;margin:0 0 14px}
.cw-fld > span{display:block;font-size:13px;color:var(--t3);margin:0 0 6px}
.cw-fld input,.cw-fld select,.cw-fld textarea{width:100%;min-height:48px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.cw-fld textarea{min-height:96px;padding:12px 14px;resize:vertical}
.cw-fld input:focus,.cw-fld select:focus,.cw-fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.cw-plain{display:flex;align-items:center;justify-content:center;width:100%;font:inherit;text-align:center;
  text-decoration:none;cursor:pointer;border-radius:14px;padding:0 14px;
  min-height:46px;margin-top:10px;font-size:15px;color:var(--ink2);background:transparent;border:1px solid var(--line2)}
.cw-plain[disabled]{opacity:.55;cursor:default}
.cw-plain:active{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.cw-out{margin-top:22px}
.cw-mini{min-height:34px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.cw-mini.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.cw-msg{font-size:14px;line-height:1.45;color:var(--t3);margin:12px 0 0;min-height:1px}
.cw-msg:empty{display:none}
.cw-msg.no{color:var(--no)}
.cw-msg.ok{color:var(--go)}
.cw-lead{font-size:17px;line-height:1.45;color:var(--ink);margin:0 0 16px}
.cw-sec{margin:26px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
.cw-list{list-style:none;margin:0 0 18px;padding:0}
.cw-list li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);margin:0 0 8px}
.cw-who{flex:1 1 auto;min-width:0}
.cw-who b{font-weight:650;font-size:15.5px;overflow-wrap:anywhere}
.cw-who span{font-size:13px;color:var(--t3);margin-left:8px}
.cw-ask{flex:1 1 100%;font-size:14px;color:var(--ink2)}
.cw-acts{display:flex;flex-wrap:wrap;gap:8px}
.cw-list .cw-msg{flex:1 1 100%;margin:0}
.cw-wait{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}
.cw .box p{margin:0 0 12px}
.cw .box .cw-msg{margin:12px 0 0}
.cw-rowbtn .chev{transition:transform .15s}
.cw-rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
[data-cw-trips] .crewtrip{margin-top:10px}
[data-cw-trips] .crewtrip+.list{margin-top:10px}
.cw-make,.mainact{margin:18px 0 0}
[data-cw-make-slot]{display:contents}
.cw-cond{font-size:15.5px;line-height:1.45;color:var(--ink);margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);overflow-wrap:anywhere}
.cw-cond.go{border-color:color-mix(in srgb,var(--go) 45%,var(--line))}
.cw-cond.slow,.cw-cond.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.cw-cond.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.cw-going{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cw-ans{width:100%;min-height:48px;font:inherit;font-size:15px;font-weight:600;color:var(--ink2);background:var(--paper);
  border:1px solid var(--line2);border-radius:12px;padding:0 6px;cursor:pointer}
.cw-ans[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:transparent}
.cw-ghead{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  font-size:13px;color:var(--t3);text-align:center}
.cw-names{list-style:none;margin:8px 0 0;padding:0;font-size:14px;line-height:1.5;color:var(--ink2);text-align:center}
.cw-names li{overflow-wrap:anywhere}
.cw-names li[data-waiting]{color:var(--t3)}
.cw-acts2{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.cw-acts2:empty{display:none}
.cw-act{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;font:inherit;font-size:14px;
  font-weight:600;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;cursor:pointer;text-decoration:none}
.cw-act.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.cw-act[disabled]{opacity:.55;cursor:default}
.cw-asks{margin:14px 0 0;font-size:15px;color:var(--ink)}
.cw-foot{margin:26px 0 0}
/* Planning a trip. */
.cw-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cw-two .cw-fld input{min-width:0}
.cw-seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 0 14px}
.cw-pick{min-height:48px;font:inherit;font-size:15px;font-weight:600;color:var(--ink2);background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:0 8px;cursor:pointer}
.cw-pick[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--paper))}
.cw-condslot:empty{display:none}
.cw-condslot{margin:0 0 14px}
.cw-condslot .cw-cond{margin:0}
/* Notes, the list and catches on a crew trip, and the Tell row. */
.cw-x{min-height:44px;padding:0 2px;font:inherit;font-size:13px;font-weight:600;color:var(--t3);background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.cw-plain.cw-main{color:var(--ink);border-color:var(--accent);font-weight:600}
.cw-tell{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.cw-foot .cw-tell{margin:14px 0 0}
.cw-tell-h{font-size:13px;color:var(--t3)}
.cw-pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;max-width:100%;padding:0 14px;font:inherit;font-size:14px;font-weight:600;
  color:var(--t3);background:var(--paper);border:1px solid var(--line);border-radius:999px;cursor:pointer;overflow-wrap:anywhere}
.cw-pill[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--paper))}
.cw-tell .cw-pill::before{content:"";flex:0 0 auto;width:9px;height:5px;margin-top:-3px;border:solid currentColor;border-width:0 0 2px 2px;
  transform:rotate(-45deg);opacity:0}
.cw-tell .cw-pill[aria-pressed="true"]::before{opacity:1}
.cw-nlist,.cw-clist{list-style:none;margin:0 0 14px;padding:0}
.cw-note{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:0 0 8px}
.cw-note-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0;font-size:13px;color:var(--t3)}
.cw-note-h b{font-size:14.5px;font-weight:650;color:var(--ink)}
.cw-note-b{margin:4px 0 0;font-size:15.5px;line-height:1.45;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.cw-note .cw-x,.cw-catch .cw-x{margin:2px 0 -10px}
.cw-note .cw-asks,.cw-catch .cw-asks{margin:10px 0 0;font-size:14.5px}
.cw-note .cw-acts2,.cw-catch .cw-acts2{margin:10px 0 0}
.cw-notebox textarea{min-height:76px}
.cw-sum{font-size:15px;line-height:1.45;color:var(--ink2);margin:0 0 12px}
.cw-items{list-style:none;margin:0 0 12px;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.cw-items:empty{display:none}
.cw-item{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;padding:4px 10px 4px 4px;border-top:1px solid var(--line)}
.cw-item:first-child{border-top:0}
.cw-tick{position:relative;flex:0 0 44px;width:44px;height:44px;padding:0;background:none;border:0;cursor:pointer}
.cw-tick::before{content:"";position:absolute;left:11px;top:11px;width:22px;height:22px;border:2px solid var(--line2);border-radius:7px}
.cw-tick[aria-checked="true"]::before{border-color:var(--go)}
.cw-tick[aria-checked="true"]::after{content:"";position:absolute;left:19px;top:14px;width:6px;height:11px;border:solid var(--go);
  border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.cw-item-l{flex:1 1 0;min-width:0;padding:8px 0;font-size:15.5px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.cw-item.done .cw-item-l{color:var(--t3)}
.cw-item.done .cw-item-l > span:first-child{text-decoration:line-through}
.cw-item-l .cw-wait{display:block;margin-top:2px}
.cw-whob{flex:0 0 auto;max-width:42%;min-height:44px;padding:0 13px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);
  background:transparent;border:1px solid var(--line);border-radius:999px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-whob.none{color:var(--t3);border-style:dashed}
.cw-whob[aria-expanded="true"]{color:var(--ink);border-color:var(--accent)}
.cw-panel{flex:1 1 100%;min-width:0;margin:4px 0 8px 6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.cw-panel-h{margin:0 0 8px;font-size:13px;color:var(--t3)}
.cw-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cw-panel .cw-acts2{margin:0}
.cw-panel .cw-asks{margin:0 0 10px}
.cw-panel .cw-fld{margin:0 0 10px}
.cw-addline{display:flex;gap:8px;align-items:center}
.cw-addline input{flex:1 1 0;min-width:0;min-height:48px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:0 14px}
.cw-addline input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cw-addline .cw-act{flex:0 0 auto;min-height:48px;border-radius:12px}
.cw-catch{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:0 0 8px}
.cw-thumb{flex:0 0 76px;width:76px;height:76px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);
  cursor:pointer;font:inherit;font-size:11px;line-height:1.3;color:var(--t3)}
.cw-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.cw-thumb[data-nophoto]{cursor:default}
.cw-thumb[data-nophoto]::after{content:"Photo needs a signal"}
.cw-catch-t{flex:1 1 0;min-width:0}
.cw-catch-h{margin:0;font-size:15.5px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.cw-catch-h b{font-weight:650}
.cw-catch-h span{margin-left:8px;font-family:var(--mono);font-size:13px;color:var(--ink2)}
.cw-catch-m{margin:3px 0 0;font-size:13px;line-height:1.4;color:var(--t3);overflow-wrap:anywhere}
.cw-catch-n{margin:4px 0 0;font-size:14.5px;line-height:1.45;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.cw-form{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.cw-photo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.cw-photo img{display:block;width:96px;height:96px;object-fit:cover;border:1px solid var(--line);border-radius:10px}
.cw-file{position:relative;overflow:hidden}
.cw-file input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
.cw-file:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.cw-big{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.cw-big img{display:block;max-width:100%;max-height:calc(100dvh - 140px);border-radius:12px;object-fit:contain}
/* alerts on the crew screen: rows that are switches, and the notes that sit under a row */
.cw-mark{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--go)}
.cw-al{margin:28px 0 0}
.cw-al > h2{margin-top:0}
.cw-al-sum{font-size:15.5px;line-height:1.45;color:var(--ink);margin:0 0 12px}
.cw-al-k{font-size:13px;color:var(--t3);margin:18px 0 6px}
.cw-sws{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.cw-sw{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 14px;font:inherit;text-align:left;color:var(--ink);
  background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.cw-sw:first-child{border-top:0}
.cw-sw:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cw-sw-t{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.cw-sw-t b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.cw-sw-t span{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--t3)}
.cw-sw-k{flex:0 0 auto;position:relative;width:46px;height:28px;border-radius:14px;background:var(--panel3);border:1px solid var(--line2);
  transition:background .15s}
.cw-sw-k::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .15s}
.cw-sw[aria-checked="true"] .cw-sw-k{background:var(--go);border-color:transparent}
.cw-sw[aria-checked="true"] .cw-sw-k::after{transform:translateX(18px);background:var(--paper)}
.cw-sw-note{padding:12px 14px;border-top:1px solid var(--line);background:var(--panel2);font-size:14.5px;line-height:1.45;color:var(--ink2)}
.cw-sw-note p{margin:0 0 4px}
.cw-sw-note ol{margin:8px 0 0;padding:0 0 0 20px}
.cw-sw-note li{margin:0 0 4px}
.cw-sw-note .cw-act,.cw-sw-note .cw-plain{margin-top:10px}
.cw-sw-note .cw-fld{margin:10px 0 0}
.cw-sw-note .cw-msg{margin:10px 0 0}
.cw-sw-note > .cw-msg:first-child{margin-top:0}
.cw-sw-note.warn{color:var(--ink)}
.cw-sw-note.warn p:first-child{color:var(--warn);font-weight:600}
.cw-al .cw-two{margin-top:16px}
.cw-al .cw-two .cw-fld{margin-bottom:0}
.cw-al .cw-plain{margin-top:18px}
.cw-al-lines .cw-msg{margin:10px 0 0}
.cw-al [data-al-note]{margin:0 0 12px}
.asof{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 0;font-size:12.5px;line-height:1.45;color:var(--t3)}
.asof .chip{position:relative}
.asof .chip::after{content:"";position:absolute;inset:-8px}
.pn{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin:14px 0 0}
.pnb{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:9px 13px;text-decoration:none;
  background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--ink);min-width:0}
.pnb:hover,.pnb:active{border-color:var(--accent)}
.pnb.next{text-align:right}
.pnb span{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--accent)}
.pnb b{font-weight:650;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnb.none{visibility:hidden}
.pos{align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--t3);white-space:nowrap}
[data-view="card"] .card{margin-bottom:0}

/* ---- species picker ---- */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 0}
.pickcard{
  display:flex;flex-direction:column;justify-content:flex-start;width:100%;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:16px 14px;
  box-shadow:var(--sh);transition:border-color .15s,transform .15s;
  font:inherit;color:inherit;
}
.pickcard .meta{display:block;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600}
.pickcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.pickcard .nm{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;font-size:26px;color:var(--ink);line-height:1}
.pickcard .sub{display:block;font-size:12.5px;color:var(--t3);margin-top:5px;line-height:1.4}

/* ---- where ---- */
.locs{display:contents}
.locone{font-size:13px;color:var(--t3);margin:0 0 4px}
.locone strong{color:var(--ink2);font-weight:600}

/* ---- card groups ---- */
.card{padding:15px 16px;margin:0 0 12px;line-height:1.55}
.card > h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;font-size:17px;margin:0 0 8px;color:var(--ink)}
.card .when{margin-bottom:2px}
.card p{font-size:14.5px;color:var(--ink2);margin:0 0 10px}
.card :last-child{margin-bottom:0}
.card p.stamp{font-family:var(--mono);font-size:11px;color:var(--t3);margin:14px 0 0;
  padding-top:8px;border-top:1px solid var(--line)}
/* The card's title is in the sky on a screen that shows one card. */
[data-view="card"] .card>h3,[data-view="crewtrip"][data-sec] .card>h3{display:none}

/* ---- add to trip ---- */
.addtrip{
  display:block;width:100%;margin:14px 0 0;padding:10px;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:13.5px;
  background:var(--panel2);color:var(--t2);
  border:1px dashed var(--line2);border-radius:10px;transition:all .15s;
}
.addtrip:hover{color:var(--ink2);border-color:var(--accent)}
.addtrip[aria-pressed="true"]{
  background:color-mix(in srgb,var(--go) 14%,var(--panel));
  color:var(--go);border-style:solid;border-color:color-mix(in srgb,var(--go) 45%,var(--line));
}

/* ---- trip bar ---- */
.tripbar{
  position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;margin:22px -4px 0;padding:8px 8px 8px 18px;
  display:flex;align-items:center;gap:12px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:var(--e2),inset 0 1px 0 var(--rim),inset 0 0 0 1px color-mix(in srgb,var(--lum) 22%,transparent);
}
.screen:has(.tripbar) .act{bottom:calc(76px + env(safe-area-inset-bottom))}
.tripbar span{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;font-size:14px;color:var(--t2)}
/* The trip bar's button is ink, like the lit tab: gold is kept for the one
   main action on a screen. */
.tripgo{
  flex:0 0 auto;min-height:40px;padding:0 18px;border-radius:999px;cursor:pointer;border:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 88%,var(--paper)),var(--ink));color:var(--paper);
  font:700 14px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;
  box-shadow:0 1px 1px color-mix(in srgb,var(--shade) 30%,transparent),inset 0 1px 0 color-mix(in srgb,var(--paper) 22%,transparent);
}

/* ---- field mode ---- */
/* Bigger everything. Cold hands, head lamp, one eye on the rod. */
.fieldmode .hero{padding-top:calc(26px + env(safe-area-inset-top));min-height:calc(var(--sw)*268/390 - 20px)}
.tripdate{font:600 12.5px/1.25 Inter,system-ui,sans-serif;color:var(--t1);min-height:36px;padding:4px 11px;border:0;border-radius:999px;
  background:var(--glass);box-shadow:var(--e1),inset 0 1px 0 var(--rim)}
.fieldmode .card{padding:18px 18px;border-radius:18px;margin-bottom:16px}
.fieldmode .card > h3{font-size:21px;margin-bottom:11px}
.fieldmode .card p,.fieldmode .box{font-size:17px;line-height:1.5}
.fieldmode .box{padding:15px 17px;border-radius:15px}
.fieldmode .box b{font-size:15.5px}
.fieldmode ol.steps li{font-size:17px;padding-left:44px}
.fieldmode .sp .v{font-size:15px}
.fieldmode .sp .have{font-size:12px}
.fieldmode .card p.stamp{font-size:12.5px}

/* Four spec columns is too tight on a phone. The original card had this and
   the new spec strip needs it just as much. */
@media (max-width:420px){
  .specs{grid-template-columns:repeat(2,1fr)}
}

/* ---- the crew's screens in the new shell, until their own stage ---- */
.cw.float{padding:16px}
.cw.float>:first-child{margin-top:0}
.cw.float>.cw-out:last-child,.cw.float>.cw-plain:last-child{margin-bottom:0}
.float.cw-cond{display:flex;align-items:center;min-height:calc(var(--sw)*88/390);margin:0;padding:14px 16px;border:0;border-radius:22px;font-weight:600;
  background:linear-gradient(180deg,var(--glass),var(--pan-b) 62%)}
.float.cw-cond.go{box-shadow:var(--e2),inset 0 1px 0 var(--rim),inset 0 0 0 1.5px color-mix(in srgb,var(--go) 50%,transparent)}
.float.cw-cond.no{box-shadow:var(--e2),inset 0 1px 0 var(--rim),inset 0 0 0 1.5px color-mix(in srgb,var(--no) 50%,transparent)}
.hero+.cw-msg{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:14px;color:var(--t2);background:var(--glass);box-shadow:var(--e1)}
[data-cw-going].grp{margin-top:18px}
[data-hot-wait]{min-height:calc(var(--sw)*88/390)}
[data-notlisted] .box p{margin:0}
[data-notlisted] .box p+p{margin-top:6px}
.float.fallback{padding:14px 16px}
.float.fallback .box{margin-top:12px}
.grp[data-cw-trips]{margin-top:0}

  .floatbob{animation:none}
  .pickcard:hover{transform:none}
}
</style>
</head>
<body>
<!-- Shared rig parts. Diagrams draw them with <use href="#hook">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="hook" viewBox="0 0 40 104">
    <circle cx="20" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M20 12.5 L20 58" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M20 58 C20 86 9 92 5.5 76 L5.5 58" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5.5 63 L11 70" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="swivel" viewBox="0 0 22 42">
    <circle cx="11" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
    <rect x="6" y="11.5" width="10" height="19" rx="4.5" fill="currentColor"/>
    <circle cx="11" cy="36" r="4.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
  </symbol>
  <symbol id="shot" viewBox="0 0 20 16">
    <ellipse cx="10" cy="8" rx="9" ry="7.2" fill="currentColor"/>
    <path d="M10 1.2 L10 14.8" stroke="var(--panel)" stroke-width="1.6"/>
  </symbol>
</defs></svg>
<div class="phone">
  <div class="scene" id="scene" data-scene="sound" aria-hidden="true"></div>
  <div id="app" class="screen"></div>
</div>

<script src="/rigs/diagrams.js"></script>
<script src="/rigs/content.js"></script>
<script src="/rigs/trips.js"></script>
<script src="/rigs/runs.js"></script>
<script src="/rigs/crew.js"></script>
<script src="/rigs/rules.js"></script>
<script src="/rigs/waters.js"></script>
<script>
(function () {
  "use strict";
  var RIG = (window.RIG = window.RIG || {});
  RIG.version = "1";

  var app = document.getElementById("app");
  var KEY = "rig.trip.v1";

  var GROUPS = [
    { key: "technique", label: "Technique", short: "Watch" },
    { key: "before", label: "Before you go", short: "Plan" },
    { key: "water", label: "At the water", short: "Fish" },
    { key: "after", label: "After", short: "After" }
  ];

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // ---- the look -----------------------------------------------------------
  // Every screen is built from the kit (rigs/kit.css) under a painted scene
  // (rigs/scene.js, rigs/scene.css). To put a screen into the look:
  //   topHtml(tab, active, scene)     the dock. scene: "sound", "pier" or "river".
  //   heroHtml({ title, back, chips }) the title in the sky and its line of chips.
  //   then one .float card first (it crosses the waterline), then .panel
  //   cards, .well notes and h2.sect headings.
  // The scene itself is one element that outlives every redraw: setScene()
  // repaints it only when the place changes.
  var LOOK = !!(RIG.water && RIG.sky);
  var IC = {
    chev: '<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: '<svg viewBox="0 0 8 14" aria-hidden="true"><path d="M6.5 1.5 1.5 7l5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    go: '<svg viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  var sceneEl = document.getElementById("scene");
  function setScene(kind) {
    if (!sceneEl || !LOOK) return;
    kind = RIG.water.scenes.indexOf(kind) >= 0 ? kind : "sound";
    if (sceneEl.getAttribute("data-scene") === kind && sceneEl.dataset.painted) return;
    sceneEl.setAttribute("data-scene", kind);
    delete sceneEl.dataset.painted;
    RIG.water.scene(sceneEl);
  }
  // The title in the sky. o.title, o.back {href, text}, o.chips (html, on
  // glass: nothing small is ever written straight on the picture), o.attr
  // (extra attributes for the h1), o.more (html under the chips).
  function heroHtml(o) {
    var n = String(o.title || "").length;
    var size = n > 34 ? "xl" : n > 17 ? "long" : "";
    var back = o.back ? '<a class="chip back" href="' + esc(o.back.href) + '" data-up>' + IC.back + "<span>" + esc(o.back.text) + "</span></a>" : "";
    var chips = back + (o.chips || "");
    return '<header class="hero shead"><h1' + (size ? ' class="' + size + '"' : "") + (o.attr ? " " + o.attr : "") + ">" + esc(o.title) + "</h1>" +
      (chips ? '<p class="chips">' + chips + "</p>" : "") + (o.more || "") + "</header>";
  }
  function pct(v) { return (Math.max(0, Math.min(1, v)) * 100).toFixed(1); }
  function initial(name) { return esc(String(name || "").trim().charAt(0).toUpperCase() || "?"); }
  // Up to three faces, overlapping: who is going.
  function avsHtml(names) {
    return names.length ? '<span class="avs" aria-hidden="true">' + names.slice(0, 3).map(function (n, i) {
      return '<i class="av a' + (i % 3 + 1) + '">' + initial(n) + "</i>";
    }).join("") + "</span>" : "";
  }
  // "A", "A and B", "A, B and C".
  function andList(a) { return a.length < 3 ? a.join(" and ") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }

  function species() { return (RIG.content && RIG.content.species) || []; }
  function fundamentals() { return (RIG.content && RIG.content.fundamentals) || []; }
  function findSpecies(id) {
    var a = species();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function findLocation(sp, id) {
    var l = (sp && sp.locations) || [];
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return l[0] || null;
  }
  // A string in a cards list points at a shared card, written once and used
  // by every fish it is true for (the river rigs serve king, coho, chum and
  // steelhead alike).
  function shared() { return (RIG.content && RIG.content.shared) || []; }
  function resolve(list) {
    return (list || []).map(function (c) {
      return typeof c === "string" ? shared().filter(function (x) { return x.id === c; })[0] : c;
    }).filter(Boolean);
  }
  function cardsFor(sp, loc) { return resolve(sp.cards).concat(resolve(loc && loc.cards)); }

  // Every card in the library, flat, so Field mode can resolve a saved id
  // without knowing which species or location it came from.
  function allCards() {
    var out = fundamentals().concat(shared());
    function own(list) { return (list || []).filter(function (c) { return typeof c !== "string"; }); }
    species().forEach(function (sp) {
      out = out.concat(own(sp.cards));
      (sp.locations || []).forEach(function (l) { out = out.concat(own(l.cards)); });
    });
    return out;
  }

  // ---- trip state -------------------------------------------------------
  // Storage can throw: iOS private browsing rejects setItem outright. Losing
  // the saved trip is survivable, a blank page is not, so every access is
  // guarded and a failure degrades to in-memory with a visible notice.
  var storageBroken = false;
  var state = { cards: [], date: "", mode: "" };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      state.cards = Array.isArray(p.cards) ? p.cards.slice() : [];
      state.date = typeof p.date === "string" ? p.date : "";
      state.mode = p.mode === "field" || p.mode === "library" ? p.mode : "";
    } catch (e) { storageBroken = true; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { storageBroken = true; }
  }

  RIG.trip = {
    list: function () { return state.cards.slice(); },
    has: function (id) { return state.cards.indexOf(id) !== -1; },
    add: function (id) { if (!this.has(id)) { state.cards.push(id); save(); render(); } },
    remove: function (id) {
      var i = state.cards.indexOf(id);
      if (i !== -1) { state.cards.splice(i, 1); save(); render(); }
    },
    toggle: function (id) { this.has(id) ? this.remove(id) : this.add(id); },
    date: function () { return state.date; },
    setDate: function (iso) { state.date = iso || ""; save(); render(); },
    clear: function () { state.cards = []; state.date = ""; state.mode = ""; save(); render(); }
  };

  // Mode is whatever Coach last chose, and nothing else. It persists, so
  // the pier case is zero taps: he switched to field mode when he got there
  // last time and that is where it opens.
  //
  // An earlier version inferred field mode from "a saved trip has cards in
  // it". That guesses wrong in both directions: adding the first card while
  // planning threw him out of the library he was working in, and a trip
  // planned over several evenings reopened into field mode every time. The
  // app cannot know where he is standing, so it stops pretending to.
  var activeMode = "library";
  function resolveMode() {
    activeMode = state.mode || "library";
  }
  function mode() { return activeMode; }
  function setMode(m) { activeMode = m; state.mode = m; save(); render(); }

  // ---- staleness --------------------------------------------------------
  // Only content that actually decays gets a warning, and each kind decays at
  // its own rate. `dated` alone is just a "last checked" stamp: a rod spec
  // does not go off in three weeks, so warning about it trains Coach to
  // ignore the banner that matters. A card opts in with shelfDays.
  //   regs       ~180 days, limits move season to season
  //   tide/moon  ~2 days, those are numbers for one specific night
  function staleFor(card) {
    if (!card.dated || !card.shelfDays) return null;
    var d = Date.parse(card.dated);
    // With no trip date set, measure against TODAY. Requiring a trip date
    // meant the default path showed month old numbers with nothing but a
    // quiet "good as of" stamp, which is the exact thing the warning exists
    // to prevent.
    var t = state.date ? Date.parse(state.date) : Date.now();
    if (isNaN(d) || isNaN(t)) return null;
    return t - d > card.shelfDays * 86400000 ? card.dated : null;
  }

  // ---- rendering --------------------------------------------------------
  function cardHtml(c, opts) {
    opts = opts || {};
    var dia = c.diagram && RIG.diagrams && RIG.diagrams[c.diagram]
      ? '<div class="dia">' + RIG.diagrams[c.diagram] + "</div>" : "";
    var stale = staleFor(c);
    var warn = stale
      ? '<div class="box red" data-stale><b>this is out of date</b>' +
        "These numbers were good as of <strong>" + esc(stale) + "</strong>, and your trip is set for " +
        esc(state.date) + ". Pull them again before you rely on them.</div>"
      : "";
    var stamp = c.dated ? '<p class="stamp">Good as of ' + esc(c.dated) + "</p>" : "";
    var add = opts.addable
      ? '<button class="addtrip" type="button" data-addtrip="' + esc(c.id) + '" aria-pressed="' +
        (RIG.trip.has(c.id) ? "true" : "false") + '">' +
        (RIG.trip.has(c.id) ? "In this trip" : "Add to trip") + "</button>"
      : "";
    return '<article class="card panel" data-card="' + esc(c.id) + '">' +
      "<h3>" + esc(c.title) + "</h3>" + warn + dia + c.body + stamp + add + "</article>";
  }

  function noticeHtml() {
    return storageBroken
      ? '<div class="box red" data-trip-notice><b>this trip will not be saved</b>' +
        "Your browser is refusing to store it, which private browsing does. " +
        "It works for now and it will be gone when you close the tab.</div>"
      : "";
  }

  function tripBarHtml() {
    var n = state.cards.length;
    if (!n) return "";
    return '<div class="tripbar">' +
      '<span data-trip-count>' + n + (n === 1 ? " card" : " cards") + " in this trip</span>" +
      '<button class="tripgo" type="button" data-mode-field>Field mode</button></div>';
  }

  // ---- headlines first ----------------------------------------------------
  // Coach, 2026-11-21: "I see the headlines and dig in, not everything in
  // front of me at once." Every list is a column of headline rows. A card
  // opens alone on its own screen, with next and back.
  function types() { return (RIG.content && RIG.content.types) || []; }
  function spots() { return (RIG.content && RIG.content.spots) || []; }
  function findSpot(id) { return spots().filter(function (s) { return s.id === id; })[0] || null; }
  function findType(id) { return types().filter(function (t) { return t.id === id; })[0] || null; }
  function speciesAt(spotId) {
    return species().filter(function (sp) {
      return (sp.locations || []).some(function (l) { return l.id === spotId; });
    });
  }
  // A spot with no cards behind it is an empty widget, so it never shows.
  function spotsOfType(t) {
    return spots().filter(function (s) { return s.types.indexOf(t) !== -1 && speciesAt(s.id).length; });
  }

  var ICONS = {
    river: '<path d="M4 13c5-5 9 5 14 0s9 5 14 0 6 3 6 3"/><path d="M2 22c5-5 9 5 14 0s9 5 14 0 8 3 8 3"/><path d="M4 31c5-5 9 5 14 0s9 5 14 0 6 3 6 3"/>',
    beach: '<circle cx="29" cy="11" r="5"/><path d="M3 27c5-4 9 4 14 0s9 4 14 0 6 2 6 2"/><path d="M3 35h34"/>',
    lake: '<ellipse cx="20" cy="27" rx="16" ry="7"/><path d="M11 21V7"/><path d="M15 20V11"/><path d="M8 22v-9"/>',
    pier: '<path d="M2 14h36"/><path d="M8 14v19M18 14v19M28 14v19"/><path d="M2 27c4-3 7 3 11 0s7 3 11 0 7 3 11 0"/>',
    "kayak-lake": '<path d="M3 24c8 4 26 4 34 0-8-3-26-3-34 0z"/><path d="M10 9l20 26"/><ellipse cx="20" cy="33" rx="15" ry="3"/>',
    fly: '<path d="M24 6v20c0 7-10 7-10 0v-3"/><path d="M14 23l3 3"/><path d="M24 10c-8-2-14 2-16 8 6 0 12-2 16-6"/><path d="M24 14c6-3 11-1 13 3-5 1-10 0-13-2"/>',
    "kayak-sound": '<path d="M3 21c8 4 26 4 34 0-8-3-26-3-34 0z"/><path d="M10 6l20 26"/><path d="M2 33c4-3 7 3 11 0s7 3 11 0 7 3 11 0"/>'
  };
  function icon(id) {
    return '<svg class="ic" viewBox="0 0 40 40" aria-hidden="true">' + (ICONS[id] || "") + "</svg>";
  }

  // The first "when" line of a card, as plain text, for its headline row.
  var scratch = document.createElement("div");
  function snippet(c) {
    var m = /<p class="when">([\s\S]*?)<\/p>/.exec(c.body || "");
    if (!m) return "";
    scratch.innerHTML = m[1];
    return scratch.textContent.trim();
  }
  function metaOf(c) {
    var b = c.body || "";
    var v = (b.match(/class="vid"/g) || []).length;
    if (v) return v + (v === 1 ? " video" : " videos");
    if (/class="tyer"/.test(b)) return "Step by step";
    if (c.diagram) return "Diagram";
    return "";
  }

  function rowHtml(c, href) {
    var s = snippet(c), m = metaOf(c);
    return '<a class="row" href="' + esc(href) + '" data-row="' + esc(c.id) + '">' +
      '<span class="tx"><b>' + esc(c.title) + "</b>" + (s ? lineHtml(s, m ? m.length * 7 + 12 : 0) : "") + "</span>" +
      (m ? '<span class="rm">' + esc(m) + "</span>" : "") +
      IC.chev + '</a>';
  }

  function chip(attr, id, text, active) {
    return '<button class="chip jp" type="button" ' + attr + '="' + esc(id) + '" aria-current="' +
      (id === active ? "true" : "false") + '">' + esc(text) + "</button>";
  }
  function learnSections() {
    var names = [];
    fundamentals().forEach(function (c) { if (c.section && names.indexOf(c.section) === -1) names.push(c.section); });
    return names;
  }
  function chipsFor(tab, active) {
    if (tab === "water") return types().filter(function (t) { return spotsOfType(t.id).length; })
      .map(function (t) { return chip("data-type", t.id, t.label, active); }).join("");
    if (tab === "fish") return species().map(function (sp) { return chip("data-species", sp.id, sp.name, active); }).join("");
    if (tab === "learn") return learnSections().map(function (n) { return chip("data-sec", n.toLowerCase(), n, active); }).join("");
    return "";
  }

  // The dock, pinned: four ways in and the sky button, and under them one
  // tap filters for whichever way is open. It also sets the scene the screen
  // stands under.
  function topHtml(tab, active, scene) {
    setScene(scene);
    var m = skyMode();
    var tabs = [["trips", "Trips"], ["water", "Water"], ["fish", "Fish"], ["learn", "Learn"]].map(function (t) {
      return '<button class="tab" type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' +
        (t[0] === tab ? "true" : "false") + '">' + t[1] + "</button>";
    }).join("");
    var sub = chipsFor(tab, active);
    // The sky button needs the sky engine. Without it the button could not
    // change the screen, so it is not there.
    return '<header class="top dock"><nav class="tabs seg" role="tablist">' + tabs + "</nav>" +
      (RIG.sky ? '<button class="skymode skybtn" type="button" data-skymode data-held="' + (m === "auto" ? "no" : "yes") +
      '" title="Screen: follows the sky, or held light or dark"><i class="skytok"></i>' +
      "<span data-skylabel>" + (m === "auto" ? "Sky" : m === "light" ? "Light" : "Dark") + "</span></button>" : "") +
      (sub ? '<nav class="jump" aria-label="Filter">' + sub + "</nav>" : "") + "</header>";
  }

  // The usual head: the title, and one chip that says where you are.
  // eyebrow is html, title and line are text. back: { href, text }.
  function headHtml(eyebrow, title, line, back) {
    var say = (eyebrow ? "<b>" + eyebrow + "</b>" : "") + (eyebrow && line ? " " : "") + (line ? esc(line) : "");
    return heroHtml({ title: title, back: back, chips: say ? '<span class="chip wrap">' + say + "</span>" : "" });
  }

  // Cards in the order the groups render them, so next and back read in the
  // same order as the list.
  function ordered(cards) {
    var out = [];
    GROUPS.forEach(function (g) { out = out.concat(cards.filter(function (c) { return c.group === g.key; })); });
    return out;
  }

  function renderHome() {
    var tiles = types().map(function (t) {
      var n = spotsOfType(t.id).length;
      if (!n) return "";
      return '<a class="wtile panel" href="#/water/' + esc(t.id) + '" data-type-tile="' + esc(t.id) + '">' + icon(t.id) +
        '<span class="nm">' + esc(t.label) + '</span><span class="meta">' + n + (n === 1 ? " spot" : " spots") + "</span></a>";
    }).join("");
    app.innerHTML = topHtml("water") +
      '<div data-view="home">' + headHtml("Fishing library", "Rig Card", "How do you want to fish?") +
        noticeHtml() + '<div class="wtiles">' + tiles + "</div></div>" + tripBarHtml();
  }

  function renderWater(t) {
    var rows = spotsOfType(t.id).map(function (s) {
      var names = speciesAt(s.id).map(function (sp) { return sp.name; }).join(", ");
      return '<a class="row" href="#/spot/' + esc(s.id) + '" data-spot="' + esc(s.id) + '">' +
        '<span class="tx"><b>' + esc(s.name) + "</b><span>" + esc(s.where) + "</span></span>" +
        '<span class="rm">' + esc(names) + '</span>' + IC.chev + '</a>';
    }).join("");
    // Kayak water also gets the boat itself, and Fly gets the casting course.
    function learnLink(attr, sec, head, title, sub) {
      return fundamentals().some(function (c) { return c.section === sec; })
        ? '<section class="grp" ' + attr + '><h2 class="sect">' + head + '</h2><div class="panel list"><a class="row" href="#/learn/' + sec.toLowerCase() + '">' +
          '<span class="tx"><b>' + title + "</b><span>" + sub + "</span></span>" +
          IC.chev + '</a></div></section>'
        : "";
    }
    var kayak = /^kayak/.test(t.id) ? learnLink("data-kayak", "Kayak", "The kayak", "Kayak safety and gear", "Go or no go, packing, anchor, getting back in")
      : t.id === "fly" ? learnLink("data-flylearn", "Fly", "Learn it", "Fly casting course", "Rig, cast, roll cast, flies, yard practice") : "";
    app.innerHTML = topHtml("water", t.id) +
      '<div data-view="water">' + headHtml(icon(t.id), t.label, "") +
        '<div class="panel list">' + rows + "</div>" + kayak + "</div>" + tripBarHtml();
  }

  function renderSpot(s) {
    var list = speciesAt(s.id);
    var rows = list.map(function (sp) {
      var loc = findLocation(sp, s.id);
      var n = cardsFor(sp, loc).length;
      return '<a class="row" href="#/' + esc(sp.id) + "/" + esc(s.id) + '" data-row-species="' + esc(sp.id) + '">' +
        '<span class="tx"><b>' + esc(sp.name) + "</b>" + (sp.hint ? "<span>" + esc(sp.hint) + "</span>" : "") + "</span>" +
        '<span class="rm">' + n + ' cards</span>' + IC.chev + '</a>';
    }).join("");
    var t = findType(s.types[0]);
    app.innerHTML = topHtml("water", t && t.id) +
      '<div data-view="spot">' + headHtml(esc(s.where), s.name, "What are you after?") +
        '<div class="panel list">' + rows + "</div></div>" + tripBarHtml();
  }

  function renderFish() {
    function pick(sp) {
      var n = (sp.cards || []).length;
      (sp.locations || []).forEach(function (l) { n += (l.cards || []).length; });
      var spotsN = (sp.locations || []).length;
      return '<button class="pickcard" type="button" data-species="' + esc(sp.id) + '">' +
        '<span class="nm">' + esc(sp.name) + "</span>" +
        '<span class="sub">' + esc(sp.hint || "") + "</span>" +
        '<span class="meta">' + n + " cards" + (spotsN ? " · " + spotsN + (spotsN === 1 ? " spot" : " spots") : "") +
        "</span></button>";
    }
    var fams = (RIG.content && RIG.content.families) || [];
    var body = fams.map(function (f) {
      var mine = species().filter(function (sp) { return sp.family === f.id; });
      return mine.length ? '<section class="grp" data-family="' + esc(f.id) + '"><h2 class="sect">' + esc(f.label) + "</h2>" +
        '<div class="pick">' + mine.map(pick).join("") + "</div></section>" : "";
    }).join("");
    var loose = species().filter(function (sp) { return !fams.some(function (f) { return f.id === sp.family; }); });
    if (loose.length) body += '<div class="pick">' + loose.map(pick).join("") + "</div>";
    app.innerHTML = topHtml("fish") +
      '<div data-view="fish">' + headHtml("By fish", "What are you after?", "") + body + "</div>" + tripBarHtml();
  }

  // A day's heading: its name, its date, a ribbon of its own light from five
  // in the morning to eleven at night with a bead where each trip starts
  // (gold if it is hot), and the count.
  // Where each trip's bead sits on the ribbon, as a share of its width. Trips
  // that start at the same hour would land on one spot, so beads that touch
  // fan out into a small cluster about the hour they share: a bead can be
  // counted for every trip.
  function beadSpots(trips) {
    var GAP = 0.08, lo = 0.045, hi = 0.955, out = [], groups = [];
    trips.map(function (t, i) { return { i: i, x: Math.max(lo, Math.min(hi, (t.from - 5) / 18)) }; })

      .forEach(function (p) {
        var g = { items: [p], sum: p.x };
        // Join the cluster before it while the two would overlap.
        for (var last = groups[groups.length - 1]; last && g.sum / g.items.length - (g.items.length - 1) * GAP / 2 < last.sum / last.items.length + (last.items.length + 1) * GAP / 2; last = groups[groups.length - 1]) {

  // My own row in the crew list follows my switches, and so does what the

    if (!st || !st.me || !st.members) return;

  }
  // One change, saved now. area says where a failure is reported.

  // Every tap on a crew screen. Returns true when the tap was one of ours.
  function crewClick(t) {

  function renderTrips(force) {

  // ---- Hot Trips map ------------------------------------------------------
  // Same trips as the list, as pins. Leaflet is loaded only when the map is
  // opened, from our own copy. Map tiles are OpenStreetMap and need a signal;
  // the list does not, so the map says so instead of going blank.
  var HOME = [47.177, -122.186]; // Bonney Lake, city centre
  var leafletP = null, mapObj = null, mapDay = "all";
  function loadLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    if (leafletP) return leafletP;
    leafletP = new Promise(function (ok, no) {
      var css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "/rigs/vendor/leaflet.css";
      document.head.appendChild(css);
      var s = document.createElement("script");
      s.src = "/rigs/vendor/leaflet.js";
      s.onload = function () { ok(window.L); };
      s.onerror = function () { leafletP = null; no(new Error("leaflet did not load")); };
      document.head.appendChild(s);
    });
    return leafletP;
  }
  function shortDay(day) { return day.label.replace(/ [A-Z][a-z]{2} (\d+)$/, " $1"); }
  function renderMap() {
    app.innerHTML = topHtml("trips", "map") +
      '<div data-view="map">' + tripsHeroHtml("map", '<nav class="days" data-days aria-label="Day"></nav>') +
      '<div class="mapbox" id="tripmap"><div class="well"><p>Loading the map…</p></div></div>' +
      '<p class="legend"><span class="mk hot"><i></i>Hot</span><span class="mk good"><i></i>Good</span>' +
      '<span class="mk dim"><i></i>Nothing good</span><span class="mk home"><i></i>Home</span></p></div>' + tripBarHtml();
    if (!plannerReady()) return;
    RIG.trips.load().then(function (data) {
      if (!/^#\/trips\/map/.test(location.hash)) return;
      lastPlan = planFrom(data);
      drawMap(lastPlan);
    }).catch(function () {
      var box = document.getElementById("tripmap");
      if (box) box.innerHTML = '<div class="well no" data-quiet><p><b>No forecast yet.</b> The weather servers did not answer. Open this once with a signal.</p></div>';
    });
  }
  function drawMap(p) {
    var days = app.querySelector("[data-days]"), box = document.getElementById("tripmap");
    if (!days || !box) return;
    if (mapDay !== "all" && !p.days.some(function (d) { return d.iso === mapDay; })) mapDay = "all";
    days.innerHTML = chip("data-mapday", "all", "All week", mapDay) +
      p.days.map(function (d) { return chip("data-mapday", d.iso, shortDay(d) + (d.trips.length ? " · " + d.trips.length : ""), mapDay); }).join("");
    var bySpot = {};
    p.days.forEach(function (d) {
      if (mapDay !== "all" && d.iso !== mapDay) return;
      d.trips.forEach(function (t) { (bySpot[t.spot] = bySpot[t.spot] || []).push({ day: d, t: t }); });
    });
    loadLeaflet().then(function (L) {
      if (!box.isConnected) return;
      if (mapObj) { try { mapObj.remove(); } catch (e) { /* container already gone */ } }
      box.innerHTML = "";
      mapObj = L.map(box, { zoomControl: false, attributionControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 17, className: "tiles-dark",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(mapObj);
