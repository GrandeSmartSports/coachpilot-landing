<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B9C4CC">
<title>Rig Card</title>
<link rel="manifest" href="/rigs/manifest.webmanifest">
<link rel="apple-touch-icon" href="/rigs/icon-v4-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rig Card">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="/rigs/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/rigs/kit.css">
<link rel="stylesheet" href="/rigs/scene.css">
<!-- the animals' colours: not on the first screen's path (Hot Trips draws no fish) -->
<link rel="preload" href="/rigs/fish.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/rigs/fish.css"></noscript>
<script src="/rigs/sky.js"></script>
<script src="/rigs/scene.js"></script>
<script>
// The sky before anything is drawn, so the page never opens in the wrong
// light. The clock alone decides here; the forecast refines it once it is read.
(function () {
  try {
    var n = new Date(), m = null;
    try { m = localStorage.getItem("rig.skymode.v1"); } catch (e) { /* private mode */ }
    var r = RIG.sky.resolve(n.getHours() + n.getMinutes() / 60, null, null, m === "light" || m === "dark" ? m : "auto");
    RIG.sky.apply(document.documentElement, r);
    RIG.water.dress(document.documentElement, r.p);
  } catch (e) { /* the overcast floor in kit.css stands */ }
})();
</script>
<style>
:root{
  /* What the older screens and the rig drawings read. The sky's own colours
     and the look's tokens are in kit.css. rigs/sky.js sets the panel and line
     shades for the sky as soon as it runs; these are the floor. */
  --panel:var(--paper);
  --panel2:color-mix(in srgb,var(--paper) 96.5%,var(--ink));
  --panel3:color-mix(in srgb,var(--paper) 93%,var(--ink));
  --bg2:color-mix(in srgb,var(--bg) 97%,var(--ink));
  --line2:color-mix(in srgb,var(--line) 75%,var(--ink));
  --sh:var(--e1);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* the drawings' own inks: they sit on a dark card in every sky */
  --water:#123243; --rope:#f0f4f7;
  --steel:#8c99a3; --steel2:#6b7883; --hi:#fff;
  --roe:#f0a071; --roe2:#d9542f; --roe3:#8e2f22; --lure:#f2563a; --lure2:#e8442c;
  --yarn:#ff3d8a; --chart:#8ef06a; --brass:#d9a441; --brass2:#b8862c;
}
/* The scene is painted once and stays put while the screens under it are
   redrawn. It sits straight in the phone column, so it reaches both edges. */
.phone>.scene{left:0;right:0}
/* An installed app on an iPhone draws the clock and battery in white over the
   top of the page. The sky there is often pale, so the strip they sit in is
   shaded with the shore tone. In a browser tab the inset is zero and this is
   nothing. */
.phone::before{content:"";position:fixed;z-index:50;left:0;right:0;top:0;height:env(safe-area-inset-top);pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--shore) 86%,transparent),color-mix(in srgb,var(--shore) 62%,transparent))}


.when{font-size:15px;color:var(--ink2);margin:0;max-width:52ch}

/* specs */
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.sp{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--sh)}
.sp .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:700}
.sp .v{font:700 16px/1.15 "Barlow Condensed",sans-serif;letter-spacing:.01em;margin-top:4px;color:var(--ink)}
.sp .have{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font:600 11px/1.3 Inter,system-ui,sans-serif;color:var(--t3)}

/* diagram */
/* The rig and knot drawings are built for a dark ground, so they keep one in
   every sky, like a photograph printed on the page. */
.dia,.tyer{--bg:#0a0d10;--panel:#141a20;--panel2:#1a222a;--panel3:#212b34;--line:#26313a;--line2:#334049;
  --ink:#f4f7f9;--ink2:#c3cfd8;--dim:#8899a5;--accent:#ff6a2b;--accent2:#ffa066;
  --go:#8fe85f;--warn:#ffc53d;--no:#ff5a4e;--hi:#fff;color:var(--ink);
  /* the kit's text tones, mixed again from the card's own inks */
  --t1:var(--ink);--t2:var(--ink2);--t3:color-mix(in srgb,var(--dim) 68%,var(--ink))}
.dia{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:8px;margin:0 0 18px;
  box-shadow:var(--e1);overflow:hidden}
/* On a card's own screen the drawing is the star: it fills the top of the
   card edge to edge, and the card's words follow under it. */
[data-view="card"] .card>.dia{margin:-15px -16px 16px;padding:10px;border:0;border-radius:20px 20px 16px 16px;
  box-shadow:inset 0 0 0 1px var(--line),0 1px 2px color-mix(in srgb,var(--shade) 30%,transparent),var(--shx) 12px 22px -12px color-mix(in srgb,var(--shade) 70%,transparent)}
.dia svg{display:block;width:100%;height:auto;border-radius:10px}


ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 15px 40px;font-size:15px;color:var(--ink2)}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(180deg,var(--panel3),var(--panel2));
  border:1px solid var(--line2);color:var(--accent);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;
  display:grid;place-items:center
}
ol.steps li:last-child{padding-bottom:0}
ol.steps b{font-weight:650;color:var(--ink)}
ol.steps a.k{text-decoration:underline;text-underline-offset:2px}
ol.steps .k{font:600 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 11%,transparent);padding:2px 8px 2px 7px;border-radius:8px;white-space:normal;overflow-wrap:anywhere}

.chk{display:grid;gap:7px;margin:12px 0 0}
.chk label{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:11px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;transition:border-color .15s,opacity .15s}
.chk label:has(input:checked){opacity:.42}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 20px;width:20px;height:20px;margin:1px 0 0;border-radius:6px;border:2px solid var(--line2);background:transparent;position:relative;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk .t{min-width:0}
.chk .t b{display:block;font-weight:650;font-size:14.5px;line-height:1.3;color:var(--ink)}
.chk .t i{display:block;font-style:normal;font-size:12.5px;line-height:1.4;color:var(--t3);margin-top:2px}

/* ---- knot tyer ---- */
.tyer{margin:12px -4px 8px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 30%,transparent),var(--shx) 12px 22px -12px color-mix(in srgb,var(--shade) 70%,transparent)}
.tyer .stage{background:var(--panel2);position:relative}
.tyer svg{display:block;width:100%;height:auto}
.tyer .bar{display:flex;align-items:center;gap:8px;padding:11px 13px;border-top:1px solid var(--line)}
.rail{display:flex;gap:5px;flex:1}
.rail button{
  flex:1;height:30px;border-radius:8px;cursor:pointer;
  background:var(--panel3);border:1px solid var(--line);color:var(--t3);
  font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;transition:all .15s;
}
.rail button:hover{border-color:var(--line2);color:var(--ink2)}
.rail button[aria-current="true"]{
  background:var(--gold);color:var(--on-gold);border-color:transparent}
.rail button.done{color:var(--go);border-color:color-mix(in srgb,var(--go) 35%,var(--line))}
.play{
  flex:0 0 auto;height:30px;padding:0 14px;border-radius:8px;cursor:pointer;
  background:var(--panel3);border:1px solid var(--line2);color:var(--ink);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:13px;transition:all .15s;
}
.play:hover{background:var(--line);border-color:var(--accent)}
.tyer .cap{padding:0 15px 15px;font-size:14.5px;color:var(--ink2);min-height:52px}
.tyer .cap b{color:var(--ink);font-weight:650}
.kstep{opacity:0;transition:opacity .18s}
.kstep.on{opacity:1}
.kstep .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.kstep.on .draw{stroke-dashoffset:0;transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
/* a link to another card or page: a kit chip with its chevron, so it reads as a tap */
.klink{display:inline-flex;align-items:center;gap:8px;margin:12px 0 10px;padding:9px 14px 9px 13px;border-radius:999px;font-size:14px;font-weight:600;
  color:var(--accent);text-decoration:none;background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.klink::after{content:"";flex:0 0 auto;width:6px;height:6px;margin-left:2px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg)}
.klink:active{transform:translateY(1px)}
.klink span{color:var(--t3);font-weight:500;font-size:13px}
.card h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:17px;color:var(--ink);margin:22px 0 8px}

/* bite */
.bite{display:flex;gap:14px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:16px;box-shadow:var(--sh)}
.bite svg{flex:0 0 92px;width:92px;height:70px;border-radius:8px}
.bite .t{font-size:14.5px;color:var(--ink2)}
.bite .t b{display:block;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:14px;color:var(--accent);margin-bottom:3px}
@keyframes dip{
  0%,42%{transform:translateY(0) rotate(0)} 52%{transform:translateY(3px) rotate(-7deg)}
  60%{transform:translateY(1px) rotate(3deg)} 72%,100%{transform:translateY(0) rotate(0)}
  80%,92%{transform:translateY(26px) rotate(-16deg)}
}
.floatbob{animation:dip 4s ease-in-out infinite;transform-origin:50% 85%}

/* buy links */
.buy{display:grid;gap:9px;margin:14px 0 0}
/* a thing to buy: a raised row on the kit's surface, its arrow the kit's chevron */
.buy a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;text-decoration:none;
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.buy a:active{transform:translateY(1px)}
.buy .n{flex:1;min-width:0}
.buy .n b{display:block;color:var(--ink);font-weight:650;font-size:14.5px;line-height:1.3}
.buy .n span{display:block;color:var(--t3);font-size:12.5px;margin-top:3px;line-height:1.35}
.buy .p{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.buy .go{flex:0 0 8px;width:8px;height:14px;font-size:0;color:var(--t3);background:currentColor;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 14'><path d='M1.5 1.5 6.5 7l-5 5.5' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 14'><path d='M1.5 1.5 6.5 7l-5 5.5' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat}

.card{scroll-margin-top:var(--toph,130px)}
.card p a,.card .box a,.card li a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
/* On a law box's pressed-in well the accent alone is too faint under a warm
   sky: a link there is mixed toward the ink. */
.card .box.law a{color:color-mix(in oklab,var(--accent) 72%,var(--ink))}
/* a figure that leads a rule: the limit, big, the way the gear tile leads with its count */
.box .fig{display:block;margin:3px 0 7px;font:700 36px/1 "Barlow Condensed",sans-serif;letter-spacing:-.005em;color:var(--t1)}
.box .fig small{font:600 15px/1 Inter,system-ui,sans-serif;letter-spacing:0;color:var(--t2);margin:0 3px}
/* ---- video tiles ---- */
.vids{display:grid;gap:10px;margin:12px 0 0}
.vid{display:flex;align-items:center;gap:13px;padding:12px;border-radius:14px;text-decoration:none;
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.vid:active{transform:translateY(1px)}
.vid .play{flex:0 0 52px;height:52px;border-radius:12px;position:relative;
  background:var(--gold);
  box-shadow:0 2px 12px -2px color-mix(in srgb,var(--gold) 55%,transparent)}
.vid .play::after{content:"";position:absolute;left:21px;top:16px;border-style:solid;
  border-width:10px 0 10px 16px;border-color:transparent transparent transparent var(--on-gold)}
.vid .vt{flex:1;min-width:0}
.vid .vt b{display:block;color:var(--ink);font-weight:650;font-size:15px;line-height:1.3}
.vid .by{display:block;color:var(--accent);font-size:12.5px;font-weight:600;margin-top:3px}
.vid .why{display:block;color:var(--t3);font-size:13px;line-height:1.4;margin-top:4px}
.vid .len{flex:0 0 auto;align-self:flex-start;text-align:right;font:700 13px/1.3 "Barlow Condensed",sans-serif;letter-spacing:.03em;color:var(--t3)}
.card .box + ol.steps,.card .box + .box{margin-top:14px}
.card ol.steps + .box{margin-top:16px}


/* ---- the library: tiles, rows, one card at a time ---- */
/* The parts are the kit's (.ptile, .row.pic, .platecard, .box). What is
   here is only where they sit on these screens. */
.ic{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row .tx>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a line that must not be cut (a rule): it wraps; so does a list of what is there */
.row .tx>span.whole,.row.pic .tx>span.rm{white-space:normal}
/* a row's badge stands on its title's line; the line under has the whole width */
.row .tx.hasbadge{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:start}
.row .tx.hasbadge>b{grid-column:1;grid-row:1;align-self:center}
.row .tx.hasbadge>.badge{grid-column:2;grid-row:1;display:inline-flex;margin:0;padding:3px 9px 3px 7px;white-space:nowrap;overflow:visible;font-size:12px;line-height:1.3;color:var(--accent)}
.row .tx.hasbadge>span:not(.badge){grid-column:1/-1}
.row.pic .tile{align-self:flex-start;margin-top:2px}
.ltiles{margin-bottom:2px}
/* ---- the library: CastAI's knots, casts, guides and gear (rigs/library.js) ---- */
/* a list's own head, inside the card that crosses the waterline */
.lhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0;padding:15px 16px 3px}
.lhead span{font-size:13.5px;line-height:1.35;color:var(--t2)}
/* the steps as a strip: a numbered stone per move, joined by a line */
ol.kstrip{list-style:none;margin:4px 0 0;padding:0}
ol.kstrip li{position:relative;display:flex;gap:13px;align-items:flex-start;padding:0 0 13px;font-size:15px;line-height:1.45;color:var(--t1)}
ol.kstrip li:last-child{padding-bottom:0}
ol.kstrip li i{position:relative;z-index:1;flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font:700 16px/1 "Barlow Condensed",sans-serif;font-style:normal;color:var(--t1);
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
ol.kstrip li:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:color-mix(in srgb,var(--accent) 30%,var(--line))}
ol.kstrip li span{padding-top:4px}
.card ol.kstrip + .box{margin-top:16px}
.card .box + .vids{margin-top:14px}
.klist{margin:3px 0 0;padding:0 0 0 18px}
.klist li{margin:3px 0}
/* a guide's section: its parts as headlines that open in place */
.gitems{margin:8px 0 0}
.gitem{border-top:1px solid var(--edge)}
.gitem:first-child{border-top:0}
.gitem>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer}
.gitem summary::-webkit-details-marker{display:none}
.gitem>summary b{flex:1;font-weight:650;font-size:16px;line-height:1.3;color:var(--t1)}
.gitem>summary .chev{transform:rotate(90deg);transition:transform .15s}
.gitem[open]>summary .chev{transform:rotate(-90deg)}
.gitem .gbody{padding:0 0 15px;font-size:15px;line-height:1.5;color:var(--t2)}
.gitem .gbody p{margin:0}
.gitem .gbody p+.klist{margin-top:8px}
.gitem .gbody .klist{margin-top:0}
.gitem .gbody .box.tip{margin-top:12px}
/* CastAI's paragraph, behind More: a part opens on its points */
.gmore{margin-top:10px}
.gmore>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 13px;border-radius:999px;cursor:pointer;
  font:600 13.5px/1.2 Inter,system-ui,sans-serif;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--paper))}
.gmore>summary::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-2px)}
.gmore[open]>summary{display:none}
.gmore p{margin:0}
/* a library row's level: a tinted badge, one colour each, never the gold */
.row .tx.hasbadge>.badge.lv{padding:3px 9px;font-size:12px}
.row .tx.hasbadge>.badge.lv1{color:var(--go);background:color-mix(in srgb,var(--go) 13%,var(--paper))}
.row .tx.hasbadge>.badge.lv2{color:var(--t2);background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 45%,transparent)}
.row .tx.hasbadge>.badge.lv3{color:color-mix(in srgb,var(--warn) 84%,var(--t1));background:color-mix(in srgb,var(--warn) 13%,var(--paper))}
.row .tx.hasbadge>.badge.lv4{color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
/* the rules page: where the checked rules are, as two chips */
.rulechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rulechips .chip{min-height:38px;padding:7px 15px;text-decoration:none;background:color-mix(in srgb,var(--accent) 11%,var(--paper));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 26%,transparent)}
.rulechips .chip b{font-size:14px;color:var(--accent)}
/* an odd tile out at the end of a row of two takes the row */
.ltiles .ptile:last-child:nth-child(odd){grid-column:1/-1}
/* a fish's page: what the fish is */
.about{padding:15px 16px 16px}
.about>p{margin:0;font-size:15px;line-height:1.5;color:var(--t1)}
.about .lures{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.about .lures .tag{font:600 13.5px/1 Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;padding:7px 11px;color:var(--t1);
  background:color-mix(in srgb,var(--accent) 9%,var(--pan-a));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.about .well{margin-top:14px}
[data-lib-wait]{padding:18px 18px 19px}
/* a new rule over a fish's plate: room for the drawing that rides up over the plate's lip */
[data-view="species"] [data-rules-slot] .box{margin:0 0 calc(12px + var(--sw)*24/390)}
.grp{margin:26px 0 0}
.grp>.sect{margin-top:0}
/* a spot page's week: its days follow their heading close, as one list */
[data-spot-trips]>.sect+.day{margin-top:14px}
[data-spot-trips]>.day+.day{margin-top:20px}
/* when a trip here fishes: twelve months from this one, pressed in when it
   does not, pale gold when it does, gold its best, this month ringed */
.row.season{align-items:center}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:9px;text-decoration:none}
.months b{height:19px;display:grid;place-items:center;border-radius:6px;font:700 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;color:var(--t2);
  background:color-mix(in srgb,var(--shore) 10%,transparent);box-shadow:inset 0 1px 2px color-mix(in srgb,var(--shore) 26%,transparent)}
.months b.ok{color:var(--t1);background:color-mix(in srgb,var(--gold) 30%,var(--paper));box-shadow:0 1px 0 color-mix(in srgb,var(--lum) 50%,transparent)}
.months b.pk{color:var(--on-gold);background:var(--gold);box-shadow:0 1px 3px color-mix(in srgb,var(--gold) 45%,transparent)}
.months b.now{outline:1.5px solid var(--t1);outline-offset:1px}
/* A heading that lands on the picture gets glass under it, and the title
   gives up a little sky so the first card still crosses the waterline. */
.sect.lead{display:inline-flex;margin:0 0 10px;padding:8px 13px 7px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:var(--e1),inset 0 1px 0 var(--rim)}
.sect.lead .n{margin-left:4px}
.hero.tight{min-height:calc(var(--sw)*var(--cardy)/390 - 128px - var(--jumph,0px) + var(--lift))}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* ---- hot trips ---- */
/* The tide and weather page opens on the tile's pictures, card wide. */
.wxfig{margin:0 0 18px}
.wxfig figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.wxfig figcaption b{font:700 21px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.01em;color:var(--t1)}
.wxfig figcaption b{white-space:nowrap}
.wxfig figcaption span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--t3);white-space:nowrap}
.wxfig .sw{width:11px;height:11px;border-radius:3px;background:color-mix(in srgb,var(--gold) 34%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 70%,transparent)}
.wxfig svg{display:block;width:100%;height:auto;margin:0}
.wxfig .windbars .t-lab{font-size:9.5px}
.wxlab{position:relative;display:block;height:34px;margin-top:5px}
.wxlab span{position:absolute;top:0;transform:translateX(-50%);text-align:center;font:700 15px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;color:var(--t1);white-space:nowrap}
.wxlab small{display:block;font:600 11.5px/1.3 Inter,system-ui,sans-serif;letter-spacing:0;color:var(--t3)}
.wxlab.ends{height:18px}
.wxlab.ends span{transform:none}
.wxfig+.when{margin-top:2px}
/* The gear list opens with its tile's count and pips. */
.gearhead{padding:0 0 12px;border-bottom:1px solid var(--edge)}
.gearhead .bignum{margin-top:0}
.gearhead .when{margin-top:9px}
/* Bait and lures opens on the thing, drawn, on a wash of its water. */
.baitplate{display:grid;place-items:center;margin:-4px -8px 10px;padding:10px 0 6px;
  background:radial-gradient(ellipse 50% 46% at 50% 54%,color-mix(in oklab,var(--wash-c,var(--water1)) 58%,transparent),transparent)}
:root[data-dark="1"] .baitplate{background:radial-gradient(ellipse 50% 46% at 50% 54%,color-mix(in oklab,var(--gold) 15%,transparent),transparent)}
.baitplate svg{display:block;width:88%;height:auto}
/* On a narrow phone the slot word gives way, so the HOT or GOOD tag stays on
   the row with the day instead of floating alone over the picture. */
@media (max-width:379px){.hero .chip .slot{display:none}
  /* the owner's title row (back, how many, You run it, Rename) stays one row on a small iPhone */
  [data-view="crew"]>.hero .chips{gap:5px}[data-view="crew"]>.hero .chip{padding-left:9px;padding-right:9px}}
.gear{list-style:none;margin:12px 0 0;padding:0}
.gear li{position:relative;display:flex;gap:12px;align-items:flex-start;padding:11px 0;font-size:15px;line-height:1.4;color:var(--t1)}
.gear li+li::before{content:"";position:absolute;left:40px;right:0;top:0;height:1px;background:var(--edge)}
.gear li>span:not(.tag){flex:1;min-width:0}
.gear li small{display:block;color:var(--t3);font-size:13px;margin-top:2px}
.gear .tag{align-self:flex-start;margin-top:1px}
/* what is in the garage, at a glance: a green tick is yours, an amber ring
   with a plus is to buy, an open ring is to look at before you go */
.gtick{position:relative;flex:0 0 28px;height:28px;margin-top:-2px;border-radius:50%;background:var(--well);
  box-shadow:inset 0 1px 2px color-mix(in srgb,var(--shade) 25%,transparent),inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 55%,transparent)}
.gear .have .gtick{background:var(--go);box-shadow:inset 0 -2px 3px color-mix(in srgb,var(--shade) 25%,transparent),0 3px 7px -3px color-mix(in srgb,var(--go) 80%,var(--shade))}
:root[data-dark="1"] .gear .have .gtick{background:color-mix(in srgb,var(--go) 84%,var(--bg))}
.gear .have .gtick::after{content:"";position:absolute;left:10px;top:6px;width:6px;height:11px;border:solid var(--paper);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
:root[data-dark="1"] .gear .have .gtick::after{border-color:var(--bg)}
.gear .need .gtick{background:color-mix(in srgb,var(--warn) 12%,var(--pan-a));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--warn) 80%,transparent)}
.gear .need .gtick::before,.gear .need .gtick::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:2.2px;margin:-1.1px 0 0 -5.5px;border-radius:1px;background:color-mix(in srgb,var(--warn) 84%,var(--t1))}
.gear .need .gtick::after{transform:rotate(90deg)}
/* after dark the open ring is lit from its rim, never a hole in the card */
:root[data-dark="1"] .gear .todo .gtick{background:color-mix(in srgb,var(--t3) 16%,var(--pan-a));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--t2) 70%,transparent),inset 0 2px 3px color-mix(in srgb,var(--shade) 40%,transparent)}
.gear .have>span:not(.tag){color:var(--t2)}
.hrs{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:13.5px;color:var(--ink2)}
.hrs td{padding:7px 4px;border-top:1px solid var(--line)}
.hrs td:first-child{font:700 15.5px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.02em;color:var(--t1);white-space:nowrap}
/* The map follows the sky like every other surface, and sits in the look:
   a float that crosses the waterline, a chart of water and a faint grid under
   its pins (what you see with no signal, before any tile arrives), glass for
   its legend and its credit. Tiles are plain by day and turned dark only
   under the three dark skies. */
.mapbox{position:relative;height:calc(100dvh - var(--sw)*var(--cardy)/390 - 104px);min-height:380px;border-radius:22px;overflow:hidden;isolation:isolate;
  box-shadow:var(--e2),inset 0 0 0 1px color-mix(in srgb,var(--lum) 26%,transparent)}
.mapbox,.mapbox.leaflet-container{background:
  repeating-linear-gradient(0deg,transparent 0 59px,var(--mapgrid) 59px 60px),
  repeating-linear-gradient(90deg,transparent 0 59px,var(--mapgrid) 59px 60px),
  linear-gradient(180deg,color-mix(in oklab,var(--water1) 42%,var(--pan-a)),color-mix(in oklab,var(--water2) 40%,var(--pan-b)))}
.mapbox{--mapgrid:color-mix(in srgb,var(--paper) 26%,transparent)}
:root[data-dark="1"] .mapbox{--mapgrid:color-mix(in srgb,var(--ink) 7%,transparent)}
.mapbox::after{content:"";position:absolute;inset:0;z-index:900;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px color-mix(in srgb,var(--lum) 26%,transparent),inset 0 10px 18px -14px color-mix(in srgb,var(--shade) 60%,transparent)}
.mapbox .well{margin:16px}
.mapbox .mapnote{position:absolute;left:10px;bottom:10px;z-index:950;pointer-events:none}
.tiles-dark{filter:saturate(.55) contrast(.96)}
:root[data-dark="1"] .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.92) saturate(.6)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -20px 0;padding:2px 20px 12px;align-self:stretch}
.days::-webkit-scrollbar{display:none}
.days .chip{flex:0 0 auto}
/* pins: the trip's own colours. Gold is hot and glows, a green ring is good,
   a small grey bead has nothing on it, the ink square is home. */
.mk{display:flex !important;align-items:center;gap:5px;white-space:nowrap;background:none;border:0}
.mk i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);background:var(--paper);
  box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 40%,transparent),var(--shx) 5px 9px -4px color-mix(in srgb,var(--shade) 70%,transparent)}
.mk b{font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;color:var(--t1);padding:4px 8px 3px;border-radius:999px;background:var(--glass);
  box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 22%,transparent),inset 0 1px 0 var(--rim);pointer-events:none}
.mk b:empty{display:none}
.mk.group i{width:26px;height:26px;display:grid;place-items:center;font:700 13px/1 "Barlow Condensed",sans-serif;font-style:normal;color:var(--t1)}
.mk.group.hot i{color:var(--on-gold)}
.leaflet-popup-content .pg + .pg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mk.hot i{border:0;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 80%,var(--paper)),var(--gold));
  box-shadow:0 0 0 1.5px var(--on-gold),0 0 0 6px color-mix(in srgb,var(--gold) 34%,transparent),0 0 16px 2px color-mix(in srgb,var(--gold) 60%,transparent),0 3px 6px -2px color-mix(in srgb,var(--shade) 70%,transparent)}
.mk.dim i{width:12px;height:12px;margin:3px;border:2px solid color-mix(in srgb,var(--dim) 80%,var(--paper));background:color-mix(in srgb,var(--paper) 70%,var(--dim));box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 30%,transparent)}
.mk.dim.group i{width:22px;height:22px;margin:2px;color:var(--t2);font-size:12px}
.mk.dim b{opacity:.8;font-weight:600}
.mk.home i{border-radius:5px;border-color:var(--ink);background:var(--ink)}
.mk.athome i{position:relative}
.mk.athome i::after{content:"";position:absolute;left:-8px;bottom:-6px;width:10px;height:10px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;width:fit-content;margin:12px 0 0;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--t2);
  background:var(--glass);box-shadow:var(--e1),inset 0 1px 0 var(--rim)}
.legend .mk{font-size:12.5px}
.legend .mk i{width:13px;height:13px;border-width:2px;box-shadow:none}
.legend .mk.hot i{margin:0 3px;box-shadow:0 0 0 1.5px var(--on-gold),0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.legend .mk.dim i{width:10px;height:10px;margin:0 1px}
.mapbox .leaflet-popup-content-wrapper{border-radius:18px;background:linear-gradient(180deg,var(--pan-a),var(--pan-b));color:var(--t1);box-shadow:var(--e2),inset 0 1px 0 var(--rim)}
.mapbox .leaflet-popup-tip{background:var(--pan-b);box-shadow:none}
.mapbox .leaflet-popup-content{margin:14px 16px;font:14px/1.4 Inter,system-ui,sans-serif}
.mapbox .leaflet-popup-content>b{font:700 19px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.mapbox .leaflet-popup-content small{color:var(--t3)}
.mapbox .leaflet-popup-content a.pt{color:var(--t1)}
.mapbox .leaflet-popup-content .pt{display:block;margin-top:10px;padding:9px 12px;border-radius:12px;color:var(--t1);text-decoration:none;font-weight:600;background:var(--well);
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 18%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 5%,transparent)}
.mapbox .leaflet-popup-content .pt span{display:block;font:600 12px/1.3 Inter,system-ui,sans-serif;color:color-mix(in oklab,var(--accent) 72%,var(--ink))}
.mapbox .leaflet-popup-content .pq{margin:8px 0 0;color:var(--t3)}
.mapbox.leaflet-container a.leaflet-popup-close-button{color:var(--t3)}
.mapbox .leaflet-control-attribution{margin:0 8px 8px 0;padding:3px 9px;border-radius:999px;font:500 10.5px/1.4 Inter,system-ui,sans-serif;
  background:var(--glass) !important;color:var(--t2) !important;box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 20%,transparent)}
.mapbox .leaflet-control-attribution a{color:var(--t2) !important}
.ruleacts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ruleacts a{color:var(--ink);font-weight:600}
.ack{font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.rulestamp{margin:14px 4px 0;font-size:12.5px;color:var(--t3)}
.card .rulestamp{font-size:12.5px;color:var(--t3);margin:0 0 12px}
/* ---- the crew ---- */
/* Every class here starts cw- so no other part of the app can collide with
   it. An earlier bare .go rule turned the bait card's buy arrows into gold bars.
   Surfaces come from the kit: the first card is a .float on the waterline,
   groups are .panel, quiet notes and the boxes you type into are pressed in. */
.cw{max-width:430px}
.float.cwcard{padding:16px 16px 18px}
.cwcard>.eyebrow,.cw-share>.eyebrow,.cwplan>.eyebrow{margin:0 0 9px}
.cw-fld{display:block;margin:0 0 14px}
.cw-fld > span{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:0 0 6px}
/* a box you type into is a well: pressed into the card it sits on */
.cw-fld input,.cw-fld select,.cw-fld textarea,.cw-addline input{width:100%;min-height:50px;font:inherit;font-size:16px;color:var(--t1);
  background:var(--well);border:0;border-radius:14px;padding:0 14px;
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 20%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 7%,transparent),0 1px 0 color-mix(in srgb,var(--lum) 50%,transparent)}
:root[data-dark="1"] .cw-fld input,:root[data-dark="1"] .cw-fld select,:root[data-dark="1"] .cw-fld textarea,:root[data-dark="1"] .cw-addline input,:root[data-dark="1"] .cw-compose textarea{
  background:color-mix(in srgb,var(--pan-b) 62%,var(--well));
  box-shadow:inset 0 1px 3px var(--shore),inset 0 0 0 1px color-mix(in srgb,var(--line) 90%,var(--ink) 10%)}
.cw-fld input::placeholder,.cw-fld textarea::placeholder,.cw-addline input::placeholder{color:var(--t3);opacity:1}
.cw-fld textarea{min-height:96px;padding:12px 14px;resize:vertical}
.cw-fld input:focus,.cw-fld select:focus,.cw-fld textarea:focus,.cw-addline input:focus{outline:2px solid var(--accent);outline-offset:1px}
/* a second choice: a raised paper button, in sentence case */
.cw-plain{display:flex;align-items:center;justify-content:center;width:100%;font:inherit;text-align:center;
  text-decoration:none;cursor:pointer;border:0;border-radius:15px;padding:0 14px;
  min-height:48px;margin-top:10px;font-size:15px;font-weight:600;color:var(--t1);
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.cw-plain[disabled]{opacity:.55;cursor:default}
.cw-plain:active{transform:translateY(1px)}
.cw-plain.cw-main{color:var(--accent);font-weight:650;box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
:root[data-dark="1"] .cw-plain.cw-main{color:color-mix(in srgb,var(--accent) 55%,var(--t1))}
/* signing out is the quietest thing on the screen: an outline, no lift */
.cw-out{margin-top:26px;color:var(--t2);background:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 35%,transparent)}
.cw-mini,.cw-act{position:relative;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;color:var(--t1);text-decoration:none;cursor:pointer;
  border:0;border-radius:999px;background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 16%,transparent),inset 0 0 0 1px var(--edge)}
.cw-mini{min-height:36px;font-size:13px;padding:6px 13px}
.cw-mini::after{content:"";position:absolute;inset:-5px -2px}
.cw-act{min-height:44px;padding:0 16px;font-size:14px}
.cw-mini.no,.cw-act.no{color:var(--no)}
:root[data-dark="1"] .cw-mini.no,:root[data-dark="1"] .cw-act.no{color:color-mix(in srgb,var(--no) 72%,var(--t1))}
.cw-act[disabled]{opacity:.55;cursor:default}
.cw-act:active,.cw-mini:active{transform:translateY(1px)}
.cw-msg{font-size:14px;line-height:1.45;color:var(--t3);margin:12px 0 0;min-height:1px}
.cw-msg:empty{display:none}
.cw-msg.no{color:var(--no)}
.cw-msg.ok{color:var(--go)}
:root[data-dark="1"] .cw-msg.no{color:color-mix(in srgb,var(--no) 72%,var(--t1))}
.cw-lead{font-size:16px;line-height:1.45;color:var(--t1);margin:0 0 14px}
.cw-lead b{font-weight:650}
.cw-lead.cw-sub{color:var(--t2);font-size:15px}
.cw-wait{font:700 12.5px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--warn)}
:root[data-dark="1"] .cw-wait{color:color-mix(in srgb,var(--warn) 70%,var(--t1))}
/* sign in: the number is the card on the waterline, a pasted link the well under it */
.well.cw-paste{margin-top:14px;padding:14px 16px 16px}
.well.cw-paste .cw-fld > span{color:var(--t2)}
.well.cw-paste .cw-fld input{background:var(--pan-a);box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 14%,transparent),inset 0 0 0 1px var(--edge)}
/* the join screen: staying is gold, switching is the quiet one under it */
.cw-switch{width:100%;margin-top:10px}
/* the share box: text the link, then copy or done side by side */
.cw-share .cw-msg{margin:8px 4px 0;text-align:center}
.cw-sharebtns{margin-top:4px}
.cw-sharebtns .cw-plain{margin-top:6px}
.cw-pad{padding:16px}
.cw-pad .cw-lead{font-size:15px;color:var(--t2)}
/* the crew's next step, a row in its own panel inside the first card */
.cw-next{margin-top:2px}
.cw-next .row.crewtrip{padding:12px 14px 12px 12px}
.cw-next .crewtrip .tx>b{font-size:17px}
/* the people: a face, the name, what they are on the crew */
.cw-list{list-style:none;margin:0;padding:0}
.cw-person{position:relative;display:block;padding:0}
.cw-person+.cw-person::before{content:"";position:absolute;left:66px;right:0;top:0;height:1px;background:var(--edge)}
.cw-person[data-waiting] .cw-who b{color:var(--t2)}
/* a person: the face, the name, one line; a row the owner can act on is a
   button that opens in place, with New link and Remove under it */
.cw-prow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;border:0;background:none;font:inherit;color:inherit;text-align:left}
button.cw-prow{cursor:pointer}
button.cw-prow:active{background:color-mix(in srgb,var(--accent) 7%,transparent)}
button.cw-prow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cw-prow>.av{flex:0 0 auto}
.cw-prow .chev{margin-left:auto;transition:transform .15s}
.cw-prow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cw-person>.cw-pacts,.cw-person>.cw-namebox,.cw-person>.cw-msg{padding:0 14px 14px 66px;margin:0}
.cw-pacts .cw-acts{margin:0}
.cw-rowshare{padding:2px 14px 16px}
.cw-line{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-size:13.5px;line-height:1.35;color:var(--t2)}
.cw-who{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.cw-who b{font-weight:650;font-size:16px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:break-word;max-width:100%;color:var(--t1)}
.cw-who .cw-k{font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.cw-tags{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
.cw-link{position:relative;min-height:28px;padding:0;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.cw-link::after{content:"";position:absolute;inset:-8px -6px}
:root[data-dark="1"] .cw-link{color:color-mix(in srgb,var(--accent) 55%,var(--t1))}
.cw-tags .pill{font-size:12px;padding:5px 9px 4px}
.cw-ask{margin:0 0 10px;font-size:14.5px;color:var(--t1)}
.cw-acts{display:flex;flex-wrap:wrap;gap:8px}
.cw-namebox .cw-fld{margin:0}
.cw-namebox .cw-acts2{margin-top:10px}
/* the empty seat at the foot of the list: adding someone */
.cw-addrow>.cw-invite{padding:0 14px 16px}
.cw-addrow>.cw-share{padding:16px 14px 16px}
.cw-addh{display:flex;align-items:center;gap:12px;margin:0;padding:12px 14px 10px;font-size:16px}
.cw-addh b{font-weight:650}
.cw-mark{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--go)}
.cw-mark::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 20%,transparent)}
.cw-rowbtn .chev{transition:transform .15s}
.cw-rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
[data-cw-trips] .crewtrip{margin-top:10px}
[data-cw-trips] .crewtrip+.list{margin-top:10px}
.cw-make,.mainact{margin:18px 0 0}
[data-cw-make-slot]{display:contents}
/* the go call: its words, in the colour of the call */
.cw-cond{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;color:var(--t1);overflow-wrap:anywhere}
.cw-cond.slow,.cw-cond.warn{color:var(--warn)}
.cw-cond.no{color:var(--no)}
:root[data-dark="1"] .cw-cond.slow,:root[data-dark="1"] .cw-cond.warn{color:color-mix(in srgb,var(--warn) 70%,var(--t1))}
:root[data-dark="1"] .cw-cond.no{color:color-mix(in srgb,var(--no) 72%,var(--t1))}
.cwcall{display:flex;align-items:center;gap:13px}
.cwcall .seal{flex:0 0 50px;height:50px;font-size:19px;letter-spacing:.04em}
.cwcall .cw-cond{flex:1 1 0}
.cw-callpic{flex:0 0 84px;width:84px;height:40px;display:block}
.cwplan .eyebrow{display:flex;align-items:center;gap:6px}
.cw-planeye{margin:0 0 10px!important;justify-content:space-between}
.cw-planeye .pill{font-size:12px;padding:5px 9px 4px}
.cwplan .eyebrow .chev{width:6px;height:10px;color:var(--accent)}
.cwplan .planhead{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge)}
/* who is in: three tiles, the whole tile is the answer */
.cw-going{margin:0}
.rs{position:relative;cursor:default}
.rs .rs-h{min-height:44px;margin:-6px 0 -4px}
.cw-ans{position:static;flex:1;min-height:44px;padding:0;border:0;background:none;cursor:pointer;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.cw-ans::after{content:"";position:absolute;inset:0;border-radius:16px}
.cw-ans:focus-visible{outline:none}
.cw-ans:focus-visible::after{outline:2.5px solid var(--accent);outline-offset:2px}
.rs:active{transform:translateY(1px)}
.rs.done:active{transform:none}
.cw-ghead{flex:1}
.cw-names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;align-self:stretch;min-width:0}
.cw-names .rs-p{min-width:0;max-width:100%}
.cw-names .rs-p span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-names li[data-waiting]{color:var(--t3)}
.cw-acts2{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.cw-acts2:empty{display:none}
.cw-asks{margin:14px 0 0;font-size:15px;color:var(--t1)}
.cw-foot{margin:28px 0 0}
.cw-foot .gold svg{width:21px;height:21px}
.cw-textnote{margin:10px 10px 0;text-align:center;color:var(--t2)}
.cw-foot .cw-acts2{justify-content:center}
.cw-foot .cw-asks{text-align:center}
/* Planning a trip. */
.cw-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cw-two .cw-fld input{min-width:0}
.cw-k2{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--t2)}
.cw-seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin:0 0 14px;padding:4px;border-radius:16px;background:var(--well);
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 18%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 6%,transparent)}
.cw-pick{min-height:46px;font:inherit;font-size:15px;font-weight:600;color:var(--t2);background:none;border:0;border-radius:12px;padding:0 8px;cursor:pointer}
.cw-pick[aria-pressed="true"]{color:var(--t1);background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 0 0 1.5px color-mix(in srgb,var(--go) 55%,transparent)}
.cw-condslot:empty{display:none}
.cw-condslot{margin:0 0 14px}
.cw-condslot .cwcall{padding:12px 13px;border-radius:16px;background:var(--well);
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 18%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 6%,transparent)}
.cw-condslot .seal{flex-basis:42px;height:42px;font-size:16px}
/* Notes, the list and catches on a crew trip, and the Tell row. */
.cw-x{min-height:44px;padding:0 2px;font:inherit;font-size:13px;font-weight:600;color:var(--t2);background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.cw-tell{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.cw-foot .cw-tell{margin:14px 0 0;justify-content:center}
.cw-tell-h{font-size:13px;font-weight:600;color:var(--t2)}
.cw-pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;max-width:100%;padding:0 14px;font:inherit;font-size:14px;font-weight:600;
  color:var(--t2);background:var(--well);border:0;border-radius:999px;cursor:pointer;overflow-wrap:anywhere;
  box-shadow:inset 0 1px 2px color-mix(in srgb,var(--shade) 16%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 6%,transparent)}
.cw-pill[aria-pressed="true"]{color:var(--t1);background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 0 0 1.5px color-mix(in srgb,var(--go) 55%,transparent)}
.cw-tell .cw-pill::before{content:"";flex:0 0 auto;width:9px;height:5px;margin-top:-3px;border:solid currentColor;border-width:0 0 2px 2px;
  transform:rotate(-45deg);opacity:0}
.cw-tell .cw-pill[aria-pressed="true"]::before{opacity:1;color:var(--go)}
/* notes: a conversation, a face and a bubble each, your own on the right */
.cw-nlist,.cw-clist{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column}
.cw-nlist{gap:12px}
.cw-clist{gap:10px}
.cw-note{display:flex;align-items:flex-end;gap:9px}
.cw-note.mine{flex-direction:row-reverse}
.cw-bub{flex:0 1 auto;min-width:0;max-width:calc(100% - 42px);padding:10px 14px 11px;border-radius:19px 19px 19px 6px;
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
/* your own words in gold's soft partner, the colour "you" wears on the crew screen */
.cw-note.mine .cw-bub{border-radius:19px 19px 6px 19px;background:color-mix(in srgb,var(--gold) 15%,var(--pan-a))}
:root[data-dark="1"] .cw-note.mine .cw-bub{background:color-mix(in srgb,var(--gold) 13%,var(--paper))}
.cw-note.mine .cw-wait{color:color-mix(in srgb,var(--warn) 75%,var(--t1))}
.cw-note[data-waiting] .cw-bub{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 45%,transparent)}
.cw-note-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 9px;margin:0;font-size:12.5px;color:var(--t2)}
.cw-note-h b{font-size:14px;font-weight:700;color:var(--t1);overflow-wrap:anywhere;min-width:0}
.cw-note-b{margin:3px 0 0;font-size:15.5px;line-height:1.42;color:var(--t1);white-space:pre-wrap;overflow-wrap:anywhere}
.cw-note .cw-x,.cw-catch .cw-x{margin:2px 0 -12px}
.cw-note .cw-asks,.cw-catch .cw-asks{margin:10px 0 0;font-size:14.5px}
.cw-note .cw-acts2,.cw-catch .cw-acts2{margin:10px 0 0}
.panel.cw-notebox{padding:12px}
.cw-notebox .cw-msg{margin:10px 4px 0}
/* the composer: one line, your face, and a send button; it grows once used */
.cw-compose{display:flex;align-items:flex-end;gap:9px}
.cw-compose>.av{flex:0 0 auto;margin-bottom:9px}
.cw-compose textarea{flex:1 1 auto;min-width:0;min-height:50px;max-height:50px;font:inherit;font-size:16px;line-height:1.4;color:var(--t1);resize:none;
  background:var(--well);border:0;border-radius:16px;padding:13px 14px;transition:max-height .15s;
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 20%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 7%,transparent)}
.cw-compose textarea::placeholder{color:var(--t3);opacity:1}
.cw-compose textarea:focus,.cw-compose textarea:not(:placeholder-shown){min-height:96px;max-height:none;outline:2px solid var(--accent);outline-offset:1px}
.cw-compose textarea:not(:focus):not(:placeholder-shown){outline:0}
.cw-send{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:50px;padding:0 15px;border:0;border-radius:16px;cursor:pointer;
  font:700 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
:root[data-dark="1"] .cw-send{color:color-mix(in srgb,var(--accent) 55%,var(--t1))}
.cw-send svg{width:17px;height:17px}
.cw-send:active{transform:translateY(1px)}
/* the list: a checklist with real ticks and who has each thing */
.cw-sum{font-size:14px;line-height:1.45;color:var(--t2);margin:-2px 4px 10px;overflow-wrap:anywhere}
.cw-items{list-style:none;margin:0 0 12px;padding:0}
.cw-items:empty{display:none}
.cw-item{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;min-height:62px;padding:8px 12px 8px 8px}
.cw-item+.cw-item::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--edge)}
.cw-tick{position:relative;flex:0 0 44px;width:44px;height:44px;padding:0;background:none;border:0;cursor:pointer;display:grid;place-items:center}
.cw-tick i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--well);
  box-shadow:inset 0 1px 2px color-mix(in srgb,var(--shade) 25%,transparent),inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 55%,transparent)}
:root[data-dark="1"] .cw-tick i{background:color-mix(in srgb,var(--pan-b) 55%,var(--well));box-shadow:inset 0 1px 2px var(--shore),inset 0 0 0 1.5px color-mix(in srgb,var(--t2) 70%,transparent)}
.cw-tick svg{width:15px;height:15px;opacity:0}
.cw-tick[aria-checked="true"] i{background:var(--go);box-shadow:inset 0 -2px 3px color-mix(in srgb,var(--shade) 25%,transparent),0 3px 7px -3px color-mix(in srgb,var(--go) 80%,var(--shade))}
:root[data-dark="1"] .cw-tick[aria-checked="true"] i{background:color-mix(in srgb,var(--go) 84%,var(--bg))}
.cw-tick[aria-checked="true"] svg{opacity:1;color:var(--paper)}
:root[data-dark="1"] .cw-tick[aria-checked="true"] svg{color:var(--bg)}
.cw-item-l{flex:1 1 0;min-width:0;padding:8px 0;font-size:16px;font-weight:650;line-height:1.3;letter-spacing:-.01em;color:var(--t1);overflow-wrap:anywhere}
.cw-item.done .cw-item-l{color:var(--t2)}
.cw-item-l .cw-wait{display:block;margin-top:2px}
.cw-whob{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;max-width:46%;min-height:44px;padding:0 12px 0 6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--t2);
  background:none;border:0;border-radius:999px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-whob .av{flex:0 0 auto}
.cw-whob span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cw-whob.none{padding:0 13px;color:var(--t2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 45%,transparent)}
.cw-whob.none::before{content:"+";font-weight:700;font-size:15px;line-height:1;margin-right:-2px}
.cw-whob[aria-expanded="true"]{color:var(--t1);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cw-panel{flex:1 1 100%;min-width:0;margin:4px 0 8px 6px;padding:12px;border-radius:14px;background:var(--well);
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 18%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 6%,transparent)}
.cw-panel-h{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--t2)}
.cw-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cw-panel .cw-pill{background:var(--pan-a);box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 14%,transparent),inset 0 0 0 1px var(--edge)}
.cw-panel .cw-pill[aria-pressed="true"]{box-shadow:var(--e1),inset 0 0 0 1.5px color-mix(in srgb,var(--go) 55%,transparent)}
.cw-panel .cw-acts2{margin:0}
.cw-panel .cw-asks{margin:0 0 10px}
.cw-panel .cw-fld{margin:0 0 10px}
.cw-addline{display:flex;gap:8px;align-items:center}
.cw-addline input{flex:1 1 0;min-width:0}
.cw-addline .cw-act{flex:0 0 auto;min-height:50px;border-radius:14px}
/* catches: a card each, the photo (or the water's own picture) at its side */
.panel.cw-catch{display:flex;gap:14px;align-items:flex-start;padding:12px}
.cw-thumb{position:relative;flex:0 0 104px;width:104px;height:104px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--well);
  cursor:pointer;font:inherit;font-size:11px;line-height:1.3;color:var(--t3);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--shade) 14%,transparent),var(--shx) 6px 12px -6px color-mix(in srgb,var(--shade) 55%,transparent)}
.cw-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.cw-thumb[data-nophoto]{cursor:default;padding:8px}
.cw-thumb[data-nophoto]::after{content:"Photo needs a signal"}
.cw-thumb.nopic{cursor:default}
.cw-thumb.nopic .tile{width:100%;height:100%;border-radius:0;box-shadow:none}
.cw-catch-t{flex:1 1 0;min-width:0;padding-top:2px}
.cw-catch-h{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 9px;color:var(--t1);overflow-wrap:anywhere}
.cw-catch-h b{font:700 23px/1.05 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.cw-catch-h span{font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;color:var(--t2)}
/* who, when, the lure: the dots between are drawn, so none starts a line */
.cw-catch-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--t2);overflow-wrap:anywhere}
.cw-catch-m>span{display:inline-flex;align-items:center;min-width:0}
.cw-catch-m>span+span::before{content:"\00b7";margin:0 7px;color:var(--t3)}
.cw-cwho{gap:6px;white-space:nowrap}
.cw-catch-m.cw-lure{margin-top:2px;color:var(--t1);font-weight:600}
.cw-catch-n{margin:6px 0 0;font-size:14.5px;line-height:1.45;color:var(--t1);white-space:pre-wrap;overflow-wrap:anywhere}
.cw-form{padding:14px;border-radius:18px;background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.cw-photo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.cw-photo img{display:block;width:96px;height:96px;object-fit:cover;border-radius:12px;box-shadow:0 0 0 1px var(--edge)}
.cw-file{position:relative;overflow:hidden}
.cw-file input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
.cw-file:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.cw-big{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.cw-big img{display:block;max-width:100%;max-height:calc(100dvh - 140px);border-radius:12px;object-fit:contain}
/* alerts on the crew screen: rows that are switches, in one panel, and the notes that sit under a row */
.cw-al{margin:0}
.cw-al-sum{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;line-height:1.4;color:var(--t1);margin:0 4px 12px}
.cw-al-sum::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--t3);box-shadow:0 0 0 3px color-mix(in srgb,var(--t3) 20%,transparent)}
.cw-al-sum[data-on]::before{background:var(--go);box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 22%,transparent)}
.cw-al-k{font-size:13px;font-weight:600;color:var(--t2);margin:18px 4px 8px}
.cw-sws{margin:0 0 12px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.cw-sw{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 14px 8px 16px;font:inherit;text-align:left;color:var(--t1);
  background:none;border:0;border-top:1px solid var(--edge);cursor:pointer}
.cw-sw:first-child{border-top:0}
.cw-sw:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cw-sw-t{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.cw-sw-t b{display:block;font-size:16px;font-weight:650;line-height:1.3}
.cw-sw-t span{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--t2)}
.cw-sw-k{flex:0 0 auto;position:relative;width:48px;height:29px;border-radius:15px;background:var(--well);
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 28%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 10%,transparent);transition:background .15s}
.cw-sw-k::after{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:var(--pan-a);
  box-shadow:0 1px 3px color-mix(in srgb,var(--shade) 45%,transparent);transition:transform .15s}
:root[data-dark="1"] .cw-sw-k{background:color-mix(in srgb,var(--pan-b) 45%,var(--well));box-shadow:inset 0 1px 2px var(--shore),inset 0 0 0 1.5px var(--line)}
:root[data-dark="1"] .cw-sw-k::after{background:var(--t3)}
.cw-sw[aria-checked="true"] .cw-sw-k{background:var(--go)}
.cw-sw[aria-checked="true"] .cw-sw-k::after{transform:translateX(19px);background:var(--paper)}
:root[data-dark="1"] .cw-sw[aria-checked="true"] .cw-sw-k::after{background:var(--ink)}
.cw-sw-note{padding:12px 16px 14px;border-top:1px solid var(--edge);background:var(--well);font-size:14.5px;line-height:1.45;color:var(--t1);
  box-shadow:inset 0 2px 3px -2px color-mix(in srgb,var(--shade) 22%,transparent)}
.cw-sw-note p{margin:0 0 4px}
.cw-sw-note ol{margin:8px 0 0;padding:0 0 0 20px}
.cw-sw-note li{margin:0 0 4px}
.cw-sw-note .cw-act,.cw-sw-note .cw-plain{margin-top:10px}
.cw-sw-note .cw-fld{margin:10px 0 0}
.cw-sw-note .cw-fld input{background:var(--pan-a);box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 14%,transparent),inset 0 0 0 1px var(--edge)}
.cw-sw-note .cw-msg{margin:10px 0 0}
.cw-sw-note > .cw-msg:first-child{margin-top:0}
.cw-sw-note.warn p:first-child{color:color-mix(in srgb,var(--warn) 70%,var(--t1));font-weight:650}
.cw-al .cw-two{margin-top:16px}
.cw-al .cw-two .cw-fld{margin-bottom:0}
.cw-al .cw-plain{margin-top:18px}
.cw-al-lines .cw-msg{margin:10px 4px 0}
.cw-al [data-al-note]{margin:0 4px 12px}
/* a long name, or a long word, wraps inside its card and never widens the page */
.cw-lead,.cw-ask,.cw-msg,.cw-switch,.gold.cw-go,.cw-seats-t b,.cw-share .cw-lead b{overflow-wrap:anywhere}
.cw-share{scroll-margin-top:calc(var(--toph,84px) + 8px);scroll-margin-bottom:16px}
/* a card still loading stands as tall as a first card, across the waterline */
.cw-wait-card{min-height:calc(var(--sw)*88/390)}
/* the crew as faces at the top of the first card, with its one line */
.cw-seats{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.cw-faces{flex:0 0 auto;display:flex;align-items:center}
.cw-faces .av+.av{margin-left:-9px}
.av.seat.cw-more::before{content:attr(data-more);font:700 14px/1 Inter,sans-serif;margin:0}
.cw-seats-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.cw-seats-t b{font:700 25px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em;color:var(--t1)}
.cw-seats-t span{font-size:14.5px;line-height:1.4;color:var(--t2)}
.cw-nonek{margin:2px 0 8px}
.cw-next .cw-pickrow{min-height:76px}
.cwcard>.gold.cw-go{margin-top:14px}
.cw-addnum{display:inline-block;margin:-4px 0 14px}
/* the join card: two faces meeting, then what joining gets you, in pictures */
.cw-meet{display:flex;align-items:center;justify-content:center;margin:2px 0 14px}
.cw-meet>.av{flex:0 0 auto}
.cw-meet-l{flex:0 0 30px;height:0;border-top:2.5px dotted color-mix(in srgb,var(--gold) 80%,transparent);margin:0 6px}
.cw-joincard>.eyebrow{text-align:center}
.cw-joincard>.cw-lead[data-join-who],.cw-joincard>[data-join-same]{text-align:center}
.cw-gets{list-style:none;margin:4px 0 16px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cw-gets li{display:flex;flex-direction:column;align-items:stretch;gap:7px;text-align:center;min-width:0}
.cw-gets b{font-size:12.5px;font-weight:650;line-height:1.25;color:var(--t1)}
.cw-get-p{position:relative;display:flex;align-items:center;justify-content:center;height:66px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.cw-get-p .tile{flex:1 1 auto;width:100%;height:100%;border-radius:0}
.cw-get-going{flex-direction:column;gap:7px}
.cw-get-h{font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.13em;text-transform:uppercase;font-style:normal;color:var(--go)}
:root[data-dark="1"] .cw-get-h{color:color-mix(in srgb,var(--go) 80%,var(--t1))}
/* naming the crew: a jersey with the name on it, the names to pick from, a box */
.cw-namehead{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.cw-namehead-t{flex:1 1 auto;min-width:0}
.cwcard .cw-namehead-t>.eyebrow{display:block;margin:0 0 6px}
.cw-namehead .cw-lead{margin:0;text-wrap:balance}
.cw-jersey{position:relative;flex:0 0 auto;display:block;width:120px;height:120px;
  filter:drop-shadow(0 1px 1px color-mix(in srgb,var(--shade) 22%,transparent)) drop-shadow(var(--shx) 6px 7px color-mix(in srgb,var(--shade) 26%,transparent))}
.cw-jersey svg{display:block;width:100%;height:100%}
.jy-body{fill:var(--accent)}
.jy-shade{fill:color-mix(in srgb,var(--shade) 30%,transparent)}
.jy-lit{fill:color-mix(in srgb,var(--lum) 20%,transparent)}
.jy-trim{fill:none;stroke:var(--gold);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
:root[data-dark="1"] .jy-trim{stroke:var(--paper)}
/* The name is lettered as big as the chest holds (fitJerseys), in even
   lines, and a word breaks only when no size would fit it. */
.cw-jersey b{position:absolute;left:26%;right:26%;top:26%;bottom:15%;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:.94;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;
  color:var(--paper);overflow:hidden;overflow-wrap:normal}
.cw-jersey b.brk{overflow-wrap:anywhere}
:root[data-dark="1"] .cw-jersey b{color:var(--on-gold)}
.cw-jersey.sm{width:46px;height:46px}
.cw-namepicks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 10px}
/* The names are raised paper chips that break between words, never inside
   the joke; the picked one takes gold's soft partner and the gold ring. The
   box under them stays the pressed well. */
.cw-namepick{position:relative;justify-content:center;text-align:center;min-height:42px;padding:3px 10px;font-size:13.5px;line-height:1.18;border-radius:14px;text-wrap:balance;
  color:var(--t1);background:linear-gradient(180deg,var(--pan-a),var(--pan-b));box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.cw-namepick::after{content:"";position:absolute;inset:-3px -3px}
.cw-namepick[aria-pressed="true"]{color:var(--t1);background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 24%,var(--pan-a)),color-mix(in srgb,var(--gold) 16%,var(--pan-b)));
  box-shadow:var(--e1),inset 0 0 0 2px var(--gold)}
:root[data-dark="1"] .cw-namepick[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 26%,var(--paper)),color-mix(in srgb,var(--gold) 17%,var(--paper)));
  box-shadow:var(--e1),0 0 14px -6px color-mix(in srgb,var(--gold) 60%,transparent),inset 0 0 0 2px var(--gold)}
.cw-namecard [data-namepick-save]{scroll-margin-bottom:14px}
.cw-nameown{margin:0}
.cw-nameown input{min-height:48px}
.cw-namecard>.gold.cw-go{margin-top:10px}
.cw-namenote{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:10px 14px 10px 10px;border-radius:16px;background:var(--well);
  box-shadow:inset 0 1px 2.5px color-mix(in srgb,var(--shade) 18%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--shade) 6%,transparent)}
:root[data-dark="1"] .cw-namenote{background:color-mix(in srgb,var(--pan-b) 50%,var(--well))}
.cw-namenote span{font-size:14.5px;line-height:1.4;color:var(--t2)}
.cw-namenote .cw-link{font-size:14.5px}
.cwcard.panel.cw-under{margin-top:14px;padding:16px}
.cw-get-going .av{width:22px;height:22px;font-size:10.5px}
.cw-get-list{flex-direction:column;align-items:stretch;gap:6px;padding:0 13px}
.cw-get-list i{display:flex;align-items:center;gap:6px;height:12px}
.cw-get-list i::before{content:"";flex:0 0 12px;height:12px;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 60%,transparent)}
.cw-get-list i.on::before{background:var(--go);box-shadow:none}
.cw-get-list i::after{content:"";flex:1 1 auto;height:5px;border-radius:3px;background:color-mix(in srgb,var(--t3) 40%,transparent)}
.cw-get-list i.on::after{background:color-mix(in srgb,var(--t3) 25%,transparent)}
/* Plan a trip: the week as date stamps, the day's best as picture rows */
.cw-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 12px}
.datestamp.cw-day{flex:none;width:auto;height:58px;padding:0;border:0;cursor:pointer;font:inherit;color:inherit}
.cw-day i{font-size:10.5px;letter-spacing:.08em;line-height:18px}
.cw-day b{font-size:23px}
.cw-day[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold),0 6px 14px -6px color-mix(in srgb,var(--gold) 80%,var(--shade))}
.cw-day[aria-pressed="true"] i{background:var(--gold);color:var(--on-gold)}
.cw-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cw-picks{margin:0 0 12px}
.cw-pickrow{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.cw-pickrow{grid-template-columns:48px minmax(0,1fr) auto 22px;min-height:70px}
button.cw-pickrow+button.cw-pickrow::before{content:"";position:absolute;left:72px;right:0;top:0;height:1px;background:var(--edge)}
.cw-pickrow[aria-pressed="true"]{background:color-mix(in srgb,var(--go) 10%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--go) 55%,transparent)}
.cw-picked{grid-column:4;grid-row:1/span 4;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--t3) 55%,transparent)}
.cw-picked svg{width:12px;height:12px;opacity:0}
.cw-pickrow[aria-pressed="true"] .cw-picked{background:var(--go);box-shadow:none;color:var(--paper)}
:root[data-dark="1"] .cw-pickrow[aria-pressed="true"] .cw-picked{color:var(--bg)}
.cw-pickrow[aria-pressed="true"] .cw-picked svg{opacity:1}
:root[data-dark="1"] .cw-seg,:root[data-dark="1"] .cw-condslot .cwcall{background:color-mix(in srgb,var(--pan-b) 50%,var(--well))}
/* the go call's own small picture: no guide line under the river's */
.cw-callpic .f-base{display:none}
/* who made the trip, and its note: one quiet line on the plan card */
.cw-planfoot{display:flex;flex-wrap:wrap;gap:3px 12px;margin:12px 0 0;font-size:13.5px;line-height:1.4;color:var(--t2)}
.cw-planfoot:has(span:only-child:empty){display:none}
.cw-tripnote{flex:1 1 100%;min-width:0;color:var(--t1);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
/* the trip's own buttons: two to a row, Delete last */
[data-cw-acts]{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
[data-cw-acts] .cw-act{width:100%}
[data-cw-acts] .cw-act:last-child:nth-child(odd){grid-column:1/-1}
.asof{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 0;font-size:12.5px;line-height:1.45;color:var(--t3)}
.asof .chip{position:relative}
.asof .chip::after{content:"";position:absolute;inset:-8px}
.pn{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin:14px 0 0}
.pnb{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:9px 14px;text-decoration:none;
  border-radius:16px;color:var(--t1);min-width:0;background:linear-gradient(180deg,var(--pan-a),var(--pan-b));
  box-shadow:var(--e1),inset 0 1px 0 var(--rim),inset 0 0 0 1px var(--edge)}
.pnb:active{transform:translateY(1px)}
.pnb.next{text-align:right}
.pnb span{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--accent)}
.pnb b{font-weight:650;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnb.none{visibility:hidden}
.pos{align-self:center;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
[data-view="card"] .card{margin-bottom:0}

/* ---- species picker ---- */
.pick{margin:4px 0 0}

/* ---- where ---- */
.locs{display:contents}
.locone{font-size:13px;color:var(--t3);margin:0 0 4px}
.locone strong{color:var(--ink2);font-weight:600}

/* ---- card groups ---- */
.card{padding:15px 16px;margin:0 0 12px;line-height:1.55}
.card > h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;font-size:17px;margin:0 0 8px;color:var(--ink)}
.card .when{margin-bottom:2px}
.card p{font-size:14.5px;color:var(--ink2);margin:0 0 10px}
.card :last-child{margin-bottom:0}
.card p.stamp{font:500 12px/1.4 Inter,system-ui,sans-serif;color:var(--t3);margin:14px 0 0;
  padding-top:8px;border-top:1px solid var(--line)}
/* The card's title is in the sky on a screen that shows one card. */
[data-view="card"] .card>h3,[data-view="crewtrip"][data-sec] .card>h3{display:none}

/* ---- add to trip ---- */
/* the card's main action: the kit's gold button until it is picked, then lit
   green with its tick */
.addtrip.gold{min-height:54px;margin:16px 0 0;font-size:19px;gap:9px}
.addtrip::before{content:"+";font:700 23px/1 "Barlow Condensed",sans-serif}
.addtrip.gold[aria-pressed="true"],:root[data-dark="1"] .addtrip.gold[aria-pressed="true"]{
  color:var(--go);background:color-mix(in srgb,var(--go) 12%,var(--pan-a));filter:none;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--go) 50%,transparent);
}
.addtrip[aria-pressed="true"]::before{content:"";width:6px;height:11px;margin:-3px 3px 0 0;border:solid var(--go);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}

/* ---- trip bar ---- */
.tripbar{
  position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;margin:22px -4px 0;padding:8px 8px 8px 18px;
  display:flex;align-items:center;gap:12px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:var(--e2),inset 0 1px 0 var(--rim),inset 0 0 0 1px color-mix(in srgb,var(--lum) 22%,transparent);
}
.screen:has(.tripbar) .act{bottom:calc(76px + env(safe-area-inset-bottom))}
.tripbar span{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;font-size:14px;color:var(--t2)}
/* The trip bar's button is ink, like the lit tab: gold is kept for the one
   main action on a screen. */
.tripgo{
  flex:0 0 auto;min-height:40px;padding:0 18px;border-radius:999px;cursor:pointer;border:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 88%,var(--paper)),var(--ink));color:var(--paper);
  font:700 14px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;
  box-shadow:0 1px 1px color-mix(in srgb,var(--shade) 30%,transparent),inset 0 1px 0 color-mix(in srgb,var(--paper) 22%,transparent);
}

/* ---- field mode ---- */
/* Bigger everything. Cold hands, head lamp, one eye on the rod. */
.fieldmode .hero{padding-top:calc(26px + env(safe-area-inset-top));min-height:calc(var(--sw)*var(--cardy)/390 - 20px)}
.tripdate{font:600 12.5px/1.25 Inter,system-ui,sans-serif;color:var(--t1);min-height:36px;padding:4px 11px;border:0;border-radius:999px;
  background:var(--glass);box-shadow:var(--e1),inset 0 1px 0 var(--rim)}
.fieldmode .card{padding:18px 18px;border-radius:18px;margin-bottom:16px}
.fieldmode .card > h3{font-size:21px;margin-bottom:11px}
.fieldmode .card p,.fieldmode .box{font-size:17px;line-height:1.5}
.fieldmode .box>b:first-child{font-size:15.5px}
.fieldmode ol.steps li{font-size:17px;padding-left:44px}
.fieldmode .sp .v{font-size:18px}
.fieldmode .sp .have{font-size:12px}
.fieldmode .card p.stamp{font-size:12.5px}

/* Four spec columns is too tight on a phone. The original card had this and
   the new spec strip needs it just as much. */
@media (max-width:420px){
  .specs{grid-template-columns:repeat(2,1fr)}
}

/* ---- the crew's screens in the new shell, until their own stage ---- */
.cw.float{padding:16px}
.cw.float>:first-child{margin-top:0}
.cw.float>.cw-out:last-child,.cw.float>.cw-plain:last-child{margin-bottom:0}
.float.cw-cond{display:flex;align-items:center;min-height:calc(var(--sw)*88/390);margin:0;padding:14px 16px;border:0;border-radius:22px;font-weight:600;
  background:linear-gradient(180deg,var(--glass),var(--pan-b) 62%)}
.float.cw-cond.go{box-shadow:var(--e2),inset 0 1px 0 var(--rim),inset 0 0 0 1.5px color-mix(in srgb,var(--go) 50%,transparent)}
.float.cw-cond.no{box-shadow:var(--e2),inset 0 1px 0 var(--rim),inset 0 0 0 1.5px color-mix(in srgb,var(--no) 50%,transparent)}
.hero+.cw-msg{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:14px;color:var(--t2);background:var(--glass);box-shadow:var(--e1)}
[data-cw-going].grp{margin-top:18px}
[data-hot-wait]{min-height:calc(var(--sw)*88/390)}
[data-notlisted] .box p{margin:0}
[data-notlisted] .box p+p{margin-top:6px}
.float.fallback{padding:14px 16px}
.float.fallback .box{margin-top:12px}
.grp[data-cw-trips]{margin-top:0}
[data-rules-status]:empty,[data-call-slot]:empty,[data-rules-slot]:empty{display:none}
[data-rules-status="top"] .box{margin:12px 0 0}
[data-view="hot"] [data-rules-slot] .box{margin:0 0 12px}

@media (prefers-reduced-motion:reduce){
  .kstep.on .draw{transition:none}
  .cw-rowbtn .chev{transition:none}
  .cw-sw-k,.cw-sw-k::after{transition:none}
  .floatbob{animation:none}
}
</style>
</head>
<body>
<!-- Shared rig parts. Diagrams draw them with <use href="#hook">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="hook" viewBox="0 0 40 104">
    <circle cx="20" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M20 12.5 L20 58" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M20 58 C20 86 9 92 5.5 76 L5.5 58" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5.5 63 L11 70" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="swivel" viewBox="0 0 22 42">
    <circle cx="11" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
    <rect x="6" y="11.5" width="10" height="19" rx="4.5" fill="currentColor"/>
    <circle cx="11" cy="36" r="4.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
  </symbol>
  <symbol id="shot" viewBox="0 0 20 16">
    <ellipse cx="10" cy="8" rx="9" ry="7.2" fill="currentColor"/>
    <path d="M10 1.2 L10 14.8" stroke="var(--panel)" stroke-width="1.6"/>
  </symbol>
</defs></svg>
<div class="phone">
  <div class="scene" id="scene" data-scene="sound" aria-hidden="true"></div>
  <div id="app" class="screen"></div>
</div>

<script src="/rigs/diagrams.js"></script>
<script src="/rigs/content.js"></script>
<script src="/rigs/trips.js"></script>
<script src="/rigs/runs.js"></script>
<script src="/rigs/crew.js"></script>
<script src="/rigs/rules.js"></script>
<script src="/rigs/waters.js"></script>
<script src="/rigs/spots-scene.js"></script>
<script>
(function () {
  "use strict";
  var RIG = (window.RIG = window.RIG || {});
  RIG.version = "1";

  var app = document.getElementById("app");
  var KEY = "rig.trip.v1";

  var GROUPS = [
    { key: "technique", label: "Technique", short: "Watch" },
    { key: "before", label: "Before you go", short: "Plan" },
    { key: "water", label: "At the water", short: "Fish" },
    { key: "after", label: "After", short: "After" }
  ];

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // ---- the look -----------------------------------------------------------
  // Every screen is built from the kit (rigs/kit.css) under a painted scene
  // (rigs/scene.js, rigs/scene.css). To put a screen into the look:
  //   topHtml(tab, active, scene, paint)  the dock. scene: sound, pier,
  //                                   river, lake or surf. paint: placePaint(spot, fish).
  //   heroHtml({ title, back, chips }) the title in the sky and its line of chips.
  //   then one .float card first (it crosses the waterline), then .panel
  //   cards, .well notes and h2.sect headings.
  // The scene itself is one element that outlives every redraw: setScene()
  // repaints it only when the place changes.
  var LOOK = !!(RIG.water && RIG.sky);
  var IC = {
    chev: '<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: '<svg viewBox="0 0 8 14" aria-hidden="true"><path d="M6.5 1.5 1.5 7l5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    go: '<svg viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    msg: '<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 5.6A2.6 2.6 0 0 1 5.6 3h10.8A2.6 2.6 0 0 1 19 5.6v7a2.6 2.6 0 0 1-2.6 2.6H10l-4.4 3.9v-3.9A2.6 2.6 0 0 1 3 12.6Z" fill="currentColor"/></svg>',
    note: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3.4A1.9 1.9 0 0 1 3.9 1.5h6.2A1.9 1.9 0 0 1 12 3.4v4.4a1.9 1.9 0 0 1-1.9 1.9H6.4L3.6 12.3V9.7A1.9 1.9 0 0 1 2 7.8Z" fill="currentColor"/></svg>'
  };
  var TICK = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.6 7.6 5.7 10.6 11.4 3.8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var sceneEl = document.getElementById("scene");
  // kind: sound, pier, river, lake or surf. o.lift: the screen has a filter
  // row under its tabs, so the whole picture stands that much lower and the

  }

  function rowHtml(c, href) {
    var s = snippet(c), m = metaOf(c);

  function chip(attr, id, text, active) {

  // The app's own courses. Knots is not one of them any more: every knot,

  function learnSections() {

  function chipsFor(tab, active) {

  // The dock, pinned: four ways in and the sky button, and under them one

  // The usual head: the title, and one chip that says where you are.

  function renderHome() {

        viewHtml(TYPE_VIEW[t.id] || "sound", "pic", own ? placePaint(own, "", { data: wx, type: t.id }) : null) + (hot[t.id] ? nowTag("hot") : "") +

  // The way to fish a spot was last opened from, so its page goes back there.
  var cameFrom = "";
  function renderWater(t) {
