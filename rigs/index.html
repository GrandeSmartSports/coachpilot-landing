  // When each trip at a spot fishes, the next twelve months from this one, as
  // a strip of months: gold its best months, its pale gold partner the months
  // it fishes, pressed in when it does not, this month ringed; and in a few
  // words its stretch. From the trips' own seasons (rigs/trips.js); a trip
  // whose rules are not settled, or with no way in, is left off as the week
  // leaves it off. A trip with a fish page here opens it.
  var MON1 = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
  function seasonsHtml(spotId, fishHere) {
    if (!plannerReady() || !RIG.trips.season) return "";
    var now = isoDay(todayIso()), y0 = now.getFullYear(), m0 = now.getMonth();
    function dayOf(y, m, d) {
      var dt = new Date(Date.UTC(y, m - 1, d)), mm = dt.getUTCMonth() + 1, dd = dt.getUTCDate();
      return { y: dt.getUTCFullYear(), m: mm, d: dd, dow: dt.getUTCDay(), iso: dt.getUTCFullYear() + "-" + (mm < 10 ? "0" : "") + mm + "-" + (dd < 10 ? "0" : "") + dd };
    }
    // the longest stretch of calendar months in a set, round the year's end
    function stretch(set) {
      var best = null, a, n;
      for (a = 0; a < 12; a++) {
        if (!set[a] || set[(a + 11) % 12]) continue;
        for (n = 0; n < 12 && set[(a + n) % 12]; n++);
        if (!best || n > best.n) best = { a: a, n: n };
      }
      return best && (best.n === 1 ? MON3[best.a] : MON3[best.a] + " to " + MON3[(best.a + best.n - 1) % 12]);
    }
    return (RIG.trips.plans || []).filter(function (p) { return p.spot === spotId && p.rules === "confirmed" && !p.access; }).map(function (p) {
      var cells = "", pk = {}, on = {}, nOn = 0, i;
      for (i = 0; i < 12; i++) {
        var y = y0 + Math.floor((m0 + i) / 12), m = ((m0 + i) % 12) + 1, v = "";
        [1, 8, 15, 22, 28].forEach(function (d) { var q = RIG.trips.season(p, dayOf(y, m, d)); if (q === "peak") v = "pk"; else if (q && !v) v = "ok"; });
        if (v) { on[m - 1] = 1; nOn++; }
        if (v === "pk") pk[m - 1] = 1;
        cells += "<b" + (v || !i ? ' class="' + v + (i ? "" : (v ? " " : "") + "now") + '"' : "") + ">" + MON1[m - 1] + "</b>";
      }

      var best = stretch(pk), line = p.digs ? "Dig days only" : nOn === 12 ? "All year" + (best ? ", best " + best : "") : best ? "Best " + best : "In season " + stretch(on);

      return "<" + tag + ' class="row season"' + (tag === "a" ? ' href="#/' + esc(p.species) + "/" + esc(spotId) + '"' : "") + ' data-season="' + esc(p.id) + '">' +
        '<span class="tx"><b>' + esc(p.name) + "</b><span>" + esc(line) + '</span><u class="months" aria-hidden="true">' + cells + "</u></span>" + (tag === "a" ? IC.chev : "") + "</" + tag + ">";
    }).join("");
  }

  function renderSpot(s) {

  function renderFish() {

  function speciesBase(sp, loc) { return "#/" + sp.id + "/" + (loc ? loc.id : "-"); }

  // ---- the crew ----------------------------------------------------------

  // What the sky chip says: the sky's name, and today's sunset when the
  // forecast has it. A screen held light or dark against the real sky says
  // that it is held, so the words match the picture.
  function skyWords() {
    var m = skyMode(), s = skyNow(), r = RIG.sky ? RIG.sky.resolve(s.h, s.sun, s.wx, m) : null;
    return { name: !r ? "" : r.forced ? (m === "dark" ? "Held dark" : "Held light") : r.skyName, sunset: s.sun && s.sun.set != null && RIG.trips && RIG.trips.clock ? "sunset " + RIG.trips.clock(s.sun.set) : "" };
  }
  // The head of the Trips tab, shared by the list and the map: the title,
  // the sky chip, and the List and Map switch.
  function tripsHeroHtml(mode, more) {
    var w = skyWords();
    var sw = '<span class="switch" role="group" aria-label="List or map">' + [["list", "List"], ["map", "Map"]].map(function (m) {
      return '<button type="button" data-tmode="' + m[0] + '" aria-current="' + (m[0] === mode ? "true" : "false") + '">' + m[1] + "</button>";
    }).join("") + "</span>";
    // With no sky engine there is no sky to name, so there is no chip.
    return heroHtml({ title: "Hot Trips", more: more,
      chips: (w.name ? '<span class="chip" data-skychip><i class="skytok"></i><b data-skyname>' + esc(w.name) + "</b><span data-sunset>" + esc(w.sunset) + "</span></span>" : "") + sw });
  }
  function renderTrips(force) {
    app.innerHTML = topHtml("trips") +
      '<div data-view="trips">' + tripsHeroHtml("list") +
      '<div data-call-slot></div><div data-cw-trips-slot>' + crewTripsHtml(crewSt()).top + "</div>" +
      '<div data-rules-status="top"></div>' +
      '<div data-week><div class="well"><p>Loading the forecast…</p></div></div><div data-cw-foot-slot>' + crewRowHtml() + "</div></div>" + tripBarHtml();
    crewTripsLoad();
    if (!plannerReady()) return;
    var c = RIG.trips.cached();
    if (c && !force) { lastPlan = planFrom(c); drawTrips(lastPlan); }
    RIG.trips.load(force).then(function (data) {
      if (!/^(#\/?)?(trips\/?)?$/.test(location.hash)) return;
      lastPlan = planFrom(data); drawTrips(lastPlan); applySky();
    }).catch(function () {
      var host = app.querySelector("[data-week]");
      if (host && !lastPlan) host.innerHTML = '<div class="well no" data-quiet><p><b>No forecast yet.</b> The weather servers did not answer. Open this once with a signal and it will keep the last one for the pier.</p></div>' +
        '<div class="asof"><span></span><button class="chip" type="button" data-refresh>Try again</button></div>';
    });
  }
  // ---- Hot Trips map ------------------------------------------------------
  // Same trips as the list, as pins. Leaflet is loaded only when the map is
  // opened, from our own copy. Map tiles are OpenStreetMap and need a signal;
  // the list does not, so the map says so instead of going blank.
  var HOME = [47.177, -122.186]; // Bonney Lake, city centre
  var leafletP = null, mapObj = null, mapDay = "all";
  function loadLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    if (leafletP) return leafletP;
    leafletP = new Promise(function (ok, no) {
      var css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "/rigs/vendor/leaflet.css";
      document.head.appendChild(css);
      var s = document.createElement("script");
      s.src = "/rigs/vendor/leaflet.js";
      s.onload = function () { ok(window.L); };
      s.onerror = function () { leafletP = null; no(new Error("leaflet did not load")); };
      document.head.appendChild(s);
    });
    return leafletP;
  }
  function shortDay(day) { return day.label.replace(/ [A-Z][a-z]{2} (\d+)$/, " $1"); }
  function renderMap() {
    app.innerHTML = topHtml("trips", "map") +
      '<div data-view="map">' + tripsHeroHtml("map", '<nav class="days" data-days aria-label="Day"></nav>') +
      '<div class="mapbox" id="tripmap"><div class="well"><p>Loading the map…</p></div></div>' +
      '<p class="legend"><span class="mk hot"><i></i>Hot</span><span class="mk good"><i></i>Good</span>' +
      '<span class="mk dim"><i></i>Nothing good</span><span class="mk home"><i></i>Home</span></p></div>' + tripBarHtml();
    if (!plannerReady()) return;
    RIG.trips.load().then(function (data) {
      if (!/^#\/trips\/map/.test(location.hash)) return;
      lastPlan = planFrom(data);
      drawMap(lastPlan);
    }).catch(function () {
      var box = document.getElementById("tripmap");
      if (box) box.innerHTML = '<div class="well no" data-quiet><p><b>No forecast yet.</b> The weather servers did not answer. Open this once with a signal.</p></div>';
    });
  }
  function drawMap(p) {
    var days = app.querySelector("[data-days]"), box = document.getElementById("tripmap");
    if (!days || !box) return;
    if (mapDay !== "all" && !p.days.some(function (d) { return d.iso === mapDay; })) mapDay = "all";
    days.innerHTML = chip("data-mapday", "all", "All week", mapDay) +
      p.days.map(function (d) { return chip("data-mapday", d.iso, shortDay(d) + (d.trips.length ? " · " + d.trips.length : ""), mapDay); }).join("");
    var bySpot = {};
    p.days.forEach(function (d) {
      if (mapDay !== "all" && d.iso !== mapDay) return;
      d.trips.forEach(function (t) { (bySpot[t.spot] = bySpot[t.spot] || []).push({ day: d, t: t }); });
    });
    loadLeaflet().then(function (L) {
      if (!box.isConnected) return;
      if (mapObj) { try { mapObj.remove(); } catch (e) { /* container already gone */ } }
      box.innerHTML = "";
      mapObj = L.map(box, { zoomControl: false, attributionControl: true });
      var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 17, className: "tiles-dark",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(mapObj);
      // With no signal the tiles never come. The pins still stand on the
      // chart, and one quiet chip says why there is no map under them.
      var note = document.createElement("span");
      note.className = "chip mapnote"; note.setAttribute("data-map-note", ""); note.hidden = true;
      note.textContent = "No signal. Pins only.";
      box.appendChild(note);
      var gotTile = false;
      tiles.on("tileload", function () { gotTile = true; note.hidden = true; });
      tiles.on("tileerror", function () { if (!gotTile) note.hidden = false; });
      var pts = [HOME];
      RIG.trips.spots.forEach(function (s) { if (bySpot[s.id]) pts.push([s.lat, s.lon]); });
      if (pts.length === 1) RIG.trips.spots.forEach(function (s) { pts.push([s.lat, s.lon]); });
      // The view has to exist before markers are added, or Leaflet holds
      // them back and they have no element to label yet.
      mapObj.fitBounds(pts, { padding: [36, 36], maxZoom: 11 });
      function pin(cls, label, count) {
        // Spots with nothing good are a bare dot: their names are in the
        // popup, and labels on every pin pile up when the map zooms out.
        return L.divIcon({ className: "mk " + cls + (count ? " group" : ""), iconSize: null, iconAnchor: [count ? 13 : 9, count ? 13 : 9],
          html: "<i>" + (count || "") + "</i>" + (cls === "dim" ? "" : "<b>" + esc(label) + "</b>") });
      }
      var RANK = { hot: 2, good: 1, dim: 0 };
      var spots = RIG.trips.spots.map(function (s) {
        var info = findSpot(s.id), name = info ? info.name : (s.name || s.id), list = bySpot[s.id] || [];
        var cls = list.some(function (x) { return x.t.heat === "Hot"; }) ? "hot" : list.length ? "good" : "dim";
        var html = "<b>" + esc(name) + "</b><br><small>" + driveWords(s.drive) + " drive</small>" +
          (list.length
            ? list.map(function (x) {
                return '<a class="pt" href="#/trips/' + encodeURIComponent(x.day.iso + "~" + x.t.planId) + '" data-pin-trip="' + esc(x.t.planId) + '">' +
                  "<span>" + esc(shortDay(x.day) + " \u00b7 " + x.t.slot) + "</span>" + esc(x.t.name) + " \u00b7 " + esc(x.t.heat) + "</a>";
              }).join("")
            : '<p class="pq">Nothing good ' + (mapDay === "all" ? "this week" : "this day") + '.</p>' +
              (info ? '<a class="pt" href="#/spot/' + esc(s.id) + '">Open the spot cards</a>' : ""));
        return { s: s, name: name, cls: cls, html: html };
      }).sort(function (a, b) { return RANK[b.cls] - RANK[a.cls]; });
      var layer = L.layerGroup().addTo(mapObj);
      // Home is drawn in a pane of its own, under every pin, so it never covers one.
      mapObj.createPane("home").style.zIndex = 590;
      var homeM = L.marker(HOME, { icon: pin("home", ""), pane: "home", keyboard: false, interactive: false }).addTo(mapObj);
      // Pins closer than a fingertip merge into one, with a count; the popup
      // lists every trip in the group. Zoom in and they split again.
      function drawPins() {
        layer.clearLayers();
        var groups = [];
        spots.forEach(function (x) {
          var pt = mapObj.latLngToContainerPoint([x.s.lat, x.s.lon]);
          var g = groups.filter(function (g) { return g.pt.distanceTo(pt) < 30; })[0];
          if (g) g.items.push(x); else groups.push({ pt: pt, items: [x] });
        });
        // A group is drawn at the middle of its spots, so after the first
        // pass two markers can still touch. Merge until none are closer than
        // a fingertip.
        function mid(g) {
          var n = g.items.length;
          return mapObj.latLngToContainerPoint([g.items.reduce(function (a, x) { return a + x.s.lat; }, 0) / n,
            g.items.reduce(function (a, x) { return a + x.s.lon; }, 0) / n]);
        }
        for (var merged = true; merged;) {
          merged = false;
          groups.forEach(function (g) { g.pt = mid(g); });
          for (var i = 0; i < groups.length && !merged; i++) for (var j = i + 1; j < groups.length; j++) {
            if (groups[i].pt.distanceTo(groups[j].pt) < 34) { groups[i].items = groups[i].items.concat(groups[j].items); groups.splice(j, 1); merged = true; break; }
          }
        }
        groups.forEach(function (g) { g.items.sort(function (a, b) { return RANK[b.cls] - RANK[a.cls]; }); });
        // A pin on top of home carries home as a small square at its foot,
        // instead of home hiding half under it.
        var hp = mapObj.latLngToContainerPoint(HOME), atHome = false;
        groups.forEach(function (g) {
          var top = g.items[0], n = g.items.length, near = g.pt.distanceTo(hp) < 26;
          if (near) atHome = true;
          var ll = n === 1 ? [top.s.lat, top.s.lon] : [
            g.items.reduce(function (a, x) { return a + x.s.lat; }, 0) / n,
            g.items.reduce(function (a, x) { return a + x.s.lon; }, 0) / n];
          var label = n === 1 ? top.name : n + " spots";
          var m = L.marker(ll, { icon: pin(top.cls + (near ? " athome" : ""), label, n > 1 ? n : 0), title: n === 1 ? top.name : g.items.map(function (x) { return x.name; }).join(", "),
            zIndexOffset: RANK[top.cls] * 1000 }).addTo(layer);
          // One spot: its trips. A group: zoom in until it splits.
          // A spot with a busy week scrolls inside its card, so the card always fits the map.
          if (n === 1) m.bindPopup(top.html, { maxWidth: 250, maxHeight: Math.max(180, mapObj.getSize().y - 110), autoPanPadding: [16, 16] });
          else m.on("click", function () {
            mapObj.fitBounds(g.items.map(function (x) { return [x.s.lat, x.s.lon]; }), { padding: [70, 70], maxZoom: 13 });
          });
          var el = m.getElement();
          if (el) el.setAttribute("data-pin", g.items.map(function (x) { return x.s.id; }).join(" "));
        });
        var he = homeM.getElement();
        if (he) he.style.visibility = atHome ? "hidden" : "";
      }
      mapObj.on("zoomend", drawPins);
      drawPins();
    }).catch(function () {
      box.innerHTML = '<div class="well no" data-quiet><p><b>The map needs a signal.</b> The trip list works offline.</p></div>';
    });
  }

  // ---- run cards: a trip, explained ------------------------------------
  // The overview is headlines (the plan, gear, bait...), each one a normal
  // card with Back and Next, built from rigs/runs.js plus this trip's own
  // tides, weather and times.
  function runSince(planId) {
    var run = RIG.trips && RIG.trips.runs && RIG.trips.runs[planId];
    return (run && run.checked) || RULES_BASE;
  }
  function findTrip(key) {
    var c = plannerReady() && RIG.trips.cached();
    var p = lastPlan || (c && planFrom(c));
    var bits = key.split("~"), day = p && p.days.filter(function (d) { return d.iso === bits[0]; })[0];
    var t = day && day.trips.filter(function (x) { return x.planId === bits[1]; })[0];

        cwField("From (optional)", '<input data-cw-from data-keep="newFrom" type="time" step="900" value="' + kv("newFrom") + '">') +
        cwField("To (optional)", '<input data-cw-to data-keep="newTo" type="time" step="900" value="' + kv("newTo") + '">') + "</div>" +
      '<p class="cw-k2">How sure?</p><div class="cw-seg" role="group" aria-label="How sure">' +
        '<button class="cw-pick" type="button" data-cw-pick="idea" aria-pressed="' + (cwT.newStatus === "idea" ? "true" : "false") + '">Just an idea</button>' +
        '<button class="cw-pick" type="button" data-cw-pick="planned" aria-pressed="' + (cwT.newStatus === "planned" ? "true" : "false") + '">It is on</button></div>' +
      cwField("A note (optional)", '<textarea data-cw-note data-keep="newNote" maxlength="280" placeholder="Meet at the pier at 5">' + kv("newNote") + "</textarea>") +
      tellHtml("new") + '<button class="gold cw-go" type="button" data-cw-create>Make the trip</button>' +
      cwSaid(cwT.newMsg, "", "data-cw-new-msg") + "</div></div>" + tripBarHtml();
  }
  // A trip is where a text or an alert lands, so it is often opened cold, on a
  // crew this phone saved hours ago. The Tell row and Who has it are drawn
  // from that, and a sender must not be choosing from yesterday's people: the
  // crew is asked for quietly, at most once a minute. The answer redraws the
  // trip through the one RIG.crew.onChange listener.
  function crewStFresh() {
    if (Date.now() - (cwT.stAt || 0) < 60e3) return;
    cwT.stAt = Date.now();
    RIG.crew.state({ fresh: true }).then(function (r) { if (!r || !r.me || r.stale) cwT.stAt = 0; });
  }
  // Nothing saved yet (a cold open straight onto a crew page): ask once.
  function crewStLoad() {
    cwT.stErr = "";
    RIG.crew.state().then(function (r) {
      if (r && !r.me && !r.signedOut) cwT.stErr = r.offline ? "No signal, and the crew is not saved on this phone yet." : r.error || "The crew could not be loaded. Try again in a minute.";
      crewRedraw();
    });
  }
  function newCreate() {
    var v = crewUi.vals, p = planOf(v.newPlan), today = todayIso(), from = boxHour(v.newFrom), to = boxHour(v.newTo);
    var note = String(v.newNote || "").trim(), bad = "";
    if (!p) bad = "Pick the trip first.";
    else if (!/^\d{4}-\d\d-\d\d$/.test(v.newDate || "") || v.newDate < today || v.newDate > isoPlus(today, 60)) bad = "Pick a day from today to " + dayDate(isoPlus(today, 60)) + ".";
    else if (!RIG.trips.plansOn(v.newDate).some(function (x) { return x.id === p.id; })) bad = p.name + " is not in season on that day. Pick another.";
    else if (from != null && to != null && !(to > from)) bad = "The end has to come after the start.";
    else if (note.length > 280) bad = "Keep the note to 280 characters.";
    if (bad) { cwT.newMsg = { t: bad, no: true }; newSync(); return; }
    cwOnce("create", function () {
      cwT.newMsg = { t: "Making it..." }; newSync();
      var here = location.hash;
      var body = { planId: p.id, spotId: p.spot, species: p.species, title: String(p.name).slice(0, 120), date: v.newDate, status: cwT.newStatus, seedList: seedOf(p.id) };
      if (from != null) body.from = from;
      if (to != null) body.to = to;
      if (note) body.note = note;
      return RIG.crew.createTrip(withTell(body, "new")).then(function (r) {
        // The sign-in is gone: the sign-in screen, right here, as on the trip page.
        if (r && r.signedOut) { cwT.newMsg = null; crewRedraw(true); return; }
        if (r && r.ok && r.trip) {
          v.newPlan = ""; v.newDate = ""; v.newFrom = ""; v.newTo = ""; v.newNote = ""; cwT.newMsg = null; cwT.newStatus = "idea";
          if (location.hash === here) location.hash = "#/crew/trip/" + r.trip.id;
          return;
        }
        cwT.newMsg = { t: r && r.offline ? "No signal. Making a trip needs one. Try again when you have some." : RIG.crew.say(r, "The trip could not be made. Try again."), no: true };
        newSync();
      });
    });
  }

  // ---- notes, the list and catches on a trip
  // Three boxes on the trip page, each filled by one function. d is
  // { trip, comments, list, catches } as tripData gives it, with waiting
  // writes already laid over it. A trip seen only in the week (d.thin) has
  // none of the three saved yet, so nothing is drawn until the whole trip lands.
  //   cwNotesHtml(d, section, shown)   section is a run card section id, or "" for the whole trip.
  //                             shown (trip page only) lists the section ids the run card has
  //                             right now: a note pinned to one it has dropped joins the trip's own.
  //   cwListHtml(d)             the list, a summary on top, a box to add a line
  //   cwCatchesHtml(d)          catches and Log a fish, once the day has come
  function isOwner() { var st = crewSt(); return !!(st && st.crew && st.crew.role === "owner"); }
  // "Tue 4:12 PM", or "Nov 9, 4:12 PM" once the weekday alone would not say which.
  function noteTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var near = Math.abs(Date.now() - d.getTime()) < 6 * 864e5;
    return (near ? DAY3[d.getDay()] : MON3[d.getMonth()] + " " + d.getDate() + ",") + " " + clk(d.getHours() + d.getMinutes() / 60);
  }
  function oldestFirst(rows) {
    return rows.map(function (r, i) { return { r: r, i: i }; })
      .sort(function (a, b) { return ((Date.parse(a.r.at) || 0) - (Date.parse(b.r.at) || 0)) || a.i - b.i; })
      .map(function (x) { return x.r; });
  }
  function waitTag() { return '<span class="cw-wait" data-cw-wait>' + (tripUi.sending ? "Sending" : "Waiting to send") + "</span>"; }
  // Delete asks once, inside the page. The question takes the place of the
  // small Delete, and the real one sits a line lower, so a double tap on the
  // first can never land on the second.
  function askHtml(words, yesAttr) {
    return '<p class="cw-asks">' + words + '</p><div class="cw-acts2"><button class="cw-act no" type="button" ' + yesAttr + ">Delete</button>" +
      '<button class="cw-act" type="button" data-cw-ask-no>Keep</button></div>';
  }
  function focusKeep(key) {
    var el = app.querySelector('[data-keep="' + key + '"]');
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not that kind of box */ } }
  }

  // New notes on a section. rig.crewlook.v1 is { tripId: { section: the
  // newest note time this phone has looked at there } }. A run card row gets
  // a dot while it holds someone else's note newer than that, and opening
  // the section is the look. A person's own note never raises one.
  var LOOK_KEY = "rig.crewlook.v1";
  function lookAll() {
    try { var m = JSON.parse(localStorage.getItem(LOOK_KEY) || "{}"); return m && typeof m === "object" ? m : {}; } catch (e) { return {}; }
  }
  function lookNew(tripId, sec, d) {
    var seen = Date.parse((lookAll()[tripId] || {})[sec] || "") || 0;
    return (d.comments || []).some(function (c) { return c.section === sec && !c.mine && !c.waiting && Date.parse(c.at) > seen; });
  }
  function lookMark(tripId, sec, d) {
    var newest = 0, at = "";
    (d.comments || []).forEach(function (c) {
      var when = c.section === sec && !c.waiting ? Date.parse(c.at) : 0;
      if (when > newest) { newest = when; at = c.at; }
    });
    var all = lookAll(), mine = all[tripId] || {};
    if (!at || Date.parse(mine[sec] || "") >= newest) return;
    mine[sec] = at;
    // Trips that have left the week need no memory.
    var st = crewSt(), live = {};
    if (st && st.trips && st.trips.length) {
      st.trips.forEach(function (t) { live[t.id] = true; });
      Object.keys(all).forEach(function (k) { if (!live[k]) delete all[k]; });
    }
    all[tripId] = mine;
    try { localStorage.setItem(LOOK_KEY, JSON.stringify(all)); } catch (e) { /* private mode: this visit only */ }
  }

  // The run card's parts by name, for a note whose part is not on the card
  // today (the weather and the river only show while the forecast reaches).
  var SEC_NAMES = { plan: "The plan", what: "What it is", gear: "Gear", bait: "Bait and lures", how: "How", wx: "Tide and weather",
    river: "River flow", spot: "The spot", expect: "What to expect", rules: "Rules" };
  function cwNotesHtml(d, section, shown) {
    if (d.thin) return "";
    var sec = section || "", owner = isOwner(), key = "t.note." + (sec || "trip");
    var mine = oldestFirst((d.comments || []).filter(function (c) {
      return (c.section || "") === sec || (!sec && shown && c.section && shown.indexOf(c.section) === -1);
    }));
    var notes = mine.map(function (c) {
      // The weather part is named for the water: a lake has no tide.
      var id = esc(c.id), part = !sec && c.section ? (c.section === "wx" ? wxName(d.trip && d.trip.spotId) : SEC_NAMES[c.section] || "") : "";
      return '<li class="cw-note' + (c.mine ? " mine" : "") + '" data-cw-note="' + id + '"' + (c.waiting ? " data-waiting" : "") + ">" +
        faceOf(c.by && c.by.id, c.by ? c.by.name : "Someone", "md") + '<div class="cw-bub">' +
        '<p class="cw-note-h"><b data-cw-note-who>' + esc(c.by ? firstName(c.by.name) : "Someone") + "</b>" +
        '<span data-cw-note-at>' + esc(noteTime(c.at)) + "</span>" + (part ? '<span data-cw-note-part>' + esc(part) + "</span>" : "") +
        (c.waiting ? waitTag() : "") + "</p>" +
        '<p class="cw-note-b" data-cw-note-body>' + esc(c.body) + "</p>" +
        (c.mine || owner ? (tripUi.ask === "note:" + c.id ? askHtml("Delete this note?", 'data-cw-note-del-yes="' + id + '"')
          : '<button class="cw-x" type="button" data-cw-note-del="' + id + '">Delete</button>') : "") + "</div></li>";
    }).join("");
    // The names to tell sit above the box, the button under it: a second tap
    // that lands where the button was finds the box, never a name.
    return '<section class="grp" data-cw-notebox><h2 class="sect">Notes' + (mine.length ? ' <span class="n">' + mine.length + "</span>" : "") + "</h2>" +
      (notes ? '<ul class="cw-nlist">' + notes + "</ul>" : "") +
      '<div class="panel cw cw-notebox">' + tellHtml("note") +
      '<div class="cw-compose">' + faceOf(RIG.crew.session() && RIG.crew.session().userId, (crewSt() && crewSt().me && crewSt().me.name) || "You", "md") +
        '<textarea data-cw-note-text data-keep="' + key + '" maxlength="1000" rows="1" placeholder="' + (sec ? "A note on this part" : "A note to the crew") +
        '" aria-label="' + (sec ? "Add a note on this part" : "Add a note on the whole trip") + '">' + kv(key) + "</textarea>" +
        '<button class="cw-send" type="button" data-cw-note-add="' + esc(sec) + '" aria-label="Add the note">' + IC.msg + "<span>Send</span></button></div>" +
      cwSaid(tripUi.nMsg, "", "data-cw-note-msg") + "</div></section>";
  }

  // "7 of 12 packed". Who has what is the face on each line.
  function listSummary(list) {
    if (!list.length) return "Nothing on the list yet.";
    return list.filter(function (i) { return i.done; }).length + " of " + list.length + " packed";
  }
  function itemOf(d, id) { return ((d && d.list) || []).filter(function (i) { return i.id === id; })[0] || null; }
  function cwListHtml(d) {
    if (d.thin) return "";
    var st = crewSt(), owner = isOwner(), list = d.list || [];
    var rows = list.map(function (it) {
      var id = esc(it.id), open = tripUi.open === it.id, mayEdit = it.mine || owner, has = it.assignedTo ? it.assignedTo.id : "", panel = "";
      var who = it.assignedTo ? firstName(it.assignedTo.name) : "nobody";
      function give(uid, name) {
        return '<button class="cw-pill" type="button" data-cw-give="' + esc(uid) + '" aria-pressed="' + (uid === has ? "true" : "false") + '">' + esc(name) + "</button>";
      }
      if (open && tripUi.rename === it.id && mayEdit) {
        panel = cwField("The words", '<input data-cw-item-name data-keep="t.rename" data-enter="data-cw-item-save" type="text" maxlength="120" autocomplete="off" value="' + kv("t.rename") + '">') +
          '<div class="cw-acts2"><button class="cw-act" type="button" data-cw-item-save>Save</button>' +
          '<button class="cw-act" type="button" data-cw-item-cancel>Leave it</button></div>';
      } else if (open && tripUi.ask === "item:" + it.id && mayEdit) {

      } else if (open) {
        panel = '<p class="cw-panel-h">Who has it?</p><div class="cw-pills">' +
          ((st && st.members) || []).map(function (m) { return give(m.id, firstName(m.name)); }).join("") + give("", "Nobody") + "</div>" +
          tellHtml("list") +
          (mayEdit ? '<div class="cw-acts2"><button class="cw-act" type="button" data-cw-item-rename>Rename</button>' +

      }
      return '<li class="cw-item' + (it.done ? " done" : "") + '" data-cw-item="' + id + '"' + (it.waiting ? " data-waiting" : "") + ">" +
        '<button class="cw-tick" type="button" role="checkbox" aria-checked="' + (it.done ? "true" : "false") + '" data-cw-tick="' + id +
          '" aria-label="Packed: ' + esc(it.label) + '"><i aria-hidden="true">' + TICK + "</i></button>" +
        '<span class="cw-item-l" data-cw-item-label><span>' + esc(it.label) + "</span>" + (it.waiting ? waitTag() : "") + "</span>" +
        '<button class="cw-whob' + (it.assignedTo ? "" : " none") + '" type="button" data-cw-who="' + id + '" aria-expanded="' + (open ? "true" : "false") +
          '" aria-label="' + esc(it.assignedTo ? who + " has it. Change who." : "Nobody has it. Pick who.") + '">' +
          (it.assignedTo ? faceOf(it.assignedTo.id, it.assignedTo.name) : "") + "<span>" + esc(who) + "</span></button>" +
        (open ? '<div class="cw-panel" data-cw-panel>' + panel + (tripUi.pMsg ? cwSaid(tripUi.pMsg, "", "data-cw-panel-msg") : "") + "</div>" : "") + "</li>";

    return '<section class="grp" data-cw-listbox><h2 class="sect">The list' + (list.length ? ' <span class="n" data-cw-list-sum>' + esc(listSummary(list)) + "</span>" : "") + "</h2>" +
      (list.length ? "" : '<p class="cw-sum" data-cw-list-sum>' + esc(listSummary(list)) + "</p>") +
      '<ul class="panel cw-items">' + rows + "</ul>" +
      '<div class="cw-addline"><input data-cw-item-new data-keep="t.item" data-enter="data-cw-item-add" type="text" maxlength="120" autocomplete="off" ' +
        'placeholder="Add a line" aria-label="Add a line" value="' + kv("t.item") + '">' +
      '<button class="cw-act" type="button" data-cw-item-add>Add</button></div>' +
      cwSaid(tripUi.lMsg, "", "data-cw-list-msg") + "</section>";
  }

  // Catch photos with no signal. A photo that has been on this screen is
  // kept on the phone (the browser's own cache store, the newest PHOTO_KEEP
  // of them), so a catch that was seen still has its picture at the pier.
  var PHOTO_BOX = "rigphotos-v1", PHOTO_KEEP = 60, photoLocal = {}, photoAsked = {};
  function photoBox() {
    try { return window.caches ? window.caches.open(PHOTO_BOX).then(null, function () { return null; }) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); }
  }
  function photoSrc(url) { return photoLocal[url] || url; }
  function photoKeep(url) {
    if (!/^https:\/\//.test(url || "") || photoAsked[url]) return;
    photoAsked[url] = true;
    photoBox().then(function (box) {
      if (!box) return null;
      return box.match(url).then(function (hit) {
        if (hit) return null;
        return fetch(url, { mode: "cors", credentials: "omit" }).then(function (res) {
          if (!res.ok) return null;
          return box.put(url, res).then(function () { return box.keys(); }).then(function (keys) {
            return Promise.all(keys.slice(0, Math.max(0, keys.length - PHOTO_KEEP)).map(function (k) { return box.delete(k); }));
          });
        });
      });
      // One try for each photo on each visit: a store that will not hand it
      // over is not asked again every time the screen is redrawn.
    }).then(null, function () { /* not kept this time */ });
  }
  // The phone's own copy of a photo, as an address an <img> can show, or "".
  function photoSaved(url) {
    if (photoLocal[url]) return Promise.resolve(photoLocal[url]);
    return photoBox().then(function (box) { return box ? box.match(url) : null; })
      .then(function (hit) { return hit ? hit.blob() : null; })
      .then(function (b) { if (b) photoLocal[url] = URL.createObjectURL(b); return photoLocal[url] || ""; }, function () { return ""; });
  }
  function photoMiss(img) {
    var b = img.closest("[data-cw-photo]");
    img.hidden = true;
    if (b) { b.setAttribute("data-nophoto", ""); b.setAttribute("aria-label", "This photo needs a signal"); }
  }
  // Neither load nor error bubbles, so both are caught on the way down.
  app.addEventListener("load", function (e) {
    var img = e.target;
    if (img && img.matches && img.matches("img[data-cw-img]")) photoKeep(img.getAttribute("data-cw-img"));
  }, true);
  app.addEventListener("error", function (e) {
    var img = e.target;
    if (!img || !img.matches || !img.matches("img[data-cw-img]")) return;
    if (img.getAttribute("data-tried")) { photoMiss(img); return; }
    img.setAttribute("data-tried", "1");
    photoSaved(img.getAttribute("data-cw-img")).then(function (local) {
      if (!img.isConnected) return;
      if (local && img.getAttribute("src") !== local) img.src = local; else photoMiss(img);
    });
  }, true);

  function sizeWords(c) {
    function num(v) { return String(Math.round(v * 100) / 100); }
    return [c.lengthIn != null ? num(c.lengthIn) + " in" : "", c.weightLb != null ? num(c.weightLb) + " lb" : ""].filter(Boolean).join(", ");
  }
  function fishName(trip) {
    var sp = findSpecies(trip.species), id = String(trip.species || "");
    return sp ? sp.name : id.charAt(0).toUpperCase() + id.slice(1);
  }
  function catchFormHtml() {
    var has = !!tripUi.photo;
    return '<div class="cw cw-form" data-cw-catch-form>' +
      cwField("Fish", '<input data-cw-catch-species data-keep="t.species" type="text" maxlength="40" autocomplete="off" value="' + kv("t.species") + '">') +
      '<div class="cw-two">' +
        cwField("Length, inches", '<input data-cw-catch-len data-keep="t.len" type="text" inputmode="decimal" autocomplete="off" placeholder="Optional" value="' + kv("t.len") + '">') +
        cwField("Weight, pounds", '<input data-cw-catch-wt data-keep="t.wt" type="text" inputmode="decimal" autocomplete="off" placeholder="Optional" value="' + kv("t.wt") + '">') + "</div>" +
      cwField("Lure or bait", '<input data-cw-catch-lure-in data-keep="t.lure" type="text" maxlength="80" autocomplete="off" placeholder="Optional" value="' + kv("t.lure") + '">') +
      cwField("A note", '<textarea data-cw-catch-note-in data-keep="t.cnote" maxlength="500" placeholder="Optional">' + kv("t.cnote") + "</textarea>") +
      '<div class="cw-photo">' + (tripUi.photoUrl ? '<img data-cw-catch-preview src="' + esc(tripUi.photoUrl) + '" alt="The photo you picked">' : "") +
        '<label class="cw-act cw-file"><input type="file" accept="image/*" data-cw-catch-photo>' + (has ? "Change the photo" : "Add a photo") + "</label>" +
        (has ? '<button class="cw-act" type="button" data-cw-catch-nophoto>No photo</button>' : "") + "</div>" +
      tellHtml("catch") +
      '<button class="cw-plain cw-main" type="button" data-cw-catch-save' + (tripUi.cBusy ? " disabled" : "") + ">Save the fish</button>" +
      '<button class="cw-plain" type="button" data-cw-catch-cancel>Not now</button></div>';
  }
  // A catch with no photo still has a picture: the trip's own water, small,
  // under the sky of the hour it was caught (a squid at dark is lit).
  function catchPic(trip, c, sky) {
    var kind = waterKind({ planId: trip.planId, spot: trip.spotId, species: trip.species, name: trip.title }), d = new Date(c && c.at), under = "";
    if (!isNaN(d)) under = sky(isoOf(d), d.getHours() + d.getMinutes() / 60, trip.spotId);
    return miniHtml(kind === "beach" ? "sound" : kind, under || skyId(), "", placePaint(trip.spotId, trip.species,
      !isNaN(d) ? { iso: isoOf(d), from: d.getHours() + d.getMinutes() / 60, planId: trip.planId, data: sky.saved } : crewAt(trip, sky.saved)));
  }
  function cwCatchesHtml(d) {
    if (d.thin) return "";
    var trip = d.trip, list = oldestFirst(d.catches || []), sky = skyReader();
    if (!list.length && trip.date > todayIso()) return "";
    var rows = list.map(function (c) {
      var id = esc(c.id), size = sizeWords(c), who = c.by ? firstName(c.by.name) : "Someone";
      // Who and when on one line; the lure on its own, so no dot is left at a line's end.
      var meta = ['<span class="cw-cwho">' + faceOf(c.by && c.by.id, who, "sm") + '<span data-cw-catch-who>' + esc(who) + "</span></span>", '<span data-cw-catch-at>' + esc(noteTime(c.at)) + "</span>"];
      return '<li class="panel cw-catch" data-cw-catch="' + id + '"' + (c.waiting ? " data-waiting" : "") + ">" +
        (c.photoUrl ? '<button class="cw-thumb" type="button" data-cw-photo="' + id + '" aria-label="See the photo large"><img data-cw-img="' + esc(c.photoUrl) +
          '" src="' + esc(photoSrc(c.photoUrl)) + '" alt="' + esc(who + ", " + c.species) + '"></button>' : '<span class="cw-thumb nopic">' + catchPic(trip, c, sky) + "</span>") +
        '<div class="cw-catch-t"><p class="cw-catch-h"><b data-cw-catch-what>' + esc(c.species) + "</b>" +
          (size ? '<span data-cw-catch-size>' + esc(size) + "</span>" : "") + "</p>" +
        '<p class="cw-catch-m">' + meta.join("") + "</p>" +
        (c.lure ? '<p class="cw-catch-m cw-lure"><span data-cw-catch-lure>' + esc(c.lure) + "</span></p>" : "") +
        (c.notes ? '<p class="cw-catch-n" data-cw-catch-notes>' + esc(c.notes) + "</p>" : "") +
        (c.waiting ? '<p class="cw-catch-m">' + waitTag() + "</p>" : "") +

  // Knot step players. Cards are re-rendered as plain HTML, so the players

    [].forEach.call(root.querySelectorAll(".tyer"), function (fig) {
      if (fig.dataset.ready) return;

      var rail = fig.querySelector(".rail"), cap = fig.querySelector(".cap"), play = fig.querySelector(".play");
      if (!steps.length || !rail || !cap || !play) return;
      fig.dataset.ready = "1";

      steps.forEach(function (g) {

      }

      function run() {
        if (cur >= steps.length - 1) go(0);
        play.textContent = "Stop";

          if (!fig.isConnected) { timer = null; return; }
          if (cur < steps.length - 1) { go(cur + 1); timer = setTimeout(tick, reduce ? 900 : 1900); }
          else stop();

  // ---- the sky: the screen is the light Coach is standing in -------------

  var SKY_KEY = "rig.skymode.v1";

  }

    var mode = skyMode(), s = skyNow();
    var r = RIG.sky.resolve(s.h, s.sun, s.wx, mode), root = document.documentElement;
    // The same sky as last time: its colours are on the page already, and
    // writing them again would restyle every element for nothing.
    var key = r.id + "|" + mode + "|" + (r.p && r.p.name);
    if (key !== skyKey || root.getAttribute("data-sky") !== r.id) {
      skyKey = key;
      RIG.sky.apply(root, r);
      if (RIG.water) RIG.water.dress(root, r.p);
    }
    // The top of the page is sky now, so that is the colour the phone's own
    // bar takes.
    var theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute("content", r.p.sky[0]);
    app.querySelectorAll("[data-skymode]").forEach(function (b) {
      b.setAttribute("data-held", mode === "auto" ? "no" : "yes");
      b.setAttribute("aria-label", mode === "auto" ? "Screen follows the sky. Tap to hold it light."
        : mode === "light" ? "Screen held light. Tap to hold it dark." : "Screen held dark. Tap to follow the sky.");
      var l = b.querySelector("[data-skylabel]");
      if (l) l.textContent = mode === "auto" ? "Sky" : mode === "light" ? "Light" : "Dark";
    });
    var w = skyWords();
    app.querySelectorAll("[data-skyname]").forEach(function (el) { el.textContent = w.name; });
    app.querySelectorAll("[data-sunset]").forEach(function (el) { el.textContent = w.sunset; });
  }

  // When the screen was last drawn, and for which day. The installed app is
  // suspended, not reloaded, when Coach switches away from it, so coming
  // back the next morning would otherwise leave yesterday's trips on screen.
  var drawnDay = "", drawnAt = 0;
  function todayIso() {
    var n = new Date();
    return n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
  }
  function refreshIfStale() {
    if (document.visibilityState === "hidden") return;
    // Same day and still fresh: nothing to redraw, but the sun may have set
    // while the phone was in a pocket, so the sky is checked every time.
    if (drawnDay === todayIso() && Date.now() - drawnAt < 3 * 3600e3) { applySky(); return; }
    render();
    checkRules();
  }

  // Once the page has moved, the dock keeps a band of sky behind it (kit.css
  // reads data-scrolled), so what scrolls past goes behind it.
  var movedOn = false;
  function markMoved() {
    var on = (window.scrollY || document.documentElement.scrollTop || 0) > 6;
    if (on !== movedOn) { movedOn = on; document.documentElement.toggleAttribute("data-scrolled", on); }
  }
  window.addEventListener("scroll", markMoved, { passive: true });

  // The band fits its title. Between the last chip under the title and the
  // first card, about BAND_GAP of the picture shows (the approved run card
  // shows 97 px). A title that wraps, or a filter row, would press the card
  // up into the chips; instead the picture stands taller, from the top, the
  // way it does for a filter row (--tall adds to --lift in kit.css).
  var BAND_GAP = 92, bandKey = "", bandTall = "0px";
  function setTall(v) { if (v !== bandTall) { bandTall = v; document.documentElement.style.setProperty("--tall", v); } }
  function fitBand() {
    var root = document.documentElement;
    if (!LOOK || mode() === "field") { bandKey = ""; setTall("0px"); return; }
    // The map is a tool, not a card: its days sit on the picture by design.
    var hero = app.querySelector("[data-view]:not([data-view=\"map\"]) > .hero");
    if (!hero) { bandKey = ""; setTall("0px"); return; }
    // A redraw of the same screen (the same title and chips over the same
    // first card, at the same width, with the same fonts) stands the picture
    // the same: nothing is measured, and nothing on the page is restyled.
    var first = hero.nextElementSibling;
    while (first && !first.offsetHeight && first.nextElementSibling) first = first.nextElementSibling;
    var key = location.hash + "|" + hero.className + "|" + hero.innerHTML + "|" + (first ? first.tagName + "." + first.className : "") + "|" + window.innerWidth + "|" + root.getAttribute("data-lift") +
      "|" + (document.fonts ? document.fonts.status : "");
    if (key === bandKey) return;
    bandKey = key;
    root.style.setProperty("--tall", "0px"); bandTall = "0px";
    var bottom = 0;
    [].forEach.call(hero.children, function (e) { if (e.offsetHeight) bottom = Math.max(bottom, e.getBoundingClientRect().bottom); });
    var el = hero.nextElementSibling;
    while (el && !el.offsetHeight) el = el.nextElementSibling;
    // A screen that opens on a heading on glass: the card is the one under it.
    var lead = el && el.querySelector(":scope > h2.sect.lead"), card = lead ? lead.nextElementSibling : el;
    if (!bottom || !card) return;
    var short = BAND_GAP - (card.getBoundingClientRect().top - bottom);
    if (short > 0.5) setTall(Math.ceil(short) + "px");
  }
  function stripFade(el) {
    var l = el.scrollLeft > 2, r = el.scrollLeft + el.clientWidth < el.scrollWidth - 2;
    if (l || r) el.setAttribute("data-fade", (l ? "l" : "") + (r ? "r" : "")); else el.removeAttribute("data-fade");
  }
  // A new screen opens at its top. Only a place chip on the same fish's page
  // (#/chum/green-river to #/chum/other) keeps where you are.
  var drawnHash = location.hash, prevHash = "";
  function newScreen(was, now) {
    var a = (was || "").replace(/^#\/?/, "").split("/").filter(Boolean), b = (now || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (a.join("/") === b.join("/")) return false;
    return !(a.length === 2 && b.length === 2 && a[0] === b[0] && findSpecies(a[0]));
  }

  // The drawings (rigs/fish.js) are a big file the first screen never needs.
  // They are fetched once the phone is idle after the first screen, or at
  // once on a screen that shows a fish, and that screen is drawn again, in
  // place, when they arrive. Without them every list still stands.
  var fishWait = false, fishQuiet = false;
  function loadFish(now) {
    if (RIG.fish || fishWait) return;
    if (!now) { if (!loadFish.idle) { loadFish.idle = true; (window.requestIdleCallback || function (f) { setTimeout(f, 1200); })(function () { loadFish(true); }); } return; }
    fishWait = true;
    var s = document.createElement("script");
    s.src = "/rigs/fish.js";
    s.onload = function () {
      if (mode() === "field" || !app.querySelector('[data-view="fish"],[data-view="species"],[data-view="spot"],[data-view="learn"],[data-view="card"]')) return;
      fishQuiet = true;
      try { render(); } finally { fishQuiet = false; }
    };
    document.head.appendChild(s);
  }
  function render() {
    drawnDay = todayIso(); drawnAt = Date.now();
    var r0 = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    loadFish(r0 === "fish" || r0 === "learn" || r0 === "spot" || !!findSpecies(r0));
    loadLib(r0 === "learn" || !!findSpecies(r0) || (mode() === "field" && state.cards.some(isLibId)));
    renderView();
    applySky();
    fillRules();
    initTyers(app);
    var top = app.querySelector(".top");
    if (top) document.documentElement.style.setProperty("--toph", (top.offsetHeight + 8) + "px");
    // A screen that opens on a heading, not a card: the heading gets glass
    // under it and the title gives up some sky (see .sect.lead in the styles).
    var hero = app.querySelector("[data-view] > .hero"), el = hero && hero.nextElementSibling;
    while (el && !el.offsetHeight) el = el.nextElementSibling;
    var h = el && el.matches(".grp") ? el.querySelector(":scope > h2.sect:not(.vh)") : null;
    if (h) { h.classList.add("lead"); hero.classList.add("tight"); }
    // The open filter chip is scrolled into view, not left off the edge, and
    // the strip fades at whichever end has more.
    var cur = app.querySelector('.jump [aria-current="true"]'), strip = app.querySelector(".jumpin");
    if (cur) cur.parentNode.scrollLeft = cur.offsetLeft - cur.parentNode.offsetLeft - (cur.parentNode.clientWidth - cur.offsetWidth) / 2;
    if (strip) { stripFade(strip); strip.addEventListener("scroll", function () { stripFade(strip); }, { passive: true }); }
    fitBand();
    fitJerseys();
    markMoved();
    if (welcomeEl) welcomePlace();
  }

  function renderView() {
    if (mode() === "field") { renderField(); return; }
    var parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);

    if (parts[0] === "learn") {
      if (parts[1] && LIB_SEC[parts[1]]) { renderLib(parts[1], parts[2] ? decodeURIComponent(parts[2]) : "", parts[3] ? decodeURIComponent(parts[3]) : ""); return; }
      var fc = parts[1] && fundamentals().filter(function (c) { return c.id === parts[1]; })[0];
      if (fc) {
        var sec = fc.section ? fc.section.toLowerCase() : "";
        renderCard({ tab: "learn", active: sec, card: fc, scene: LEARN_SCENE[sec] || "lake",
          list: fundamentals().filter(function (c) { return c.section === fc.section; }),
          hrefFor: function (c) { return "#/learn/" + c.id; },
          upHref: "#/learn" + (sec ? "/" + sec : ""), upText: fc.section || "Learn" });
      } else renderLearn(parts[1]);
      return;
    }
    // The bare url opens on Hot Trips: the week first, the library a tap away.
    if (!parts.length) { renderTrips(); return; }
    if (parts[0] === "trips" && parts[1] === "map") { renderMap(); return; }
    if (parts[0] === "join") { renderJoin(parts[1] || ""); return; }
    if (parts[0] === "crew" && parts[1] === "new") { renderCrewNew(); return; }
    if (parts[0] === "crew" && parts[1] === "name") { renderCrewName(); return; }
    if (parts[0] === "crew" && parts[1] === "trip" && parts[2]) { renderCrewTrip(decodeURIComponent(parts[2]), parts[3] || ""); return; }
    if (parts[0] === "crew") { renderCrew(); return; }
    if (parts[0] === "trips") { if (parts[1]) renderHot(decodeURIComponent(parts[1]), parts[2]); else renderTrips(); return; }
    if (parts[0] === "fish") { renderFish(); return; }
    if (parts[0] === "water") {
      var t = findType(parts[1]);
      if (t && spotsOfType(t.id).length) renderWater(t); else renderHome();
      return;
    }
    if (parts[0] === "spot") {
      var s = findSpot(parts[1]);
      if (!s) { renderHome(); return; }
      var at = speciesAt(s.id), own = spotCards(s), sc = parts[2] && own.filter(function (c) { return c.id === parts[2]; })[0];
      if (sc) {
        var ty = findType(s.types.indexOf(cameFrom) >= 0 ? cameFrom : s.types[0]);
        renderCard({ tab: "water", active: ty && ty.id, card: sc, list: ordered(own), scene: spotKind(s.id), paint: placePaint(s.id, "", ty ? { type: ty.id } : null),
          rules: sc.dated ? { spot: s.id, species: "", since: sc.dated } : null,
          hrefFor: function (c) { return "#/spot/" + s.id + "/" + c.id; }, upHref: "#/spot/" + s.id, upText: s.name });
        return;
      }
      // One fish at this spot: a menu of one is a wasted tap.
      if (at.length === 1 && !own.length) { location.replace("#/" + at[0].id + "/" + s.id); return; }
      renderSpot(s);
      return;
    }

    // Old links from when salmon was one tab land on coho, its closest heir.
    if (parts[0] === "salmon") { location.replace("#/" + ["coho"].concat(parts.slice(1)).join("/")); return; }
    var sp = parts[0] ? findSpecies(parts[0]) : null;
    if (!sp) { renderHome(); return; }
    var loc = findLocation(sp, parts[1]);
    var list = ordered(cardsFor(sp, loc));
    var card = parts[2] && list.filter(function (c) { return c.id === parts[2]; })[0];
    if (card) {
      var base = speciesBase(sp, loc);
      renderCard({ tab: "fish", active: sp.id, card: card, list: list, scene: loc ? spotKind(loc.id, sp.id) : "sound", paint: loc ? placePaint(loc.id, sp.id) : null,
        rules: card.dated && loc ? { spot: loc.id, species: sp.id, since: card.dated } : null,
        hrefFor: function (c) { return base + "/" + c.id; },
        upHref: base, upText: sp.name + (loc ? " \u00b7 " + loc.name : "") });
      return;
    }
    renderSpecies(sp, loc);
  }

  // A double tap. The first tap redrew the screen, and the second lands on
  // the same spot a moment later.
  //   "slid"    a different control is under the thumb now (a new line pushed
  //             Add down, a Delete turned into its question). On a crew trip
  //             that tap is dropped: it was never meant for what it hit.
  //   "repeat"  the same control again. cwT.repeat says so, and the handlers
  //             where once is enough (add, tick, who has it) let it go by.
  var lastTap = null;
  function tapSig(t) {
    var c = t.closest("button,a,input,textarea,select,label");
    return c ? c.tagName + "|" + Object.keys(c.dataset).sort().map(function (k) { return k + "=" + c.dataset[k]; }).join("|") : "";
  }
  function tapKind(e) {
    // A label passes its tap on to the file box inside it. That is one tap.
    if (e.target.matches && e.target.matches('input[type="file"]')) return "";
    var was = lastTap, now = { at: e.timeStamp, x: e.clientX, y: e.clientY, sig: tapSig(e.target) };
    var again = !!(was && e.detail && now.at - was.at < 400 && Math.abs(now.x - was.x) < 12 && Math.abs(now.y - was.y) < 12);
    // A dropped tap does not move the mark: a third tap is still measured from the first.
    if (again && now.sig !== was.sig) return "slid";
    lastTap = now;
    return again ? "repeat" : "";
  }

  app.addEventListener("click", function (e) {
    var t = e.target;
    var tap = tapKind(e);
    cwT.repeat = tap === "repeat";
    if (tap === "slid" && t.closest('[data-view="crewtrip"]')) { e.preventDefault(); return; }
    var addBtn = t.closest("[data-addtrip]");
    if (addBtn) { RIG.trip.toggle(addBtn.dataset.addtrip); return; }
    if (t.closest("[data-mode-field]")) { setMode("field"); return; }
    if (crewClick(t)) return;
    if (tripsClick(t)) return;
    // A crew trip screen owns every tap inside it. Its section and edit pages
    // carry data-sec, which further down means "open that part of Learn": a
    // tap into a box there used to leave the page.
    if (t.closest('[data-view="crewnew"],[data-view="crewtrip"]')) return;
    var sm = t.closest("[data-skymode]");
    if (sm) {
      var next = { auto: "light", light: "dark", dark: "auto" }[skyMode()];
      setSkyMode(next); applySky(); return;
    }
    if (t.closest("[data-refresh]")) { renderTrips(true); checkRules(); return; }
    var ak = t.closest("[data-ack]");
    if (ak) { RIG.rules.ack(ak.dataset.ack); fillRules(); return; }
    if (t.closest("[data-mode-library]")) { setMode("library"); return; }
    var tab = t.closest("[data-tab]");
    if (tab) { location.hash = { trips: "#/trips", water: "#/water", fish: "#/fish", learn: "#/learn" }[tab.dataset.tab]; return; }
    var ty = t.closest("[data-type]");
    if (ty) { location.hash = "#/water/" + ty.dataset.type; return; }
    var sc = t.closest("[data-sec]");
    if (sc) { location.hash = "#/learn/" + sc.dataset.sec; return; }
    var tm = t.closest("[data-tmode]");
    if (tm) { location.hash = tm.dataset.tmode === "map" ? "#/trips/map" : "#/trips"; return; }
    var md = t.closest("[data-mapday]");
    if (md) { mapDay = md.dataset.mapday; if (lastPlan) drawMap(lastPlan); return; }
    var pick = t.closest("[data-species]");
    if (pick) { RIG.go(pick.dataset.species); return; }
    var loc = t.closest("[data-loc]");
    if (loc) {
      RIG.go((location.hash || "").replace(/^#\/?/, "").split("/")[0], loc.dataset.loc);
      return;
    }
    if (t.closest("[data-back]")) RIG.go(null);
  });

  app.addEventListener("change", function (e) {
    var d = e.target.closest("[data-trip-date]");
    if (d) RIG.trip.setDate(d.value);
    // Log a fish: the photo that was picked shows small, before anything is sent.
    var ph = e.target.closest("[data-cw-catch-photo]");
    if (ph) { catchPhoto(ph.files && ph.files[0]); tripUi.cMsg = null; crewRedraw(); }
    // Alerts: a new quiet hour is saved as it is picked.
    var qh = e.target.closest("[data-al-quiet-from],[data-al-quiet-to]");
    if (qh && crewUi.al.got) {
      var quiet = {};
      quiet[qh.hasAttribute("data-al-quiet-from") ? "quietFrom" : "quietTo"] = Number(qh.value);
      alSave(quiet, "quiet");
    }
    // Planning a trip: the list of plans and the conditions line follow the
    // day, the pick and the window.
    var f = e.target.closest('[data-view="crewnew"] [data-keep]');
    if (f) {
      crewUi.vals[f.getAttribute("data-keep")] = f.value;
      if (f.matches("[data-cw-what]")) cwT.newMsg = null;
      if (f.matches("[data-cw-what],[data-cw-date],[data-cw-from],[data-cw-to]")) newSync();
    }
  });
  // What is typed into a crew box is remembered, so a redraw never eats it.
  app.addEventListener("input", function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute("data-keep");
    if (k) crewUi.vals[k] = e.target.value;
    if (k === "crewPick") namePickSync();
  });
  // Go on the phone keyboard presses the button the box belongs to.
  app.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && tripUi.big) { tripUi.big = ""; crewRedraw(); return; }
    if (e.key !== "Enter" || !e.target || !e.target.getAttribute) return;
    var press = e.target.getAttribute("data-enter"), btn = press && app.querySelector("[" + press + "]");
    if (btn) { e.preventDefault(); btn.click(); }
  });

  // Back from the app switcher, or the phone woke up: redraw if the day
  // turned or the forecast has aged out. Both events fire on iOS.
  document.addEventListener("visibilitychange", refreshIfStale);
  window.addEventListener("pageshow", refreshIfStale);

  window.addEventListener("hashchange", function () {
    // A card in a trip can link into the library, and squid-gear links into
    // the rod course. In field mode the hash changed and nothing rendered, so
    // the link read as broken. Follow it, but do NOT persist the switch:
    // leaving field mode to read something must not cost the pier default,
    // and the trip bar is already the way back.
    var h = (location.hash || "").replace(/^#\/?/, "");
    if (activeMode === "field" && h) activeMode = "library";
    if (newScreen(drawnHash, location.hash)) window.scrollTo(0, 0);
    if (drawnHash !== location.hash) prevHash = drawnHash;
    drawnHash = location.hash;
    // Left the naming step another way (the Hot Trips chip, the dock): the same as Later.
    if (nameUi && !/^#\/?crew\/name/.test(location.hash || "")) nameStepLeft(nameUi.name, /^#\/?trips\/?$/.test(location.hash || ""));
    cwT.nav = true;
    cwT.tell = {};
    try { render(); } finally { cwT.nav = false; }
  });

  load();
  resolveMode();
  render();
  cwT.nav = false;
  applySky();
  // The sky moves while the app is open: dusk arrives without a tap.
  setInterval(applySky, 10 * 60e3);
  // Background rule check on every load. The page never waits for it.
  checkRules();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/rigs/sw.js", { scope: "/rigs/" })
        .catch(function (e) { console.warn("rigs: service worker did not register", e); });
      // coachpilot.org/rigs with no slash is outside that scope, so with no
      // signal it would be the browser's error page. A second, tiny
      // registration catches that one address and hands it to /rigs/. It
      // needs the server to allow the wider scope (Service-Worker-Allowed);
      // where it does not, this fails quietly and nothing else changes.
      navigator.serviceWorker.register("/rigs/sw.js", { scope: "/rigs" }).catch(function () { /* not allowed here */ });
    });
    // A tapped alert asks the open app to go to its trip.
    navigator.serviceWorker.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type !== "rig-open" || typeof d.url !== "string") return;
      try { var u = new URL(d.url, location.href); if (u.origin === location.origin && u.hash) location.hash = u.hash; } catch (x) { /* not a link */ }
    });
  }
})();
</script>
</body>
</html>
