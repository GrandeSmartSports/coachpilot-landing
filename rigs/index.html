      var copied = function (ok) { if (crewUi.share !== s) return; s.copied = ok; s.manual = !ok; crewRedraw(); };
      try { navigator.clipboard.writeText(s.link).then(function () { copied(true); }, function () { copied(false); }); } catch (e) { copied(false); }
      return true;
    }
    if (t.closest("[data-share-done]")) { crewUi.share = null; crewRedraw(); return true; }
    if ((hit = t.closest("[data-newlink]"))) {
      var lid = hit.getAttribute("data-newlink");
      cwOnce("link:" + lid, function () {
        crewUi.rowMsg = {}; crewUi.confirm = null;
        return RIG.crew.link(lid).then(function (r) {
          if (r && r.signedOut) { crewTake(r); return; }
          if (r && r.ok && r.link) crewUi.share = { kind: "link", name: r.name, link: r.link };
          else crewUi.rowMsg[lid] = RIG.crew.say(r, "A new link could not be made. Try again.");
          crewRedraw();
        });
      });
      return true;
    }
    if ((hit = t.closest("[data-remove]"))) { crewUi.confirm = hit.getAttribute("data-remove"); crewUi.rowMsg = {}; crewRedraw(); return true; }
    if (t.closest("[data-remove-no]")) { crewUi.confirm = null; crewRedraw(); return true; }
    if ((hit = t.closest("[data-remove-yes]"))) {
      var uid = hit.getAttribute("data-remove-yes");
      cwOnce("remove:" + uid, function () {
        return RIG.crew.removeMember(uid).then(function (r) {
          if (r && r.signedOut) { crewTake(r); return; }
          crewUi.confirm = null;
          if (r && r.ok === true) {
            if (crewUi.st && crewUi.st.members) { crewUi.st.members = crewUi.st.members.filter(function (m) { return m.id !== uid; }); crewUi.sig = ""; }
            crewRedraw(true);
          } else {
            crewUi.rowMsg[uid] = RIG.crew.say(r, "That did not go through. Nobody was removed.");
            crewRedraw();
          }
        });
      });
      return true;
    }

    if (t.closest("[data-addnum-open]")) { crewUi.num = { step: "phone", msg: null }; crewRedraw(); return true; }
    if (t.closest("[data-addnum-send]")) {
      if (!RIG.crew.normalizePhone(v.numPhone)) { crewUi.num = { step: "phone", msg: { t: "That does not look like a US phone number.", no: true } }; crewRedraw(); return true; }
      cwOnce("num", function () {
        crewUi.num = { step: "phone", msg: { t: "Sending..." } }; crewRedraw();
        return RIG.crew.addMyNumber(v.numPhone).then(function (r) {
          if (r && r.signedOut) { crewTake(r); return; }
          crewUi.num = r && r.ok ? { step: "code", msg: null } : { step: "phone", msg: { t: RIG.crew.say(r, "The code could not be sent. Check the number and try again."), no: true } };
          crewRedraw();
        });
      });
      return true;
    }
    if (t.closest("[data-addnum-verify]")) {
      if (!String(v.numCode || "").trim()) { crewUi.num = { step: "code", msg: { t: "Type the code from the text.", no: true } }; crewRedraw(); return true; }
      cwOnce("num", function () {
        crewUi.num = { step: "code", msg: { t: "Checking..." } }; crewRedraw();
        return RIG.crew.confirmMyNumber(v.numPhone, v.numCode).then(function (r) {
          if (r && r.signedOut) { crewTake(r); return; }
          if (r && r.ok) { crewUi.num = { step: "done" }; v.numPhone = ""; v.numCode = ""; }
          else crewUi.num = { step: "code", msg: { t: RIG.crew.say(r, "That code did not work. Check it, or ask for a new one."), no: true } };
          crewRedraw();
        });
      });
      return true;
    }
    return false;
  }

  function renderTrips(force) {
    app.innerHTML = topHtml("trips") +
      '<div data-view="trips">' + headHtml("Next 7 days", "Hot Trips", "Picked from tides, wind and season.") +
      '<div data-call-slot></div><div data-cw-trips-slot>' + crewTripsHtml(crewSt()) + "</div>" +
      '<div data-rules-status></div>' +
      '<div data-week><p class="quiet">Loading the forecast…</p></div>' + crewRowHtml() + "</div>" + tripBarHtml();
    crewTripsLoad();
    if (!plannerReady()) return;
    var c = RIG.trips.cached();
    if (c && !force) { lastPlan = planFrom(c); drawTrips(lastPlan); }
    RIG.trips.load(force).then(function (data) {
      if (!/^(#\/?)?(trips\/?)?$/.test(location.hash)) return;

    }).catch(function () {
      var host = app.querySelector("[data-week]");

  // ---- Hot Trips map ------------------------------------------------------
  // Same trips as the list, as pins. Leaflet is loaded only when the map is
  // opened, from our own copy. Map tiles are OpenStreetMap and need a signal;
  // the list does not, so the map says so instead of going blank.
  var HOME = [47.177, -122.186]; // Bonney Lake, city centre
  var leafletP = null, mapObj = null, mapDay = "all";
  function loadLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    if (leafletP) return leafletP;
    leafletP = new Promise(function (ok, no) {
      var css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "/rigs/vendor/leaflet.css";
      document.head.appendChild(css);
      var s = document.createElement("script");
      s.src = "/rigs/vendor/leaflet.js";
      s.onload = function () { ok(window.L); };
      s.onerror = function () { leafletP = null; no(new Error("leaflet did not load")); };
      document.head.appendChild(s);
    });
    return leafletP;
  }
  function shortDay(day) { return day.label.replace(/ [A-Z][a-z]{2} (\d+)$/, " $1"); }
  function renderMap() {
    app.innerHTML = topHtml("trips", "map") +
      '<div data-view="map"><nav class="jump days" data-days aria-label="Day"></nav>' +
      '<div class="mapbox" id="tripmap"><p class="quiet">Loading the map…</p></div>' +
      '<p class="legend"><span class="mk hot"><i></i>Hot</span><span class="mk good"><i></i>Good</span>' +
      '<span class="mk dim"><i></i>Nothing good</span><span class="mk home"><i></i>Home</span></p></div>' + tripBarHtml();
    if (!plannerReady()) return;
    RIG.trips.load().then(function (data) {
      if (!/^#\/trips\/map/.test(location.hash)) return;
      lastPlan = planFrom(data);
      drawMap(lastPlan);
    }).catch(function () {
      var box = document.getElementById("tripmap");
      if (box) box.innerHTML = '<p class="quiet no" data-quiet>No forecast yet. The weather servers did not answer. Open this once with a signal.</p>';
    });
  }
  function drawMap(p) {
    var days = app.querySelector("[data-days]"), box = document.getElementById("tripmap");
    if (!days || !box) return;
    if (mapDay !== "all" && !p.days.some(function (d) { return d.iso === mapDay; })) mapDay = "all";
    days.innerHTML = chip("data-mapday", "all", "All week", mapDay) +
      p.days.map(function (d) { return chip("data-mapday", d.iso, shortDay(d) + (d.trips.length ? " · " + d.trips.length : ""), mapDay); }).join("");
    var bySpot = {};
    p.days.forEach(function (d) {
      if (mapDay !== "all" && d.iso !== mapDay) return;
      d.trips.forEach(function (t) { (bySpot[t.spot] = bySpot[t.spot] || []).push({ day: d, t: t }); });
    });
    loadLeaflet().then(function (L) {
      if (!box.isConnected) return;
      if (mapObj) { try { mapObj.remove(); } catch (e) { /* container already gone */ } }
      box.innerHTML = "";
      mapObj = L.map(box, { zoomControl: false, attributionControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 17, className: "tiles-dark",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(mapObj);
      var pts = [HOME];
      RIG.trips.spots.forEach(function (s) { if (bySpot[s.id]) pts.push([s.lat, s.lon]); });
      if (pts.length === 1) RIG.trips.spots.forEach(function (s) { pts.push([s.lat, s.lon]); });
      // The view has to exist before markers are added, or Leaflet holds
      // them back and they have no element to label yet.
      mapObj.fitBounds(pts, { padding: [36, 36], maxZoom: 11 });
      function pin(cls, label, count) {
        // Spots with nothing good are a bare dot: their names are in the
        // popup, and labels on every pin pile up when the map zooms out.
        return L.divIcon({ className: "mk " + cls + (count ? " group" : ""), iconSize: null, iconAnchor: [count ? 13 : 9, count ? 13 : 9],
          html: "<i>" + (count || "") + "</i>" + (cls === "dim" ? "" : "<b>" + esc(label) + "</b>") });
      }
      var RANK = { hot: 2, good: 1, dim: 0 };
      var spots = RIG.trips.spots.map(function (s) {
        var info = findSpot(s.id), name = info ? info.name : (s.name || s.id), list = bySpot[s.id] || [];
        var cls = list.some(function (x) { return x.t.heat === "Hot"; }) ? "hot" : list.length ? "good" : "dim";
        var html = "<b>" + esc(name) + "</b><br><small>" + s.drive + " min drive</small>" +
          (list.length
            ? list.map(function (x) {
                return '<a class="pt" href="#/trips/' + encodeURIComponent(x.day.iso + "~" + x.t.planId) + '" data-pin-trip="' + esc(x.t.planId) + '">' +
                  "<span>" + esc(shortDay(x.day) + " \u00b7 " + x.t.slot) + "</span>" + esc(x.t.name) + " \u00b7 " + esc(x.t.heat) + "</a>";
              }).join("")
            : '<p class="pq">Nothing good ' + (mapDay === "all" ? "this week" : "this day") + '.</p>' +
              (info ? '<a class="pt" href="#/spot/' + esc(s.id) + '">Open the spot cards</a>' : ""));
        return { s: s, name: name, cls: cls, html: html };
      }).sort(function (a, b) { return RANK[b.cls] - RANK[a.cls]; });
      var layer = L.layerGroup().addTo(mapObj);
      L.marker(HOME, { icon: pin("home", ""), keyboard: false, interactive: false, zIndexOffset: -500 }).addTo(mapObj);
      // Pins closer than a fingertip merge into one, with a count; the popup
      // lists every trip in the group. Zoom in and they split again.
      function drawPins() {
        layer.clearLayers();
        var groups = [];
        spots.forEach(function (x) {
          var pt = mapObj.latLngToContainerPoint([x.s.lat, x.s.lon]);
          var g = groups.filter(function (g) { return g.pt.distanceTo(pt) < 30; })[0];
          if (g) g.items.push(x); else groups.push({ pt: pt, items: [x] });
        });
        // A group is drawn at the middle of its spots, so after the first
        // pass two markers can still touch. Merge until none are closer than
        // a fingertip.
        function mid(g) {
          var n = g.items.length;
          return mapObj.latLngToContainerPoint([g.items.reduce(function (a, x) { return a + x.s.lat; }, 0) / n,
            g.items.reduce(function (a, x) { return a + x.s.lon; }, 0) / n]);
        }
        for (var merged = true; merged;) {
          merged = false;
          groups.forEach(function (g) { g.pt = mid(g); });
          for (var i = 0; i < groups.length && !merged; i++) for (var j = i + 1; j < groups.length; j++) {
            if (groups[i].pt.distanceTo(groups[j].pt) < 34) { groups[i].items = groups[i].items.concat(groups[j].items); groups.splice(j, 1); merged = true; break; }
          }
        }
        groups.forEach(function (g) { g.items.sort(function (a, b) { return RANK[b.cls] - RANK[a.cls]; }); });
        groups.forEach(function (g) {
          var top = g.items[0], n = g.items.length;
          var ll = n === 1 ? [top.s.lat, top.s.lon] : [
            g.items.reduce(function (a, x) { return a + x.s.lat; }, 0) / n,
            g.items.reduce(function (a, x) { return a + x.s.lon; }, 0) / n];
          var label = n === 1 ? top.name : n + " spots";
          var m = L.marker(ll, { icon: pin(top.cls, label, n > 1 ? n : 0), title: n === 1 ? top.name : g.items.map(function (x) { return x.name; }).join(", "),
            zIndexOffset: RANK[top.cls] * 1000 }).addTo(layer);
          // One spot: its trips. A group: zoom in until it splits.
          if (n === 1) m.bindPopup(top.html, { maxWidth: 250, autoPanPadding: [16, 16] });
          else m.on("click", function () {
            mapObj.fitBounds(g.items.map(function (x) { return [x.s.lat, x.s.lon]; }), { padding: [70, 70], maxZoom: 13 });
          });
          var el = m.getElement();
          if (el) el.setAttribute("data-pin", g.items.map(function (x) { return x.s.id; }).join(" "));
        });
      }
      mapObj.on("zoomend", drawPins);
      drawPins();
    }).catch(function () {
      box.innerHTML = '<p class="quiet no" data-quiet>The map needs a signal. The trip list works offline.</p>';
    });
  }

  // ---- run cards: a trip, explained ------------------------------------
  // The overview is headlines (the plan, gear, bait...), each one a normal
  // card with Back and Next, built from rigs/runs.js plus this trip's own
  // tides, weather and times.
  function runSince(planId) {
    var run = RIG.trips && RIG.trips.runs && RIG.trips.runs[planId];
    return (run && run.checked) || RULES_BASE;
  }
  function findTrip(key) {
    var c = plannerReady() && RIG.trips.cached();
    var p = lastPlan || (c && planFrom(c));
    var bits = key.split("~"), day = p && p.days.filter(function (d) { return d.iso === bits[0]; })[0];
    var t = day && day.trips.filter(function (x) { return x.planId === bits[1]; })[0];
    return t ? { day: day, t: t } : null;
  }
  function li(a) { return (a || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join(""); }
  function stepsHtml(a) { return a && a.length ? '<ol class="steps">' + li(a) + "</ol>" : ""; }
  function boxHtml(kind, head, inner) { return inner ? '<div class="box' + (kind ? " " + kind : "") + '"><b>' + esc(head) + "</b>" + inner + "</div>" : ""; }
  function whenP(t) { return '<p class="when">' + esc(t) + "</p>"; }
  function clk(h) { return RIG.trips.clock(((h % 24) + 24) % 24); }
  // t is the trip the planner scored. A crew trip the forecast cannot answer
  // for (a no-go, too far out) has none: then the parts that need its times,
  // tides and weather are left out, and everything else still shows.
  // opts.crew: a crew trip. The have, get and check tags describe Coach's
  // garage, so they are not shown; the trip's own list carries the names.
  // opts.spot, opts.species: for the rules, when there is no t to read them from.
  function runSections(t, run, opts) {
    opts = opts || {};
    var plan = boxHtml("", "when you get there", stepsHtml(run.setup)) + boxHtml("tip", "while you fish", stepsHtml(run.during)) +
      boxHtml("", "after", stepsHtml(run.wrap));
    if (t) {
      var drive = t.drive / 60;
      var tl = [{ h: t.from - drive - 0.25, x: "Leave Bonney Lake (" + t.drive + " min drive)" },
        { h: t.from - 0.25, x: "Arrive and set up" },
        { h: t.from, x: (Math.abs(t.from - t.dark) < 0.05 ? "Full dark. " : "") + (t.beach ? "Start digging at " + t.beach : "Start fishing") }];
      t.tides.forEach(function (x) {
        if (x.h > t.from && x.h < t.to) tl.push({ h: x.h, x: (x.type === "H" ? "High tide, " : "Low tide, ") + x.v.toFixed(1) + " ft" });
      });
      if (t.sun.set > t.from && t.sun.set < t.to) tl.push({ h: t.sun.set, x: "Sunset" });
      if (t.dark > t.from && t.dark < t.to) tl.push({ h: t.dark, x: "Full dark" });
      tl.push({ h: t.to, x: "Pack up" }, { h: t.to + drive, x: "Home" });
      tl.sort(function (a, b) { return a.h - b.h; });
      plan = whenP(t.slot + ", " + t.when + ".") +
        '<ol class="steps">' + tl.map(function (e) { return '<li><span class="k">' + esc(clk(e.h)) + "</span> " + esc(e.x) + "</li>"; }).join("") + "</ol>" + plan;
    }

    var gear;
    if (opts.crew) {
      gear = whenP(run.gear.length + (run.gear.length === 1 ? " thing" : " things") + " for this trip.") +
        '<ul class="gear">' + run.gear.map(function (g) {
          return "<li><span>" + esc(g.i) + (g.n ? "<small>" + esc(g.n) + "</small>" : "") + "</span></li>";
        }).join("") + "</ul>";
    } else {
      var need = run.gear.filter(function (g) { return g.s === "need"; }).length;
      var check = run.gear.filter(function (g) { return g.s === "check"; }).length;
      gear = whenP((need ? need + " to get, " : "") + check + " to check, the rest you own.") +
        '<ul class="gear">' + run.gear.map(function (g) {
          return '<li><span class="tag ' + g.s + '">' + (g.s === "have" ? "have" : g.s === "need" ? "get" : "check") + "</span><span>" +
            esc(g.i) + (g.n ? "<small>" + esc(g.n) + "</small>" : "") + "</span></li>";
        }).join("") + "</ul>";
    }

    var out = [];
    if (plan) out.push({ id: "plan", tab: "The plan", title: "The plan", body: plan });
    out.push(
      { id: "what", tab: "What it is", title: "What it is", body: whenP(run.what) + (t ? boxHtml("tip", "why this day", stepsHtml(t.why)) : "") },
      { id: "gear", tab: "Gear", title: "Gear", body: gear });
    if (run.bait) out.push({ id: "bait", tab: "Bait + lures", title: "Bait and lures",
      body: whenP("Tie on first: " + run.bait.first) + boxHtml("", "if that is not working", stepsHtml(run.bait.backup)) +
        (run.bait.note ? boxHtml("tip", "tip", esc(run.bait.note)) : "") });
    out.push({ id: "how", tab: "How", title: run.bait ? "How to fish it" : "How to dig it", body: stepsHtml(run.how) });
    if (t) {
      var rows = t.hours.map(function (h) {
        return "<tr><td>" + esc(clk(h.h)) + "</td><td>" + h.wind + " mph, gusts " + h.gust + "</td><td>" + h.temp + "°F</td><td>" +
          (h.rain >= 0.02 ? "rain" : "dry") + (h.wave != null ? ", " + Math.round(h.wave) + " ft surf" : "") + "</td></tr>";
      }).join("");
      var tides = t.tides.map(function (x) {
        var inside = x.h >= t.from && x.h <= t.to;
        return (inside ? "<strong>" : "") + esc(clk(x.h)) + " " + (x.type === "H" ? "high" : "low") + " " + x.v.toFixed(1) + " ft" + (inside ? "</strong>" : "");
      }).join("<br>");
      var wx = whenP("Wind to " + t.wx.wind + " mph, gusts " + t.wx.gust + ", low of " + t.wx.temp + "°F.") +
        '<table class="hrs">' + rows + "</table>" +
        boxHtml("", "tides today", tides || "No tide station for this water.") +
        boxHtml("", "light", esc("Sunrise " + clk(t.sun.rise) + ". Sunset " + clk(t.sun.set) + ". Moon " + t.moon + "% lit."));
      out.push({ id: "wx", tab: "Tide + weather", title: "Tide and weather", body: wx });
      if (t.flow) out.push({ id: "river", tab: "River", title: "River flow", body: riverHtml(t.flow) });
    }
    out.push(
      { id: "spot", tab: "The spot", title: "The spot", body: stepsHtml(run.spot.lines) +
        (run.spot.unknown.length ? boxHtml("law", "not confirmed yet", stepsHtml(run.spot.unknown)) : "") },
      { id: "expect", tab: "What to expect", title: "What to expect", body: stepsHtml(run.expect) },
      { id: "rules", tab: "Rules", title: "Rules", body:
        '<div data-rules-slot' + slotAttrs(t ? t.spot : opts.spot || "", t ? t.species : opts.species || "", run.checked) + '></div><div data-rules-status></div>' + stepsHtml(run.rules) +
        boxHtml("law", "check before you go", 'Limits change. <a href="https://wdfw.wa.gov/fishing/regulations/emergency-rules" target="_blank" rel="noopener">WDFW emergency rules</a>.') }
    );
    out.forEach(function (c) { c.group = "before"; });
    return out;
  }
  // The river go or no-go. Numbers are the day's forecast peak at the gauge.
  function cfsTxt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function riverLine(f) {
    if (f.call === "unknown") return "No river reading for this day yet";
    return (f.call === "go" ? "Go" : "High water") + ": " + cfsTxt(f.cfs) + " cfs, " + f.trend;
  }
  function riverHtml(f) {
    var now = f.now ? "Right now: " + cfsTxt(f.now.cfs) + " cfs (" + new Date(f.now.at).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }) + ")." : "No reading right now.";
    var head = f.call === "unknown" ? "No river forecast for this day yet." :
      f.call === "go" ? "Go. The river should be fishable." : "High and tough. Fishable, but slow and murky.";
    var lines = [];
    if (f.cfs != null) lines.push("Forecast peak that day: " + cfsTxt(f.cfs) + " cfs" + (f.prev != null ? ", day before " + cfsTxt(f.prev) + " cfs." : "."));
    if (f.trend === "rising") lines.push("Rising fast. Rising water muddies up and the fish scatter.");
    if (f.trend === "dropping") lines.push("Dropping after a rise. Fresh fish move up and the water clears. Often the best day.");
    lines.push(now);
    if (f.ends) lines.push("The NOAA river forecast runs to " + f.ends + ".");
    return whenP(head) + stepsHtml(lines) +

  // Short name for a card in next and back.
  function label(c) { return c.tab || String(c.title).split(":")[0]; }

  // ---- crew trips ----------------------------------------------------------
  // The group on the Trips tab, the two buttons on a Hot Trip, planning one

  // Everything is drawn from what the phone has saved first, then refreshed

  //
  // For the next stage (notes, the list, catches): the trip page and each

  // cwCatchesHtml below. They return "" today. Fill them there, not from
  // outside: the page is redrawn whole whenever a write lands.
  var DAY3 = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var DAYFULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MON3 = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var cwT = { past: false, hotKey: "", hotMsg: null, nav: true, watersAt: 0, newStatus: "idea", newMsg: null };
  function tripFresh(id) { return { id: id, gone: false, note: "", msg: null, goMsg: null, confirm: false, sending: 0, edit: false, editMsg: null, res: null }; }
  var tripUi = tripFresh(null);

  // The saved crew state (with waiting writes laid over it), or null.
  function crewSt() { return RIG.crew && RIG.crew.session() ? RIG.crew.cached() : null; }
  // The same, but only for someone who is on a crew.
  function crewIn() { var st = crewSt(); return st && st.crew ? st : null; }

  function isoDay(iso) { var a = String(iso || "").split("-").map(Number); return new Date(a[0], (a[1] || 1) - 1, a[2] || 1, 12); }
  function isoOf(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function isoPlus(iso, n) { var d = isoDay(iso); d.setDate(d.getDate() + n); return isoOf(d); }
  function dayDate(iso) { var d = isoDay(iso); return isNaN(d) ? "" : DAY3[d.getDay()] + " " + MON3[d.getMonth()] + " " + d.getDate(); }
  function hoursWords(from, to) {
    if (from != null && to != null) return clk(from) + " to " + clk(to);

  }
  // "17:30" from a time box is 17.5, and back.
  function boxHour(v) { var m = /^(\d{1,2}):(\d\d)/.exec(String(v || "")); return m ? Math.round((+m[1] + m[2] / 60) * 10000) / 10000 : null; }
  function hourBox(h) {

    var mins = Math.round(h * 60), hh = Math.floor(mins / 60) % 24, mm = mins % 60;
    return ("0" + hh).slice(-2) + ":" + ("0" + mm).slice(-2);

  }
  function namesFor(trip, answer) {
    return (trip.going || []).filter(function (g) { return g.answer === answer; }).map(function (g) { return firstName(g.name); });

  function planOf(id) { return ((RIG.trips && RIG.trips.plans) || []).filter(function (x) { return x.id === id; })[0] || null; }

  // ---- the group on the Trips tab
  function crewTripRow(t) {

  // ---- the forecast a crew page reads

      wx: c ? c.wx : {}, tides: c ? c.tides : {}, flow: c ? c.flow : {} });
  }
  // then() runs only when a newer forecast than the one on screen lands. One
  // ask at a time: a second caller just changes who hears about it.

    if (cwT.wxBusy) return;

      cwT.wxBusy = false;
      if (data && data.at !== had && cwT.wxThen) cwT.wxThen();
    }, function () { cwT.wxBusy = false; /* no forecast: the line says so */ });
  }
  // The live go or no-go, in one plain line.

    var today = todayIso(), s = det.status, kind = "", text;
    if (trip.date < today) { s = "past"; text = "That day has passed."; }
    else if (s === "ok") {
      var heat = det.trip.heat, why = RIG.trips.whyLine(det.trip, 3);
      text = (heat === "Hot" ? "Hot" : heat === "Slow" ? "Go, but slow" : "Go") + (why ? ": " + lowerFirst(why) : ".");
      kind = heat === "Slow" ? "slow" : "go";

  // ---- planning a trip from scratch: #/crew/new

  // The parts of the form that follow the day and the pick, changed in place.

      if (lost) { v.newPlan = ""; cwT.newMsg = { t: lost.name + " is not in season on that day. Pick another.", no: true }; }

  // Nothing saved yet (a cold open straight onto a crew page): ask once.
  function crewStLoad() {

      });
      function go(i) {
        cur = i;
        steps.forEach(function (g, k) { g.classList.toggle("on", k === i); });
        btns.forEach(function (b, k) {
          b.setAttribute("aria-current", k === i ? "true" : "false");
          b.classList.toggle("done", k < i);
        });
        cap.innerHTML = "<b>" + (i + 1) + ".</b> " + (steps[i].dataset.cap || "");
      }
      function stop() { if (timer) { clearTimeout(timer); timer = null; } play.textContent = "Play"; }
      function run() {
        if (cur >= steps.length - 1) go(0);
        play.textContent = "Stop";
        timer = setTimeout(function tick() {
          if (!fig.isConnected) { timer = null; return; }
          if (cur < steps.length - 1) { go(cur + 1); timer = setTimeout(tick, reduce ? 900 : 1900); }
          else stop();
        }, reduce ? 900 : 1500);
      }
      play.addEventListener("click", function () { if (timer) stop(); else run(); });
      go(0);
    });
  }

  // ---- the sky: the screen is the light Coach is standing in -------------
  // Sunrise, sunset, cloud cover and rain come from the forecast the week is
  // already built from, so this costs no extra call. "auto" follows the sky;
  // "light" and "dark" hold it when the glare on the water says otherwise.
  var SKY_KEY = "rig.skymode.v1";
  function skyMode() {
    try { var v = localStorage.getItem(SKY_KEY); return v === "light" || v === "dark" ? v : "auto"; } catch (e) { return "auto"; }
  }
  function setSkyMode(v) { try { localStorage.setItem(SKY_KEY, v); } catch (e) { /* private mode: this visit only */ } }
  // Today's sun and cloud at the water, from the cached forecast.
  function skyNow() {
    var n = new Date(), h = n.getHours() + n.getMinutes() / 60;
    var iso = n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
    var c = RIG.trips && RIG.trips.cached && RIG.trips.cached();
    var w = c && c.wx && (c.wx.redondo || c.wx[Object.keys(c.wx)[0]]);
    var sun = (w && w.sun && w.sun[iso]) || null;
    var hr = null;
    if (w && w.hours) {
      var want = iso + "T" + ("0" + Math.floor(h)).slice(-2);
      for (var i = 0; i < w.hours.length; i++) if (w.hours[i].t.slice(0, 13) === want) { hr = w.hours[i]; break; }
    }
    return { h: h, sun: sun, wx: { clouds: hr && hr.clouds != null ? hr.clouds : 80, rain: (hr && hr.rain) || 0 } };
  }
  function applySky() {
    if (!RIG.sky) return;
    var mode = skyMode(), s = skyNow();
    var r = RIG.sky.resolve(s.h, s.sun, s.wx, mode);
    RIG.sky.apply(document.documentElement, r);
    var theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute("content", r.p.ground);
    app.querySelectorAll("[data-skymode]").forEach(function (b) {
      b.setAttribute("data-held", mode === "auto" ? "no" : "yes");
      b.setAttribute("aria-label", mode === "auto" ? "Screen follows the sky. Tap to hold it light."
        : mode === "light" ? "Screen held light. Tap to hold it dark." : "Screen held dark. Tap to follow the sky.");
      var l = b.querySelector("[data-skylabel]");
      if (l) l.textContent = mode === "auto" ? "Sky" : mode === "light" ? "Light" : "Dark";
    });
  }

  // When the screen was last drawn, and for which day. The installed app is
  // suspended, not reloaded, when Coach switches away from it, so coming
  // back the next morning would otherwise leave yesterday's trips on screen.
  var drawnDay = "", drawnAt = 0;
  function todayIso() {
    var n = new Date();
    return n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
  }
  function refreshIfStale() {
    if (document.visibilityState === "hidden") return;
    // Same day and still fresh: nothing to redraw, but the sun may have set
    // while the phone was in a pocket, so the sky is checked every time.
    if (drawnDay === todayIso() && Date.now() - drawnAt < 3 * 3600e3) { applySky(); return; }
    render();
    checkRules();
  }

  function render() {
    drawnDay = todayIso(); drawnAt = Date.now();
    renderView();
    applySky();
    fillRules();
    initTyers(app);
    var top = app.querySelector(".top");
    if (top) document.documentElement.style.setProperty("--toph", (top.offsetHeight + 8) + "px");
  }

  function renderView() {
    if (mode() === "field") { renderField(); return; }
    var parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);

    if (parts[0] === "learn") {
      var fc = parts[1] && fundamentals().filter(function (c) { return c.id === parts[1]; })[0];
      if (fc) {
        var sec = fc.section ? fc.section.toLowerCase() : "";
        renderCard({ tab: "learn", active: sec, card: fc,
          list: fundamentals().filter(function (c) { return c.section === fc.section; }),
          hrefFor: function (c) { return "#/learn/" + c.id; },
          upHref: "#/learn" + (sec ? "/" + sec : ""), upText: fc.section || "Learn" });
      } else renderLearn(parts[1]);
      return;
    }
    // The bare url opens on Hot Trips: the week first, the library a tap away.
    if (!parts.length) { renderTrips(); return; }
    if (parts[0] === "trips" && parts[1] === "map") { renderMap(); return; }
    if (parts[0] === "join") { renderJoin(parts[1] || ""); return; }
    if (parts[0] === "crew" && parts[1] === "new") { renderCrewNew(); return; }
    if (parts[0] === "crew" && parts[1] === "trip" && parts[2]) { renderCrewTrip(decodeURIComponent(parts[2]), parts[3] || ""); return; }
    if (parts[0] === "crew") { renderCrew(); return; }
    if (parts[0] === "trips") { if (parts[1]) renderHot(decodeURIComponent(parts[1]), parts[2]); else renderTrips(); return; }
    if (parts[0] === "fish") { renderFish(); return; }
    if (parts[0] === "water") {
      var t = findType(parts[1]);
      if (t && spotsOfType(t.id).length) renderWater(t); else renderHome();
      return;
    }
    if (parts[0] === "spot") {
      var s = findSpot(parts[1]);
      if (!s) { renderHome(); return; }
      var at = speciesAt(s.id);
      // One fish at this spot: a menu of one is a wasted tap.
      if (at.length === 1) { location.replace("#/" + at[0].id + "/" + s.id); return; }
      renderSpot(s);
      return;
    }

    // Old links from when salmon was one tab land on coho, its closest heir.
    if (parts[0] === "salmon") { location.replace("#/" + ["coho"].concat(parts.slice(1)).join("/")); return; }
    var sp = parts[0] ? findSpecies(parts[0]) : null;
    if (!sp) { renderHome(); return; }
    var loc = findLocation(sp, parts[1]);
    var list = ordered(cardsFor(sp, loc));
    var card = parts[2] && list.filter(function (c) { return c.id === parts[2]; })[0];
    if (card) {
      var base = speciesBase(sp, loc);
      renderCard({ tab: "fish", active: sp.id, card: card, list: list,
        rules: card.dated && loc ? { spot: loc.id, species: sp.id, since: card.dated } : null,
        hrefFor: function (c) { return base + "/" + c.id; },
        upHref: base, upText: sp.name + (loc ? " \u00b7 " + loc.name : "") });
      return;
    }
    renderSpecies(sp, loc);
  }

  app.addEventListener("click", function (e) {
    var t = e.target;
    var addBtn = t.closest("[data-addtrip]");
    if (addBtn) { RIG.trip.toggle(addBtn.dataset.addtrip); return; }
    if (t.closest("[data-mode-field]")) { setMode("field"); return; }
    if (crewClick(t)) return;
    if (tripsClick(t)) return;
    var sm = t.closest("[data-skymode]");
    if (sm) {
      var next = { auto: "light", light: "dark", dark: "auto" }[skyMode()];
      setSkyMode(next); applySky(); return;
    }
    if (t.closest("[data-refresh]")) { renderTrips(true); checkRules(); return; }
    var ak = t.closest("[data-ack]");
    if (ak) { RIG.rules.ack(ak.dataset.ack); fillRules(); return; }
    if (t.closest("[data-mode-library]")) { setMode("library"); return; }
    var tab = t.closest("[data-tab]");
    if (tab) { location.hash = { trips: "#/trips", water: "#/water", fish: "#/fish", learn: "#/learn" }[tab.dataset.tab]; return; }
    var ty = t.closest("[data-type]");
    if (ty) { location.hash = "#/water/" + ty.dataset.type; return; }
    var sc = t.closest("[data-sec]");
    if (sc) { location.hash = "#/learn/" + sc.dataset.sec; return; }
    var tm = t.closest("[data-tmode]");
    if (tm) { location.hash = tm.dataset.tmode === "map" ? "#/trips/map" : "#/trips"; return; }
    var md = t.closest("[data-mapday]");
    if (md) { mapDay = md.dataset.mapday; if (lastPlan) drawMap(lastPlan); return; }
    var pick = t.closest("[data-species]");
    if (pick) { RIG.go(pick.dataset.species); return; }
    var loc = t.closest("[data-loc]");
    if (loc) {
      RIG.go((location.hash || "").replace(/^#\/?/, "").split("/")[0], loc.dataset.loc);
      return;
    }
    if (t.closest("[data-back]")) RIG.go(null);
  });

  app.addEventListener("change", function (e) {
    var d = e.target.closest("[data-trip-date]");
    if (d) RIG.trip.setDate(d.value);
    // Planning a trip: the list of plans and the conditions line follow the
    // day, the pick and the window.
    var f = e.target.closest('[data-view="crewnew"] [data-keep]');
    if (f) {
      crewUi.vals[f.getAttribute("data-keep")] = f.value;
      if (f.matches("[data-cw-what]")) cwT.newMsg = null;
      if (f.matches("[data-cw-what],[data-cw-date],[data-cw-from],[data-cw-to]")) newSync();
    }
  });
  // What is typed into a crew box is remembered, so a redraw never eats it.
  app.addEventListener("input", function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute("data-keep");
    if (k) crewUi.vals[k] = e.target.value;
  });
  // Go on the phone keyboard presses the button the box belongs to.
  app.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !e.target || !e.target.getAttribute) return;
    var press = e.target.getAttribute("data-enter"), btn = press && app.querySelector("[" + press + "]");
    if (btn) { e.preventDefault(); btn.click(); }
  });

  // Back from the app switcher, or the phone woke up: redraw if the day
  // turned or the forecast has aged out. Both events fire on iOS.
  document.addEventListener("visibilitychange", refreshIfStale);
  window.addEventListener("pageshow", refreshIfStale);

  window.addEventListener("hashchange", function () {
    // A card in a trip can link into the library, and squid-gear links into
    // the rod course. In field mode the hash changed and nothing rendered, so
    // the link read as broken. Follow it, but do NOT persist the switch:
    // leaving field mode to read something must not cost the pier default,
    // and the trip bar is already the way back.
    var h = (location.hash || "").replace(/^#\/?/, "");
    if (activeMode === "field" && h) activeMode = "library";
    cwT.nav = true;
    try { render(); } finally { cwT.nav = false; }
  });

  load();
  resolveMode();
  render();
  cwT.nav = false;
  applySky();
  // The sky moves while the app is open: dusk arrives without a tap.
  setInterval(applySky, 10 * 60e3);
  // Background rule check on every load. The page never waits for it.
  checkRules();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/rigs/sw.js", { scope: "/rigs/" })
        .catch(function (e) { console.warn("rigs: service worker did not register", e); });
      // coachpilot.org/rigs with no slash is outside that scope, so with no
      // signal it would be the browser's error page. A second, tiny
      // registration catches that one address and hands it to /rigs/. It
      // needs the server to allow the wider scope (Service-Worker-Allowed);
      // where it does not, this fails quietly and nothing else changes.
      navigator.serviceWorker.register("/rigs/sw.js", { scope: "/rigs" }).catch(function () { /* not allowed here */ });
    });
    // A tapped alert asks the open app to go to its trip.
    navigator.serviceWorker.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type !== "rig-open" || typeof d.url !== "string") return;
      try { var u = new URL(d.url, location.href); if (u.origin === location.origin && u.hash) location.hash = u.hash; } catch (x) { /* not a link */ }
    });
  }
})();
</script>
</body>
</html>
