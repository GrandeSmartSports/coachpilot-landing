<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d10">
<title>Rig Card</title>
<link rel="manifest" href="/rigs/manifest.webmanifest">
<link rel="apple-touch-icon" href="/rigs/icon-v4-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rig Card">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Self-hosted so the page opens at a pier with no cell signal.
   Inter ships as a variable font: one file covers 400 through 700. */
@font-face{font-family:Inter;font-style:normal;font-weight:400 700;font-display:swap;
  src:url(/rigs/fonts/inter.woff2) format('woff2')}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;
  src:url(/rigs/fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;
  src:url(/rigs/fonts/barlow-condensed-700.woff2) format('woff2')}
:root{
  /* First paint, and the floor if sky.js never loads. rigs/sky.js replaces
     the sky-dependent ones (bg, paper, line, ink, ink2, dim, accent, gold)
     as soon as it runs. */
  --paper:#141a20; --gold:#D9A94A; --on-gold:#14171F; --shore:#030708;
  --bg:#0a0d10; --bg2:#0e1318;
  --panel:#141a20; --panel2:#1a222a; --panel3:#212b34;
  --line:#26313a; --line2:#334049;
  --ink:#f4f7f9; --ink2:#c3cfd8; --dim:#8899a5;
  --accent:#D9A94A; --accent2:#ecc777;
  --go:#8fe85f; --warn:#ffc53d; --no:#ff5a4e;
  --water:#123243; --rope:#f0f4f7;
  --steel:#8c99a3; --steel2:#6b7883; --hi:#fff;
  --roe:#f0a071; --roe2:#d9542f; --roe3:#8e2f22; --lure:#f2563a; --lure2:#e8442c;
  --yarn:#ff3d8a; --chart:#8ef06a; --brass:#d9a441; --brass2:#b8862c;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 520px at 50% -10%, var(--bg2), transparent 70%);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55;
  padding-top:env(safe-area-inset-top);
}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 80px}

/* tabs */
.tabs{
  position:sticky;top:0;z-index:30;margin:0 -16px 22px;padding:11px 16px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;font-size:14px;
  background:var(--panel);color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;
  transition:all .16s cubic-bezier(.4,0,.2,1);
}
.tab:hover{color:var(--ink2);border-color:var(--line2)}
.tab[aria-selected="true"]{
  background:var(--gold);
  color:var(--on-gold);border-color:transparent;
  box-shadow:0 2px 10px -2px color-mix(in srgb,var(--gold) 55%,transparent);
}

.sheet[hidden]{display:none}
.shead{margin-bottom:18px}
.eyebrow{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;font-size:11.5px;color:var(--accent);margin:0 0 6px
}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;
  line-height:.96;margin:0 0 10px;letter-spacing:-.015em}
.when{font-size:15px;color:var(--ink2);margin:0;max-width:52ch}

/* specs */
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.sp{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--sh)}
.sp .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.sp .v{font-family:var(--mono);font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.3;color:var(--ink)}
.sp .have{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font-size:10.5px;font-family:var(--mono);color:var(--dim);line-height:1.3}

/* diagram */
/* The rig and knot drawings are built for a dark ground, so they keep one in
   every sky, like a photograph printed on the page. */
.dia{--bg:#0a0d10;--panel:#141a20;--panel2:#1a222a;--panel3:#212b34;--line:#26313a;--line2:#334049;
  --ink:#f4f7f9;--ink2:#c3cfd8;--dim:#8899a5;--accent:#ff6a2b;--accent2:#ffa066;
  --go:#8fe85f;--warn:#ffc53d;--no:#ff5a4e;--hi:#fff;color:var(--ink);
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:8px;margin:0 0 18px;
  box-shadow:var(--sh);overflow:hidden}
.dia svg{display:block;width:100%;height:auto;border-radius:10px}

h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:20px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 15px 40px;font-size:15px;color:var(--ink2)}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(180deg,var(--panel3),var(--panel2));
  border:1px solid var(--line2);color:var(--accent);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;
  display:grid;place-items:center
}
ol.steps b{font-weight:650;color:var(--ink)}
ol.steps .k{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600;
  background:color-mix(in srgb,var(--accent) 12%,transparent);padding:2px 7px;border-radius:5px;white-space:normal;overflow-wrap:anywhere}

.box{border-radius:14px;padding:13px 15px;font-size:14.5px;margin:16px 0 0;
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);box-shadow:var(--sh)}
.box strong{font-weight:680;color:var(--ink)}
.box b{display:block;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:14px;margin-bottom:5px;color:var(--ink)}
.box.law{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 9%,var(--panel)),var(--panel))}
.box.law b{color:var(--warn)}
.box.tip{border-color:color-mix(in srgb,var(--go) 35%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--go) 8%,var(--panel)),var(--panel))}
.box.tip b{color:var(--go)}
.box.red{border-color:color-mix(in srgb,var(--no) 50%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--no) 10%,var(--panel)),var(--panel))}
.box.red b{color:var(--no)}

.chk{display:grid;gap:7px;margin:12px 0 0}
.chk label{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:11px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;transition:border-color .15s,opacity .15s}
.chk label:has(input:checked){opacity:.42}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 20px;width:20px;height:20px;margin:1px 0 0;border-radius:6px;border:2px solid var(--line2);background:transparent;position:relative;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #120704;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk .t{min-width:0}
.chk .t b{display:block;font-weight:650;font-size:14.5px;line-height:1.3;color:var(--ink)}
.chk .t i{display:block;font-style:normal;font-size:12.5px;line-height:1.4;color:var(--dim);margin-top:2px}

/* ---- knot tyer ---- */
.tyer{margin:0 0 6px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.tyer .stage{background:var(--panel2);position:relative}
.tyer svg{display:block;width:100%;height:auto}
.tyer .bar{display:flex;align-items:center;gap:8px;padding:11px 13px;border-top:1px solid var(--line)}
.rail{display:flex;gap:5px;flex:1}
.rail button{
  flex:1;height:30px;border-radius:8px;cursor:pointer;
  background:var(--panel3);border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:12.5px;font-weight:600;transition:all .15s;
}
.rail button:hover{border-color:var(--line2);color:var(--ink2)}
.rail button[aria-current="true"]{
  background:var(--gold);color:var(--on-gold);border-color:transparent}
.rail button.done{color:var(--go);border-color:color-mix(in srgb,var(--go) 35%,var(--line))}
.play{
  flex:0 0 auto;height:30px;padding:0 14px;border-radius:8px;cursor:pointer;
  background:var(--panel3);border:1px solid var(--line2);color:var(--ink);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:13px;transition:all .15s;
}
.play:hover{background:var(--line);border-color:var(--accent)}
.tyer .cap{padding:0 15px 15px;font-size:14.5px;color:var(--ink2);min-height:52px}
.tyer .cap b{color:var(--ink);font-weight:650}
.kstep{opacity:0;transition:opacity .18s}
.kstep.on{opacity:1}
.kstep .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.kstep.on .draw{stroke-dashoffset:0;transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
.klink{display:inline-flex;align-items:center;gap:7px;margin:12px 0 0;font-size:14px;
  color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--panel)}
.klink:hover{border-color:var(--accent)}
.klink span{color:var(--dim);font-weight:400;font-size:13px}
.card h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:17px;color:var(--ink);margin:22px 0 8px}

/* bite */
.bite{display:flex;gap:14px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:16px;box-shadow:var(--sh)}
.bite svg{flex:0 0 92px;width:92px;height:70px;border-radius:8px}
.bite .t{font-size:14.5px;color:var(--ink2)}
.bite .t b{display:block;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:14px;color:var(--accent);margin-bottom:3px}
@keyframes dip{
  0%,42%{transform:translateY(0) rotate(0)} 52%{transform:translateY(3px) rotate(-7deg)}
  60%{transform:translateY(1px) rotate(3deg)} 72%,100%{transform:translateY(0) rotate(0)}
  80%,92%{transform:translateY(26px) rotate(-16deg)}
}
.floatbob{animation:dip 4s ease-in-out infinite;transform-origin:50% 85%}

/* buy links */
.buy{display:grid;gap:9px;margin:14px 0 0}
.buy a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);text-decoration:none}
.buy a:hover{border-color:var(--accent)}
.buy .n{flex:1;min-width:0}
.buy .n b{display:block;color:var(--ink);font-weight:650;font-size:14.5px;line-height:1.3}
.buy .n span{display:block;color:var(--dim);font-size:12.5px;margin-top:3px;line-height:1.35}
.buy .p{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.buy .go{color:var(--line2);font-size:17px;line-height:1;flex:0 0 auto}

/* ---- pinned header: species tabs + jump bar ---- */
.skymode{margin-left:auto;flex:0 0 auto;min-width:44px;min-height:34px;padding:0 10px;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px}
.skymode[data-held="yes"]{color:var(--on-gold);background:var(--gold);border-color:transparent}
.top{position:sticky;top:0;z-index:30;margin:calc(-18px - env(safe-area-inset-top)) -16px 18px;
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line)}
.top .tabs{position:static;margin:0;border:0;background:none;backdrop-filter:none;padding:11px 16px 9px}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px}
.jump::-webkit-scrollbar{display:none}
.jump .jp{flex:0 0 auto;font:600 13px/1 Inter,system-ui,sans-serif;white-space:nowrap;cursor:pointer;
  color:var(--ink2);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 11px}
.jump .jp:hover,.jump .jp[aria-current="true"]{color:var(--ink);border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
.jump .jsep{flex:0 0 auto;align-self:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent);padding:0 2px 0 6px}
.card{scroll-margin-top:var(--toph,130px)}
.card p a,.card .box a,.card li a{color:var(--accent);font-weight:600;text-underline-offset:2px}
.top .tab{padding:8px 12px;font-size:13.5px;letter-spacing:.05em}
.top .tabs{gap:5px}
/* ---- video tiles ---- */
.vids{display:grid;gap:10px;margin:12px 0 0}
.vid{display:flex;align-items:center;gap:13px;padding:12px;border-radius:14px;text-decoration:none;
  background:linear-gradient(180deg,var(--panel3),var(--panel2));border:1px solid var(--line2)}
.vid:hover,.vid:active{border-color:var(--accent)}
.vid .play{flex:0 0 52px;height:52px;border-radius:12px;position:relative;
  background:var(--gold);
  box-shadow:0 2px 12px -2px color-mix(in srgb,var(--gold) 55%,transparent)}
.vid .play::after{content:"";position:absolute;left:21px;top:16px;border-style:solid;
  border-width:10px 0 10px 16px;border-color:transparent transparent transparent var(--on-gold)}
.vid .vt{flex:1;min-width:0}
.vid .vt b{display:block;color:var(--ink);font-weight:650;font-size:15px;line-height:1.3}
.vid .by{display:block;color:var(--accent);font-size:12.5px;font-weight:600;margin-top:3px}
.vid .why{display:block;color:var(--dim);font-size:13px;line-height:1.4;margin-top:4px}
.vid .len{flex:0 0 auto;align-self:flex-start;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.4}
.card .box + ol.steps,.card .box + .box{margin-top:14px}
.card ol.steps + .box{margin-top:6px}


/* ---- headlines first: tiles, rows, one card at a time ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 0}
.tile{display:flex;flex-direction:column;gap:2px;min-height:128px;padding:16px 15px 14px;text-decoration:none;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sh);color:var(--ink);transition:border-color .15s,transform .15s}
.tile:hover,.tile:active{border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{width:40px;height:40px;color:var(--accent);margin-bottom:auto}
.tile .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:24px;line-height:1;margin-top:12px}
.tile .meta{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent2)}
.ic{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.eyebrow .ic{width:34px;height:34px;display:block;margin-bottom:6px}
.rows{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 14px;text-decoration:none;color:var(--ink);
  border-top:1px solid var(--line);transition:background .15s}
.row:first-child{border-top:0}
.row:hover,.row:active{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:650;font-size:15.5px;line-height:1.3}
.row .rt span{display:block;font-size:13px;color:var(--dim);line-height:1.35;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{flex:0 0 auto;max-width:42%;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent2)}
.row .chev{flex:0 0 auto;font-size:24px;line-height:1;color:var(--steel2)}
.grp > h2 .n{font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--dim);font-weight:600}
a.back{text-decoration:none}
/* ---- hot trips ---- */
.heat{display:inline-block;padding:3px 9px;border-radius:999px;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.heat.hot{background:var(--gold);color:var(--on-gold);border-color:transparent}
.gear{list-style:none;margin:14px 0 0;padding:0}
.gear li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink)}
.gear li:first-child{border-top:0}
.gear li span:last-child{flex:1;min-width:0}
.gear li small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.tag{flex:0 0 auto;min-width:52px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
.tag.have{color:var(--go);border-color:color-mix(in srgb,var(--go) 45%,var(--line))}
.tag.need{color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.hrs{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:13.5px;color:var(--ink2)}
.hrs td{padding:7px 4px;border-top:1px solid var(--line)}
.hrs td:first-child{font-family:var(--mono);color:var(--accent2);white-space:nowrap}
.grp > h2 .heat{margin-left:8px;vertical-align:middle}
.mapbox{height:calc(100dvh - var(--toph,130px) - 150px);min-height:380px;margin:12px 0 0;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:#0d1218;box-shadow:var(--sh)}
.mapbox .quiet{margin:16px}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.92) saturate(.6)}
.days{margin:14px 0 0}
.mk{display:flex !important;align-items:center;gap:6px;white-space:nowrap;background:none;border:0}
.mk i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);background:#0b0f14}
.mk b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.03em;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.mk b{pointer-events:none}
.mk.group i{width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff}
.mk.group.hot i{color:#1a0d05}
.leaflet-popup-content .pg + .pg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mk.hot i{background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}
.mk.dim i{border-color:var(--steel2);opacity:.55}
.mk.dim b{opacity:.55;font-weight:600}
.mk.home i{border-radius:5px;border-color:#fff;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 2px 0;font-size:12.5px;color:var(--dim)}
.legend .mk{font-size:12.5px}
.legend .mk i{width:13px;height:13px;border-width:2px}
.mapbox .leaflet-popup-content-wrapper,.mapbox .leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.mapbox .leaflet-popup-content{margin:14px 16px;font:14px/1.4 Inter,sans-serif}
.mapbox .leaflet-popup-content small{color:var(--dim)}
.mapbox .leaflet-popup-content a.pt{color:var(--ink)}
.mapbox .leaflet-popup-content .pt{display:block;margin-top:10px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.mapbox .leaflet-popup-content .pt span{display:block;font-family:var(--mono);font-size:11px;color:var(--accent2);font-weight:600}
.mapbox .leaflet-popup-content .pq{margin:8px 0 0;color:var(--dim)}
.mapbox.leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
.mapbox .leaflet-control-attribution{background:rgba(11,15,20,.75) !important;color:var(--dim) !important}
.mapbox .leaflet-control-attribution a{color:var(--ink2) !important}
.heat.rule{color:var(--no);border-color:color-mix(in srgb,var(--no) 55%,var(--line));margin-right:6px}
.heat.rule[hidden]{display:none}
.ruleacts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ruleacts a{color:var(--ink);font-weight:600}
.ack{font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.rulestamp{margin:14px 0 0;font-size:12.5px;color:var(--dim)}
.quiet{font-size:14px;color:var(--dim);padding:14px;border:1px dashed var(--line);border-radius:14px}
.quiet.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
/* ---- the crew ---- */
/* Every class here starts cw- so no other part of the app can collide with
   it. An earlier bare .go rule turned the bait card's buy arrows into gold bars. */
.cw{max-width:430px}
.cw-fld{display:block;margin:0 0 14px}
.cw-fld > span{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
.cw-fld input,.cw-fld select,.cw-fld textarea{width:100%;min-height:48px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.cw-fld textarea{min-height:96px;padding:12px 14px;resize:vertical}
.cw-fld input:focus,.cw-fld select:focus,.cw-fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.cw-go,.cw-plain{display:flex;align-items:center;justify-content:center;width:100%;font:inherit;text-align:center;
  text-decoration:none;cursor:pointer;border-radius:12px;padding:0 14px}
.cw-go{min-height:50px;font-size:16px;font-weight:600;background:var(--gold);color:var(--on-gold);border:0}
.cw-plain{min-height:46px;margin-top:10px;font-size:15px;color:var(--ink2);background:transparent;border:1px solid var(--line)}
.cw-go[disabled],.cw-plain[disabled]{opacity:.55;cursor:default}
.cw-out{margin-top:22px}
.cw-mini{min-height:34px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.cw-mini.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.cw-msg{font-size:14px;line-height:1.45;color:var(--dim);margin:12px 0 0;min-height:1px}
.cw-msg:empty{display:none}
.cw-msg.no{color:var(--no)}
.cw-msg.ok{color:var(--go)}
.cw-lead{font-size:17px;line-height:1.45;color:var(--ink);margin:0 0 16px}
.cw-sec{margin:26px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
.cw-list{list-style:none;margin:0 0 18px;padding:0}
.cw-list li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);margin:0 0 8px}
.cw-who{flex:1 1 auto;min-width:0}
.cw-who b{font-weight:650;font-size:15.5px;overflow-wrap:anywhere}
.cw-who span{font-size:13px;color:var(--dim);margin-left:8px}
.cw-ask{flex:1 1 100%;font-size:14px;color:var(--ink2)}
.cw-acts{display:flex;flex-wrap:wrap;gap:8px}
.cw-list .cw-msg{flex:1 1 100%;margin:0}
.cw-wait{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}
.cw .box p{margin:0 0 12px}
.cw .box .cw-msg{margin:12px 0 0}
.cw-row{border:1px solid var(--line);border-radius:14px;background:var(--paper)}
/* The call: what a guide would say first. One block, one gold button. */
.cw-call{margin:0 0 4px;padding:16px 16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:var(--sh)}
.cw-call .eyebrow{margin:0 0 8px}
.cw-call-h{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:29px;line-height:1.06;letter-spacing:-.005em;
  color:var(--ink);margin:0 0 8px;overflow-wrap:anywhere}
.cw-call-why{font-size:15.5px;line-height:1.45;color:var(--ink2);margin:0}
.cw-call-leave{font-size:15.5px;line-height:1.45;font-weight:650;color:var(--ink);margin:4px 0 0}
.cw-call .cw-go{margin-top:14px}
/* Crew trips: rows, a tag, a dot for what this phone has not seen. */
.cw-tag{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2)}
.cw-tag.planned{color:var(--go);border-color:color-mix(in srgb,var(--go) 45%,var(--line))}
.cw-tag.done{color:var(--dim)}
.cw-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.cw-rowbtn{width:100%;font:inherit;text-align:left;background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.cw-rowbtn .chev{transition:transform .15s}
.cw-rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cw-make{margin:16px 0 0}
/* A crew trip's own page. */
.cw-thead h1{overflow-wrap:anywhere}
.cw-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:12px 0 0;font-size:13.5px;color:var(--dim)}
.cw-tripnote{font-size:15px;line-height:1.45;color:var(--ink2);margin:12px 0 0;overflow-wrap:anywhere}
.cw-cond{font-size:15.5px;line-height:1.45;color:var(--ink);margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);overflow-wrap:anywhere}
.cw-cond.go{border-color:color-mix(in srgb,var(--go) 45%,var(--line))}
.cw-cond.slow,.cw-cond.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.cw-cond.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.cw-going{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cw-ans{width:100%;min-height:48px;font:inherit;font-size:15px;font-weight:600;color:var(--ink2);background:var(--paper);
  border:1px solid var(--line2);border-radius:12px;padding:0 6px;cursor:pointer}
.cw-ans[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:transparent}
.cw-ghead{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  font-size:13px;color:var(--dim);text-align:center}
.cw-names{list-style:none;margin:8px 0 0;padding:0;font-size:14px;line-height:1.5;color:var(--ink2);text-align:center}
.cw-names li{overflow-wrap:anywhere}
.cw-names li[data-waiting]{color:var(--dim)}
.cw-acts2{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.cw-acts2:empty{display:none}
.cw-act{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;font:inherit;font-size:14px;
  font-weight:600;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;cursor:pointer;text-decoration:none}
.cw-act.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.cw-act[disabled]{opacity:.55;cursor:default}
.cw-asks{margin:14px 0 0;font-size:15px;color:var(--ink)}
.cw-foot{margin:26px 0 0}
/* Planning a trip. */
.cw-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cw-two .cw-fld input{min-width:0}
.cw-seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 0 14px}
.cw-pick{min-height:48px;font:inherit;font-size:15px;font-weight:600;color:var(--ink2);background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:0 8px;cursor:pointer}
.cw-pick[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--paper))}
.cw-condslot:empty{display:none}
.cw-condslot{margin:0 0 14px}
.cw-condslot .cw-cond{margin:0}
.quiet.why{margin:8px 0 0;padding:10px 12px;border-style:solid;font-size:13px;line-height:1.45}
.asof{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 0;font-size:12.5px;color:var(--dim)}
.asof button{font:inherit;color:var(--accent2);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.pn{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin:14px 0 0}
.pnb{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:9px 13px;text-decoration:none;
  background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--ink);min-width:0}
.pnb:hover,.pnb:active{border-color:var(--accent)}
.pnb.next{text-align:right}
.pnb span{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--accent)}
.pnb b{font-weight:650;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnb.none{visibility:hidden}
.pos{align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
[data-view="card"] .card{margin-bottom:0}

/* ---- species picker ---- */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 0}
.pickcard{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:16px 14px;
  box-shadow:var(--sh);transition:border-color .15s,transform .15s;
  font:inherit;color:inherit;
}
.pickcard .meta{display:block;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600}
.pickcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.pickcard .nm{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;font-size:26px;color:var(--ink);line-height:1}
.pickcard .sub{display:block;font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.4}

/* ---- where ---- */
.locs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 4px}
.loc{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:13.5px;cursor:pointer;
  background:var(--panel);color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;transition:all .15s;
}
.loc[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:transparent}
.locone{font-size:13px;color:var(--dim);margin:0 0 4px}
.locone strong{color:var(--ink2);font-weight:600}

/* ---- card groups ---- */
.grp{margin:26px 0 0}
.grp > h2{margin-top:0}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin:0 0 12px;
  box-shadow:var(--sh);
}
.card > h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;font-size:17px;margin:0 0 8px;color:var(--ink)}
.card .when{margin-bottom:2px}
.card p{font-size:14.5px;color:var(--ink2);margin:0 0 10px}
.card :last-child{margin-bottom:0}
.stamp{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;
  padding-top:8px;border-top:1px solid var(--line)}
.back{
  display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;font-size:13px;color:var(--dim);
  background:none;border:0;padding:4px 0;
}
.back:hover{color:var(--accent)}

/* ---- add to trip ---- */
.addtrip{
  display:block;width:100%;margin:14px 0 0;padding:10px;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:13.5px;
  background:var(--panel2);color:var(--dim);
  border:1px dashed var(--line2);border-radius:10px;transition:all .15s;
}
.addtrip:hover{color:var(--ink2);border-color:var(--accent)}
.addtrip[aria-pressed="true"]{
  background:color-mix(in srgb,var(--go) 14%,var(--panel));
  color:var(--go);border-style:solid;border-color:color-mix(in srgb,var(--go) 45%,var(--line));
}

/* ---- trip bar ---- */
.tripbar{
  position:sticky;bottom:0;z-index:40;margin:22px -16px 0;padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(16px) saturate(140%);
  border-top:1px solid var(--line);
}
.tripbar span{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;font-size:14px;color:var(--dim)}
.tripgo{
  flex:0 0 auto;padding:10px 18px;border-radius:999px;cursor:pointer;border:0;
  background:var(--gold);color:var(--on-gold);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;font-size:14px;
  box-shadow:0 2px 12px -2px color-mix(in srgb,var(--accent) 60%,transparent);
}

/* ---- field mode ---- */
/* Bigger everything. Cold hands, head lamp, one eye on the rod. */
.fieldtop{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.fieldtop .back{margin:0;flex:1}
.tripdate{
  font:inherit;font-size:14px;color:var(--ink2);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
}
.fieldmode h1{font-size:40px}
.fieldmode .card{padding:18px 18px;border-radius:18px;margin-bottom:16px}
.fieldmode .card > h3{font-size:21px;margin-bottom:11px}
.fieldmode .card p,.fieldmode .box{font-size:17px;line-height:1.5}
.fieldmode .box{padding:15px 17px;border-radius:15px}
.fieldmode .box b{font-size:15.5px}
.fieldmode ol.steps li{font-size:17px;padding-left:44px}
.fieldmode .sp .v{font-size:15px}
.fieldmode .sp .have{font-size:12px}
.fieldmode .stamp{font-size:12.5px}

/* Four spec columns is too tight on a phone. The original card had this and
   the new spec strip needs it just as much. */
@media (max-width:420px){
  .specs{grid-template-columns:repeat(2,1fr)}
  h1{font-size:38px}
  .fieldmode h1{font-size:34px}
}

@media (prefers-reduced-motion:reduce){
  .kstep.on .draw{transition:none}
  .cw-rowbtn .chev{transition:none}
  .floatbob{animation:none}
  .pickcard:hover{transform:none}
}
</style>
</head>

<!-- Shared rig parts. Diagrams draw them with <use href="#hook">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

    <path d="M20 12.5 L20 58" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M20 58 C20 86 9 92 5.5 76 L5.5 58" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5.5 63 L11 70" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="swivel" viewBox="0 0 22 42">
    <circle cx="11" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
    <rect x="6" y="11.5" width="10" height="19" rx="4.5" fill="currentColor"/>
    <circle cx="11" cy="36" r="4.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
  </symbol>
  <symbol id="shot" viewBox="0 0 20 16">
    <ellipse cx="10" cy="8" rx="9" ry="7.2" fill="currentColor"/>
    <path d="M10 1.2 L10 14.8" stroke="var(--panel)" stroke-width="1.6"/>
  </symbol>
</defs></svg>
<div class="wrap">
  <div id="app"></div>
</div>

<script src="/rigs/diagrams.js"></script>
<script src="/rigs/content.js"></script>
<script src="/rigs/trips.js"></script>
<script src="/rigs/runs.js"></script>
<script src="/rigs/sky.js"></script>
<script src="/rigs/crew.js"></script>
<script src="/rigs/rules.js"></script>
<script src="/rigs/waters.js"></script>
<script>
(function () {
  "use strict";
  var RIG = (window.RIG = window.RIG || {});
  RIG.version = "1";

  var app = document.getElementById("app");
  var KEY = "rig.trip.v1";

  var GROUPS = [
    { key: "technique", label: "Technique", short: "Watch" },
    { key: "before", label: "Before you go", short: "Plan" },
    { key: "water", label: "At the water", short: "Fish" },
    { key: "after", label: "After", short: "After" }
  ];

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function species() { return (RIG.content && RIG.content.species) || []; }
  function fundamentals() { return (RIG.content && RIG.content.fundamentals) || []; }
  function findSpecies(id) {
    var a = species();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function findLocation(sp, id) {
    var l = (sp && sp.locations) || [];
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return l[0] || null;
  }
  // A string in a cards list points at a shared card, written once and used
  // by every fish it is true for (the river rigs serve king, coho, chum and
  // steelhead alike).
  function shared() { return (RIG.content && RIG.content.shared) || []; }
  function resolve(list) {
    return (list || []).map(function (c) {
      return typeof c === "string" ? shared().filter(function (x) { return x.id === c; })[0] : c;
    }).filter(Boolean);
  }
  function cardsFor(sp, loc) { return resolve(sp.cards).concat(resolve(loc && loc.cards)); }

  // Every card in the library, flat, so Field mode can resolve a saved id
  // without knowing which species or location it came from.
  function allCards() {
    var out = fundamentals().concat(shared());
    function own(list) { return (list || []).filter(function (c) { return typeof c !== "string"; }); }
    species().forEach(function (sp) {
      out = out.concat(own(sp.cards));
      (sp.locations || []).forEach(function (l) { out = out.concat(own(l.cards)); });
    });
    return out;
  }

  // ---- trip state -------------------------------------------------------
  // Storage can throw: iOS private browsing rejects setItem outright. Losing
  // the saved trip is survivable, a blank page is not, so every access is
  // guarded and a failure degrades to in-memory with a visible notice.
  var storageBroken = false;
  var state = { cards: [], date: "", mode: "" };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      state.cards = Array.isArray(p.cards) ? p.cards.slice() : [];
      state.date = typeof p.date === "string" ? p.date : "";
      state.mode = p.mode === "field" || p.mode === "library" ? p.mode : "";
    } catch (e) { storageBroken = true; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { storageBroken = true; }
  }

  RIG.trip = {
    list: function () { return state.cards.slice(); },
    has: function (id) { return state.cards.indexOf(id) !== -1; },
    add: function (id) { if (!this.has(id)) { state.cards.push(id); save(); render(); } },
    remove: function (id) {
      var i = state.cards.indexOf(id);
      if (i !== -1) { state.cards.splice(i, 1); save(); render(); }
    },
    toggle: function (id) { this.has(id) ? this.remove(id) : this.add(id); },
    date: function () { return state.date; },
    setDate: function (iso) { state.date = iso || ""; save(); render(); },
    clear: function () { state.cards = []; state.date = ""; state.mode = ""; save(); render(); }
  };

  // Mode is whatever Coach last chose, and nothing else. It persists, so
  // the pier case is zero taps: he switched to field mode when he got there
  // last time and that is where it opens.
  //
  // An earlier version inferred field mode from "a saved trip has cards in
  // it". That guesses wrong in both directions: adding the first card while
  // planning threw him out of the library he was working in, and a trip
  // planned over several evenings reopened into field mode every time. The
  // app cannot know where he is standing, so it stops pretending to.
  var activeMode = "library";
  function resolveMode() {
    activeMode = state.mode || "library";
  }
  function mode() { return activeMode; }
  function setMode(m) { activeMode = m; state.mode = m; save(); render(); }

  // ---- staleness --------------------------------------------------------
  // Only content that actually decays gets a warning, and each kind decays at
  // its own rate. `dated` alone is just a "last checked" stamp: a rod spec
  // does not go off in three weeks, so warning about it trains Coach to
  // ignore the banner that matters. A card opts in with shelfDays.
  //   regs       ~180 days, limits move season to season
  //   tide/moon  ~2 days, those are numbers for one specific night
  function staleFor(card) {
    if (!card.dated || !card.shelfDays) return null;
    var d = Date.parse(card.dated);
    // With no trip date set, measure against TODAY. Requiring a trip date
    // meant the default path showed month old numbers with nothing but a
    // quiet "good as of" stamp, which is the exact thing the warning exists
    // to prevent.
    var t = state.date ? Date.parse(state.date) : Date.now();
    if (isNaN(d) || isNaN(t)) return null;
    return t - d > card.shelfDays * 86400000 ? card.dated : null;
  }

  // ---- rendering --------------------------------------------------------
  function cardHtml(c, opts) {
    opts = opts || {};
    var dia = c.diagram && RIG.diagrams && RIG.diagrams[c.diagram]
      ? '<div class="dia">' + RIG.diagrams[c.diagram] + "</div>" : "";
    var stale = staleFor(c);
    var warn = stale
      ? '<div class="box red" data-stale><b>this is out of date</b>' +
        "These numbers were good as of <strong>" + esc(stale) + "</strong>, and your trip is set for " +
        esc(state.date) + ". Pull them again before you rely on them.</div>"
      : "";
    var stamp = c.dated ? '<p class="stamp">Good as of ' + esc(c.dated) + "</p>" : "";
    var add = opts.addable
      ? '<button class="addtrip" type="button" data-addtrip="' + esc(c.id) + '" aria-pressed="' +
        (RIG.trip.has(c.id) ? "true" : "false") + '">' +
        (RIG.trip.has(c.id) ? "In this trip" : "Add to trip") + "</button>"
      : "";
    return '<article class="card" data-card="' + esc(c.id) + '">' +
      "<h3>" + esc(c.title) + "</h3>" + warn + dia + c.body + stamp + add + "</article>";
  }

  function noticeHtml() {
    return storageBroken
      ? '<div class="box red" data-trip-notice><b>this trip will not be saved</b>' +
        "Your browser is refusing to store it, which private browsing does. " +
        "It works for now and it will be gone when you close the tab.</div>"
      : "";
  }

  function tripBarHtml() {
    var n = state.cards.length;
    if (!n) return "";
    return '<div class="tripbar">' +
      '<span data-trip-count>' + n + (n === 1 ? " card" : " cards") + " in this trip</span>" +
      '<button class="tripgo" type="button" data-mode-field>Field mode</button></div>';
  }

  // ---- headlines first ----------------------------------------------------
  // Coach, 2026-11-21: "I see the headlines and dig in, not everything in
  // front of me at once." Every list is a column of headline rows. A card
  // opens alone on its own screen, with next and back.
  function types() { return (RIG.content && RIG.content.types) || []; }
  function spots() { return (RIG.content && RIG.content.spots) || []; }
  function findSpot(id) { return spots().filter(function (s) { return s.id === id; })[0] || null; }
  function findType(id) { return types().filter(function (t) { return t.id === id; })[0] || null; }
  function speciesAt(spotId) {
    return species().filter(function (sp) {
      return (sp.locations || []).some(function (l) { return l.id === spotId; });
    });
  }
  // A spot with no cards behind it is an empty widget, so it never shows.
  function spotsOfType(t) {
    return spots().filter(function (s) { return s.types.indexOf(t) !== -1 && speciesAt(s.id).length; });
  }

  var ICONS = {
    river: '<path d="M4 13c5-5 9 5 14 0s9 5 14 0 6 3 6 3"/><path d="M2 22c5-5 9 5 14 0s9 5 14 0 8 3 8 3"/><path d="M4 31c5-5 9 5 14 0s9 5 14 0 6 3 6 3"/>',
    beach: '<circle cx="29" cy="11" r="5"/><path d="M3 27c5-4 9 4 14 0s9 4 14 0 6 2 6 2"/><path d="M3 35h34"/>',
    lake: '<ellipse cx="20" cy="27" rx="16" ry="7"/><path d="M11 21V7"/><path d="M15 20V11"/><path d="M8 22v-9"/>',
    pier: '<path d="M2 14h36"/><path d="M8 14v19M18 14v19M28 14v19"/><path d="M2 27c4-3 7 3 11 0s7 3 11 0 7 3 11 0"/>',
    "kayak-lake": '<path d="M3 24c8 4 26 4 34 0-8-3-26-3-34 0z"/><path d="M10 9l20 26"/><ellipse cx="20" cy="33" rx="15" ry="3"/>',
    fly: '<path d="M24 6v20c0 7-10 7-10 0v-3"/><path d="M14 23l3 3"/><path d="M24 10c-8-2-14 2-16 8 6 0 12-2 16-6"/><path d="M24 14c6-3 11-1 13 3-5 1-10 0-13-2"/>',
    "kayak-sound": '<path d="M3 21c8 4 26 4 34 0-8-3-26-3-34 0z"/><path d="M10 6l20 26"/><path d="M2 33c4-3 7 3 11 0s7 3 11 0 7 3 11 0"/>'
  };
  function icon(id) {
    return '<svg class="ic" viewBox="0 0 40 40" aria-hidden="true">' + (ICONS[id] || "") + "</svg>";
  }

  // The first "when" line of a card, as plain text, for its headline row.
  var scratch = document.createElement("div");
  function snippet(c) {
    var m = /<p class="when">([\s\S]*?)<\/p>/.exec(c.body || "");
    if (!m) return "";
    scratch.innerHTML = m[1];
    var t = scratch.textContent.trim();
    return t.length > 90 ? t.slice(0, 88).replace(/\s+\S*$/, "") + "…" : t;
  }
  function metaOf(c) {
    var b = c.body || "";
    var v = (b.match(/class="vid"/g) || []).length;
    if (v) return v + (v === 1 ? " video" : " videos");
    if (/class="tyer"/.test(b)) return "Step by step";
    if (c.diagram) return "Diagram";
    return "";
  }

  function rowHtml(c, href) {
    var s = snippet(c), m = metaOf(c);
    return '<a class="row" href="' + esc(href) + '" data-row="' + esc(c.id) + '">' +
      '<span class="rt"><b>' + esc(c.title) + "</b>" + (s ? "<span>" + esc(s) + "</span>" : "") + "</span>" +
      (m ? '<span class="rm">' + esc(m) + "</span>" : "") +
      '<span class="chev" aria-hidden="true">&rsaquo;</span></a>';
  }

  function chip(attr, id, text, active) {
    return '<button class="jp" type="button" ' + attr + '="' + esc(id) + '" aria-current="' +
      (id === active ? "true" : "false") + '">' + esc(text) + "</button>";
  }
  function learnSections() {
    var names = [];
    fundamentals().forEach(function (c) { if (c.section && names.indexOf(c.section) === -1) names.push(c.section); });
    return names;
  }
  function chipsFor(tab, active) {
    if (tab === "water") return types().filter(function (t) { return spotsOfType(t.id).length; })
      .map(function (t) { return chip("data-type", t.id, t.label, active); }).join("");
    if (tab === "fish") return species().map(function (sp) { return chip("data-species", sp.id, sp.name, active); }).join("");
    if (tab === "trips") return chip("data-tmode", "list", "List", active || "list") + chip("data-tmode", "map", "Map", active || "list");
    if (tab === "learn") return learnSections().map(function (n) { return chip("data-sec", n.toLowerCase(), n, active); }).join("");
    return "";
  }

  // Pinned header: three ways in (Water, Fish, Learn), and under them one
  // tap filters for whichever way is open.
  function topHtml(tab, active) {
    var tabs = [["trips", "Trips"], ["water", "Water"], ["fish", "Fish"], ["learn", "Learn"]].map(function (t) {
      return '<button class="tab" type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' +
        (t[0] === tab ? "true" : "false") + '">' + t[1] + "</button>";
    }).join("");
    var sub = chipsFor(tab, active);
    return '<header class="top"><nav class="tabs" role="tablist">' + tabs +
      '<button class="skymode" type="button" data-skymode title="Screen: follows the sky, or held light or dark">' +
      '<span data-skylabel></span></button></nav>' +
      (sub ? '<nav class="jump" aria-label="Filter">' + sub + "</nav>" : "") + "</header>";
  }

  function headHtml(eyebrow, title, line) {
    return '<div class="shead">' + (eyebrow ? '<p class="eyebrow">' + eyebrow + "</p>" : "") +
      "<h1>" + esc(title) + "</h1>" + (line ? '<p class="when">' + esc(line) + "</p>" : "") + "</div>";
  }

  // Cards in the order the groups render them, so next and back read in the
  // same order as the list.
  function ordered(cards) {
    var out = [];
    GROUPS.forEach(function (g) { out = out.concat(cards.filter(function (c) { return c.group === g.key; })); });
    return out;
  }

  function renderHome() {
    var tiles = types().map(function (t) {
      var n = spotsOfType(t.id).length;
      if (!n) return "";
      return '<a class="tile" href="#/water/' + esc(t.id) + '" data-type-tile="' + esc(t.id) + '">' + icon(t.id) +
        '<span class="nm">' + esc(t.label) + '</span><span class="meta">' + n + (n === 1 ? " spot" : " spots") + "</span></a>";
    }).join("");
    app.innerHTML = topHtml("water") +
      '<div data-view="home">' + headHtml("Fishing library", "Rig Card", "How do you want to fish?") +
        noticeHtml() + '<div class="tiles">' + tiles + "</div></div>" + tripBarHtml();
  }

  function renderWater(t) {
    var rows = spotsOfType(t.id).map(function (s) {
      var names = speciesAt(s.id).map(function (sp) { return sp.name; }).join(", ");
      return '<a class="row" href="#/spot/' + esc(s.id) + '" data-spot="' + esc(s.id) + '">' +
        '<span class="rt"><b>' + esc(s.name) + "</b><span>" + esc(s.where) + "</span></span>" +
        '<span class="rm">' + esc(names) + '</span><span class="chev" aria-hidden="true">&rsaquo;</span></a>';
    }).join("");
    // Kayak water also gets the boat itself, and Fly gets the casting course.
    function learnLink(attr, sec, head, title, sub) {
      return fundamentals().some(function (c) { return c.section === sec; })
        ? '<section class="grp" ' + attr + '><h2>' + head + '</h2><div class="rows"><a class="row" href="#/learn/' + sec.toLowerCase() + '">' +
          '<span class="rt"><b>' + title + "</b><span>" + sub + "</span></span>" +
          '<span class="chev" aria-hidden="true">&rsaquo;</span></a></div></section>'
        : "";
    }
    var kayak = /^kayak/.test(t.id) ? learnLink("data-kayak", "Kayak", "The kayak", "Kayak safety and gear", "Go or no go, packing, anchor, getting back in")
      : t.id === "fly" ? learnLink("data-flylearn", "Fly", "Learn it", "Fly casting course", "Rig, cast, roll cast, flies, yard practice") : "";
    app.innerHTML = topHtml("water", t.id) +
      '<div data-view="water">' + headHtml(icon(t.id), t.label, "") +
        '<div class="rows">' + rows + "</div>" + kayak + "</div>" + tripBarHtml();
  }

  function renderSpot(s) {
    var list = speciesAt(s.id);
    var rows = list.map(function (sp) {
      var loc = findLocation(sp, s.id);
      var n = cardsFor(sp, loc).length;
      return '<a class="row" href="#/' + esc(sp.id) + "/" + esc(s.id) + '" data-row-species="' + esc(sp.id) + '">' +
        '<span class="rt"><b>' + esc(sp.name) + "</b>" + (sp.hint ? "<span>" + esc(sp.hint) + "</span>" : "") + "</span>" +
        '<span class="rm">' + n + ' cards</span><span class="chev" aria-hidden="true">&rsaquo;</span></a>';
    }).join("");
    var t = findType(s.types[0]);
    app.innerHTML = topHtml("water", t && t.id) +
      '<div data-view="spot">' + headHtml(esc(s.where), s.name, "What are you after?") +
        '<div class="rows">' + rows + "</div></div>" + tripBarHtml();
  }

  function renderFish() {
    function pick(sp) {
      var n = (sp.cards || []).length;
      (sp.locations || []).forEach(function (l) { n += (l.cards || []).length; });
      var spotsN = (sp.locations || []).length;
      return '<button class="pickcard" type="button" data-species="' + esc(sp.id) + '">' +
        '<span class="nm">' + esc(sp.name) + "</span>" +
        '<span class="sub">' + esc(sp.hint || "") + "</span>" +
        '<span class="meta">' + n + " cards" + (spotsN ? " · " + spotsN + (spotsN === 1 ? " spot" : " spots") : "") +
        "</span></button>";
    }
    var fams = (RIG.content && RIG.content.families) || [];
    var body = fams.map(function (f) {
      var mine = species().filter(function (sp) { return sp.family === f.id; });
      return mine.length ? '<section class="grp" data-family="' + esc(f.id) + '"><h2>' + esc(f.label) + "</h2>" +
        '<div class="pick">' + mine.map(pick).join("") + "</div></section>" : "";
    }).join("");
    var loose = species().filter(function (sp) { return !fams.some(function (f) { return f.id === sp.family; }); });
    if (loose.length) body += '<div class="pick">' + loose.map(pick).join("") + "</div>";
    app.innerHTML = topHtml("fish") +
      '<div data-view="fish">' + headHtml("By fish", "What are you after?", "") + body + "</div>" + tripBarHtml();
  }

  function groupRows(cards, hrefFor) {
    return GROUPS.map(function (g) {
      var mine = cards.filter(function (c) { return c.group === g.key; });
      if (!mine.length) return "";
      return '<section class="grp" data-group="' + g.key + '"><h2>' + esc(g.short) +
        ' <span class="n">' + mine.length + '</span></h2><div class="rows">' +
        mine.map(function (c) { return rowHtml(c, hrefFor(c)); }).join("") + "</div></section>";
    }).join("");
  }

  function speciesBase(sp, loc) { return "#/" + sp.id + "/" + (loc ? loc.id : "-"); }

  // The oldest "good as of" date on a spot's rule cards: anything WDFW posted
  // after it may not be in them yet.
  function oldestDated(cards) {
    var d = cards.map(function (c) { return c.dated; }).filter(Boolean).sort()[0];
    return d || RULES_BASE;
  }
  function renderSpecies(sp, loc) {
    var locs = sp.locations || [];
    var place = loc ? esc(loc.name) + (loc.where ? ", " + esc(loc.where) : "") : "";
    var chips = locs.length > 1
      ? '<div class="locs" data-locations>' + locs.map(function (l) {
          return '<button class="loc" type="button" data-loc="' + esc(l.id) + '" aria-pressed="' +
            (l === loc ? "true" : "false") + '">' + esc(l.name) + "</button>";
        }).join("") + "</div>"
      : "";
    var eyebrow = locs.length > 1 ? place : '<span data-locations>' + place + "</span>";
    var base = speciesBase(sp, loc);
    app.innerHTML = topHtml("fish", sp.id) +
      '<div data-view="species">' + headHtml(eyebrow, sp.name, "") +
        noticeHtml() + chips + (loc ? '<div data-rules-slot' + slotAttrs(loc.id, sp.id, oldestDated(cardsFor(sp, loc))) + "></div>" : "") +
        '<span hidden data-location-current>' + esc(loc ? loc.name : "") + "</span>" +
        groupRows(cardsFor(sp, loc), function (c) { return base + "/" + c.id; }) +
      "</div>" + tripBarHtml();
  }

  function renderLearn(sec) {
    var all = fundamentals();
    var names = learnSections().filter(function (n) { return !sec || n.toLowerCase() === sec; });
    var body = names.map(function (n) {
      var mine = all.filter(function (c) { return c.section === n; });
      return '<section class="grp" data-group="fundamental" data-section="' + esc(n) + '"><h2>' + esc(n) +
        ' <span class="n">' + mine.length + '</span></h2><div class="rows">' +
        mine.map(function (c) { return rowHtml(c, "#/learn/" + c.id); }).join("") + "</div></section>";
    }).join("");
    app.innerHTML = topHtml("learn", sec) +
      '<div data-view="learn">' + headHtml("Learn", "Rods, knots, kayak, fly", "True for any fish, anywhere.") +
        body + "</div>" + tripBarHtml();
  }

  // One card, alone. Back goes up to the list, next and previous walk it.
  function renderCard(o) {
    var i = o.list.indexOf(o.card);
    var prev = o.list[i - 1], next = o.list[i + 1];
    function step(c, cls, word) {
      return c ? '<a class="pnb ' + cls + '" href="' + esc(o.hrefFor(c)) + '" data-step="' + esc(c.id) + '"><span>' + word +
        "</span><b>" + esc(label(c)) + "</b></a>" : '<span class="pnb ' + cls + ' none"></span>';
    }
    app.innerHTML = topHtml(o.tab, o.active) +
      '<div data-view="card">' +
        '<a class="back" href="' + esc(o.upHref) + '" data-up>&larr; ' + esc(o.upText) + "</a>" +
        noticeHtml() + (o.rules ? '<div data-rules-slot' + slotAttrs(o.rules.spot, o.rules.species, o.rules.since) + "></div>" : "") +
        cardHtml(o.card, { addable: o.addable !== false }) +
        '<nav class="pn">' + step(prev, "prev", "Back") +
          '<span class="pos">' + (i + 1) + " of " + o.list.length + "</span>" + step(next, "next", "Next") + "</nav>" +
      "</div>" + tripBarHtml();
    window.scrollTo(0, 0);
  }

  // ---- WDFW rule flags ----------------------------------------------------
  // rigs/rules.js pulls WDFW's emergency rules in the background on every
  // load. Views leave empty slots ([data-rules-slot], [data-rule-badge],
  // [data-rules-status]) and fillRules() fills them, now and again when the
  // background check lands, so nothing re-renders under your thumb.
  var RULES_BASE = (RIG.rules && RIG.rules.base) || "2026-11-23"; // see rigs/rules.js
  function rulesReady() { return !!(RIG.rules && RIG.rules.newFor); }
  function slotAttrs(spot, species, since) {
    return ' data-spot="' + esc(spot) + '" data-species="' + esc(species) + '" data-since="' + esc(since || RULES_BASE) + '"';
  }
  function fmtDay(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function ruleBoxes(list) {
    return list.map(function (r) {
      return '<div class="box red" data-newrule><b>new WDFW rule since this was checked</b><strong>' + esc(r.title) + "</strong><br>" +
        "Posted " + esc(fmtDay(r.published)) + (r.effective ? ". In effect: " + esc(r.effective) : "") + "." +
        '<span class="ruleacts"><a href="' + esc(r.link) + '" target="_blank" rel="noopener">Read it on WDFW</a>' +
        '<button type="button" class="ack" data-ack="' + esc(r.link) + '">Got it</button></span></div>';
    }).join("");
  }
  function statusHtml() {
    var st = RIG.rules.status();
    var link = '<a href="https://wdfw.wa.gov/fishing/regulations/emergency-rules" target="_blank" rel="noopener">WDFW emergency rules</a>';
    if (st.never) return '<div class="box law" data-rules-state="never"><b>rules not checked yet</b>This phone has not reached the rule check. Read the ' + link + " before you fish.</div>";
    var when = new Date(st.at).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    if (st.stale) return '<div class="box law" data-rules-state="stale"><b>rules not updated</b>Last checked ' + esc(when) +
      ". You may be offline. Read the " + link + " before you fish.</div>";
    return '<p class="rulestamp" data-rules-state="fresh">WDFW rules checked ' + esc(when) + "</p>";
  }
  function fillRules() {
    if (!rulesReady()) return;
    [].forEach.call(app.querySelectorAll("[data-rules-slot]"), function (el) {
      el.innerHTML = ruleBoxes(RIG.rules.newFor(el.dataset.spot, el.dataset.species, el.dataset.since));
    });
    [].forEach.call(app.querySelectorAll("[data-rule-badge]"), function (el) {
      var n = RIG.rules.newFor(el.dataset.spot, el.dataset.species, el.dataset.since).length;
      el.hidden = !n;
      el.textContent = "New rule";
    });
    [].forEach.call(app.querySelectorAll("[data-rules-status]"), function (el) { el.innerHTML = statusHtml(); });
  }
  function checkRules() {
    if (!rulesReady()) return;
    RIG.rules.load().then(fillRules, fillRules);
  }

  // ---- Hot Trips ----------------------------------------------------------
  // The week ahead from live tides and weather (rigs/trips.js does the
  // thinking). Headlines first: one row per trip, tap for the why.
  var lastPlan = null;
  function hotKey(day, t) { return day.iso + "~" + t.planId; }
  function plannerReady() { return !!(RIG.trips && RIG.trips.plan); }
  function planFrom(data) {
    var now = new Date();
    var today = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2);
    var p = RIG.trips.plan({ today: today, wx: data.wx, tides: data.tides, flow: data.flow, waters: data.waters });
    p.at = data.at; p.stale = !!data.stale;
    return p;
  }
  function asOf(p) {
    var d = new Date(p.at);
    var t = d.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" });
    return '<div class="asof"><span data-asof>' + (p.stale ? "Offline. Forecast from " : "Forecast from ") + esc(t) + "</span>" +
      '<button type="button" data-refresh>Refresh</button></div>';
  }
  function drawTrips(p) {
    var body = p.days.map(function (day) {
      var rows = day.trips.map(function (t) {
        return '<a class="row" href="#/trips/' + encodeURIComponent(hotKey(day, t)) + '" data-hot="' + esc(t.planId) + '">' +
          '<span class="rt"><b>' + esc(t.name) + "</b><span>" + esc(t.slot + " · " + t.when) + "</span></span>" +
          '<span class="heat rule" data-rule-badge hidden' + slotAttrs(t.spot, t.species, runSince(t.planId)) + "></span>" +
          '<span class="heat' + (t.heat === "Hot" ? " hot" : "") + '">' + esc(t.heat) + "</span>" +
          '<span class="chev" aria-hidden="true">&rsaquo;</span></a>';
      }).join("");
      // A weeknight in winter carries the reason the daylight trips are not
      // on it, under whatever night trip it does have.
      var inner = rows ? '<div class="rows">' + rows + "</div>" + (day.dark ? '<p class="quiet why" data-dark>' + esc(day.dark) + "</p>" : "")
        : '<p class="quiet' + (day.note ? " no" : "") + '" data-quiet>' + esc(day.note || "Nothing good") + "</p>";

  // The call: the one best trip in the forecast, said the way a guide would

  // ---- the crew ----------------------------------------------------------
  // Signed out this is a sign-in screen and nothing more. Nothing anywhere

  //
  // Building blocks every crew screen uses (their classes all start cw-):

  //   cwField(label, inputHtml)  a labelled box. Give the input data-keep="name"

  //   cwMsg(text, kind, attr)    the message line. kind: "" plain, "no" trouble, "ok" good.
  //   cwOnce(key, work)          a tap that cannot be doubled. work returns a promise.

  var SITE = "https://coachpilot.org/rigs/";

  function crewFresh(sms) {
    return { step: "phone", msg: null, sms: sms === undefined ? null : sms, joinMsg: null, vals: {}, st: null, sig: "",

  // The step a person is on outlives a reload: reading the code means
  // leaving for Messages, and a phone may throw the page away meanwhile.
  function stepSave() {
    try {
      if (crewUi.step === "code") localStorage.setItem(STEP_KEY, JSON.stringify({ step: "code", phone: crewUi.vals.phone || "", at: Date.now() }));
      else localStorage.removeItem(STEP_KEY);

  }
  (function stepLoad() {
    try {

      else if (s) localStorage.removeItem(STEP_KEY);

  })();

  function crewOn() { return /^#\/?(crew|join)(\/|$)/.test(location.hash || ""); }
  function crewRedraw(load) {
    if (!crewOn()) return;
    var act = document.activeElement, key = act && act.getAttribute ? act.getAttribute("data-keep") : null;
    crewQuiet = !load;

    var el = key && app.querySelector('[data-keep="' + key + '"]');

  function kv(key) { return esc(crewUi.vals[key] || ""); }
  function cwField(label, input) { return '<label class="cw-fld"><span>' + label + "</span>" + input + "</label>"; }
  function cwMsg(text, kind, attr) {

  }
  function cwSaid(m, quiet, attr) { return cwMsg(m ? m.t : quiet, m && m.no ? "no" : "", attr); }
  function cwOnce(key, work) {
    if (cwBusy[key]) return;
    cwBusy[key] = true;

    try { Promise.resolve(work()).then(done, done); } catch (e) { done(); }

  function firstName(n) { return String(n || "").trim().split(/\s+/)[0] || "Coach"; }
  function crewHead(view) {

  // Signed out: the phone number and its code first, a pasted link under it.

  function signinHtml() {
    var sms = crewUi.sms !== false, form;
    if (!sms) {

    } else if (crewUi.step === "code") {

          'autocomplete="one-time-code" maxlength="8" placeholder="123456" value="' + kv("code") + '">') +

  function inviteHtml() {

      cwField("Their phone number (optional)", '<input data-invite-phone data-keep="invPhone" data-enter="data-invite-send" type="tel" inputmode="tel" ' +

  }
  function addnumHtml() {
    if (crewUi.hasPhone !== false) return "";
    var n = crewUi.num, open = '<div class="box" data-addnum><b>your number</b>';
    if (!n) return open + "<p>Add your phone number and you can sign in with a code on any phone.</p>" +

    if (n.step === "done") return open + cwMsg("Your number is on your account. You can sign in with it now.", "ok", "data-addnum-done") + "</div>";
    if (n.step === "code") return open +

        'autocomplete="one-time-code" maxlength="8" placeholder="123456" value="' + kv("numCode") + '">') +
      '<button class="cw-plain" type="button" data-addnum-verify>Confirm my number</button>' +
      cwSaid(n.msg, "It can take a minute to arrive.", "data-addnum-msg") + "</div>";
    return open +
      cwField("Your phone number", '<input data-addnum-phone data-keep="numPhone" data-enter="data-addnum-send" type="tel" inputmode="tel" ' +
        'autocomplete="tel" placeholder="253 555 0147" value="' + kv("numPhone") + '">') +
      '<button class="cw-plain" type="button" data-addnum-send>Text me a code</button>' +
      cwSaid(n.msg, "", "data-addnum-msg") + "</div>";

  function crewBodyHtml() {
    var r = crewUi.st, out = '<button class="cw-plain cw-out" type="button" data-signout>Sign out</button>';
    if (!r) return cwMsg("Loading the crew...", "", "data-crew-msg");
    // Nothing saved on this phone and no answer: say so. Never an empty crew.
    if (!r.me) {
      return cwMsg(r.offline ? "No signal, and the crew is not saved on this phone yet." : r.error || "The crew could not be loaded. Try again in a minute.", "no", "data-crew-msg") +
        '<button class="cw-plain" type="button" data-crew-retry>Try again</button>' + out;
    }
    var note = r.stale && r.offline ? "No signal. This is the last crew list this phone saw."
      : r.stale && r.error ? "Could not refresh. This is the last crew list this phone saw." : "";
    var noteHtml = note ? cwMsg(note, "", "data-crew-note") : "";
    if (!r.crew) {
      return noteHtml + '<p class="cw-lead" data-nocrew>You are signed in, but you are not on a crew yet. Ask Coach to add you.</p>' + addnumHtml() + out;
    }
    var owner = r.crew.role === "owner";
    var rows = (r.members || []).map(function (m) {
      var mine = m.id === r.me.id, id = esc(m.id);
      var tags = [m.role === "owner" ? "runs the crew" : "", mine ? "you" : ""].filter(Boolean).join(", ");
      var acts = "";
      if (owner && !mine && m.role !== "owner") {
        acts = crewUi.confirm === m.id
          ? '<span class="cw-ask">Remove ' + esc(m.name) + " from the crew?</span><span class=\"cw-acts\">" +
            '<button class="cw-mini no" type="button" data-remove-yes="' + id + '">Remove</button>' +
            '<button class="cw-mini" type="button" data-remove-no>Keep</button></span>'
          : '<span class="cw-acts">' +
            (m.signIn === "link" ? '<button class="cw-mini" type="button" data-newlink="' + id + '">New link</button>' : "") +
            '<button class="cw-mini" type="button" data-remove="' + id + '">Remove</button></span>';
      }
      return '<li data-member="' + id + '"><span class="cw-who"><b>' + esc(m.name) + "</b>" + (tags ? "<span>" + tags + "</span>" : "") + "</span>" + acts +
        (crewUi.rowMsg[m.id] ? cwMsg(crewUi.rowMsg[m.id], "no", 'data-member-msg="' + id + '"') : "") + "</li>";
    }).join("");
    return "<h2 data-crewname>" + esc(r.crew.name || "Your crew") + "</h2>" + noteHtml +
      '<ul class="cw-list">' + rows + "</ul>" +
      (crewUi.share ? shareHtml() : owner ? inviteHtml() : "") + addnumHtml() + out;

  function crewTake(r) {
    if (!r || r.signedOut) { crewUi = crewFresh(crewUi.sms); stepSave(); crewRedraw(true); return; }
    // A call that failed with nothing saved must not blank a crew already on screen.
    if (!r.me && crewUi.st && crewUi.st.me) r = Object.assign({}, crewUi.st, { stale: true }, r);
    var sig = JSON.stringify(r);
    if (sig === crewUi.sig) return;
    crewUi.sig = sig; crewUi.st = r;
    crewRedraw();
  }
  function crewFetch() {
    var mine = ++crewLoad;
    function take(r) { if (mine === crewLoad) crewTake(r); }
    RIG.crew.state({ onFresh: take }).then(take);
    // Only an account with no number on it is offered "Add my number".
    RIG.crew.prefsGet().then(function (p) {
      if (mine !== crewLoad || !p || typeof p.hasPhone !== "boolean" || crewUi.hasPhone === p.hasPhone) return;
      crewUi.hasPhone = p.hasPhone;
      crewRedraw();
    });
  }
  function renderCrew() {
    if (!RIG.crew) {
      app.innerHTML = crewHead("crew") + '<div class="cw">' + cwMsg("The crew did not load. Open Rig Card once with a signal.", "no", "data-crew-msg") + "</div></div>" + tripBarHtml();
      return;
    }
    if (!RIG.crew.session()) {
      app.innerHTML = crewHead("crew") + signinHtml() + "</div>" + tripBarHtml();
      if (!crewQuiet) helloCheck();
      return;
    }
    app.innerHTML = crewHead("crew") + '<div class="cw">' + crewBodyHtml() + "</div></div>" + tripBarHtml();
    if (!crewQuiet) crewFetch();
  }

  // A tapped link. It only looks first: message previews load pages, and a
  // preview must not sign anyone in. Nothing is minted until the tap on Join.
  function renderJoin(token) {
    if (joinUi.token !== token) joinUi = { token: token, peek: null, asked: false, msg: null };
    var pk = joinUi.peek, body;
    if (!pk && RIG.crew && !RIG.crew.joinToken(token)) pk = joinUi.peek = { error: "That link is not complete.", dead: true };
    if (!RIG.crew) body = cwMsg("The crew did not load. Open Rig Card once with a signal.", "no", "data-join-msg");
    else if (!pk) body = cwMsg("Checking your link...", "", "data-join-msg");
    else if (pk.ok) {
      body = '<p class="cw-lead" data-join-who>' + esc((pk.by ? pk.by + " added you to " : "You were added to ") + pk.crew + ", " + pk.name + ".") + "</p>" +
        '<button class="cw-go" type="button" data-join-go>Join</button>' + cwSaid(joinUi.msg, "One tap and you are in. No password.", "data-join-msg");
    } else if (pk.dead) {
      body = '<p class="cw-lead" data-join-dead>' + esc(pk.status === 410 ? "That link is not good any more." : pk.error) + "</p>" +
        cwMsg("Ask Coach to text you a new link. If Coach added your phone number, you can sign in with that instead.", "", "") +
        '<a class="cw-plain" href="#/crew" data-join-signin>Sign in with my number</a>';
    } else {
      body = cwMsg(pk.offline ? "No signal. The link needs a signal the first time it is used." : pk.error || "That link could not be checked.", "no", "data-join-msg") +
        '<button class="cw-plain" type="button" data-join-retry>Try again</button>';
    }
    app.innerHTML = crewHead("join") + '<div class="cw">' + body + "</div></div>" + tripBarHtml();
    if (RIG.crew && !joinUi.peek && !joinUi.asked) {
      joinUi.asked = true;
      RIG.crew.join(token, { peek: true }).then(function (r) {
        if (joinUi.token !== token) return;
        joinUi.peek = r; joinUi.asked = false;
        crewRedraw();
      });
    }
  }
  function crewJoined() {
    crewUi = crewFresh(crewUi.sms); stepSave();
    joinUi = { token: null };
    // A link pasted on the way to a trip stays on that trip. Otherwise: the week.
    if (/^#\/?crew\/(new$|trip\/)/.test(location.hash || "")) crewRedraw(true);
    else location.hash = "#/trips";
  }

  // Every tap on a crew screen. Returns true when the tap was one of ours.
  function crewClick(t) {
    if (!t.closest('[data-view="crew"],[data-view="join"]') || !RIG.crew) return false;
    app.querySelectorAll("[data-keep]").forEach(function (el) { crewUi.vals[el.getAttribute("data-keep")] = el.value; });
    var v = crewUi.vals, hit;

    if (t.closest("[data-sendcode]")) {
      if (!RIG.crew.normalizePhone(v.phone)) { crewUi.msg = { t: "That does not look like a US phone number.", no: true }; crewRedraw(); return true; }
      cwOnce("code", function () {
        crewUi.msg = { t: "Sending..." }; crewRedraw();
        return RIG.crew.sendCode(v.phone).then(function (r) {
          // Told to wait means a code is already on its way: the person needs the code box, not the number box.
          if (r.ok) { crewUi.step = "code"; crewUi.msg = null; }
          else if (r.retryAfter) { crewUi.step = "code"; crewUi.msg = { t: "A code was already texted. Enter it here." }; }
          else { crewUi.step = "phone"; crewUi.msg = { t: r.error || "That code could not be sent. Check the number and try again.", no: true }; }
          stepSave();
          crewRedraw();
        });
      });
      return true;
    }
    if (t.closest("[data-backphone]")) { crewUi.step = "phone"; crewUi.msg = null; v.code = ""; stepSave(); crewRedraw(); return true; }
    if (t.closest("[data-verify]")) {
      if (!String(v.code || "").trim()) { crewUi.msg = { t: "Type the code from the text.", no: true }; crewRedraw(); return true; }
      cwOnce("verify", function () {
        crewUi.msg = { t: "Checking..." }; crewRedraw();
        return RIG.crew.verify(v.phone, v.code).then(function (r) {
          if (!r.ok) { crewUi.msg = { t: r.error || "That code did not work. Check it, or ask for a new one.", no: true }; crewRedraw(); return; }
          crewUi = crewFresh(crewUi.sms); stepSave();
          crewRedraw(true);
        });
      });
      return true;
    }
    if (t.closest("[data-join-send]")) {
      if (!RIG.crew.joinToken(v.paste || "")) { crewUi.joinMsg = { t: "That does not look like a crew link. Paste the whole text Coach sent you.", no: true }; crewRedraw(); return true; }
      cwOnce("join", function () {
        crewUi.joinMsg = { t: "Joining..." }; crewRedraw();
        return RIG.crew.join(v.paste).then(function (r) {
          if (r.ok) { crewJoined(); return; }
          crewUi.joinMsg = { t: r.offline ? "No signal. Try again when you have some." : r.error || "That did not go through. Try again.", no: true };
          crewRedraw();
        });
      });
      return true;
    }
    if (t.closest("[data-join-go]")) {
      cwOnce("join", function () {
        joinUi.msg = { t: "Joining..." }; crewRedraw();
        return RIG.crew.join(joinUi.token).then(function (r) {
          if (r.ok) { crewJoined(); return; }
          if (r.dead) joinUi.peek = r;
          else joinUi.msg = { t: r.offline ? "No signal. Try again when you have some." : r.error || "That did not go through. Try again.", no: true };
          crewRedraw();
        });
      });
      return true;
    }
    if (t.closest("[data-join-retry]")) { joinUi.peek = null; joinUi.msg = null; crewRedraw(); return true; }
    if (t.closest("[data-crew-retry]")) { crewUi.st = null; crewUi.sig = ""; crewRedraw(true); return true; }
    if (t.closest("[data-signout]")) {
      RIG.crew.signOut();
      crewUi = crewFresh(crewUi.sms); stepSave();
      crewRedraw(true);
      return true;
    }

    if (t.closest("[data-invite-send]")) {
      var name = String(v.invName || "").trim(), ph = String(v.invPhone || "").trim();
      if (!name) { crewUi.invMsg = { t: "They need a name.", no: true }; crewRedraw(); return true; }
      if (ph && !RIG.crew.normalizePhone(ph)) {
        crewUi.invMsg = { t: "That does not look like a US phone number. Leave it empty to add them without one.", no: true };
        crewRedraw(); return true;
      }
      cwOnce("invite", function () {
        crewUi.invMsg = { t: "Adding..." }; crewRedraw();
        return RIG.crew.invite(name, ph).then(function (r) {
          if (r && r.signedOut) { crewTake(r); return; }
          // Only a plain yes from the function counts. Anything else: say so, keep what was typed.
          if (!r || r.ok !== true) {
            var why = r && r.offline ? "No signal." : (r && r.error) || "That did not go through.";
            crewUi.invMsg = { t: /nobody was added/i.test(why) ? why : why + " Nobody was added.", no: true };
            crewRedraw();
            return;
          }
          v.invName = ""; v.invPhone = ""; crewUi.invMsg = null;
          crewUi.share = { kind: "invite", name: r.name || name, link: r.link || null, created: r.created };
          var st = crewUi.st;
          if (st && st.members && r.userId && !st.members.some(function (m) { return m.id === r.userId; })) {
            st.members = st.members.concat([{ id: r.userId, name: r.name || name, role: "member", alerts: false, signIn: r.signIn || (r.link ? "link" : "code") }]);
          }

    }
    if (t.closest("[data-share-copy]")) {
      var s = crewUi.share;
