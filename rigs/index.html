    var who = namesFor(t, "going"), d = isoDay(t.date);
    return '<a class="panel crewtrip" href="#/crew/trip/' + esc(t.id) + '" data-cw-trip="' + esc(t.id) + '">' +
      '<span class="datestamp" aria-hidden="true"><i>' + DAY3[d.getDay()] + "</i><b>" + d.getDate() + "</b></span>" +
      '<span class="tx"><span class="caprow"><em class="eyebrow">Crew trip</em>' + tagHtml(t, false) +
        (RIG.crew.isNew(t) ? '<span class="pill new cw-dot" data-cw-new>New</span>' : "") + "</span>" +
      "<b>" + esc(t.title) + "</b>" +
      '<span class="who">' + avsHtml(who) + '<span><span class="vh">' + esc(dayDate(t.date)) + ". </span>" +
        esc(who.length ? andList(who) + " going" : "Nobody yet") + "</span></span></span>" + IC.chev + "</a>";
  }
  // A trip that is over: a plain row behind Past trips.
  function crewTripRow(t) {
    var who = namesFor(t, "going"), over = t.date < todayIso();
    return '<a class="row" href="#/crew/trip/' + esc(t.id) + '" data-cw-trip="' + esc(t.id) + '">' +
      '<span class="tx"><b>' + esc(t.title) + "</b><span>" + esc(dayDate(t.date) + " · " + (who.length ? who.join(", ") : "Nobody yet")) + "</span></span>" +
      (RIG.crew.isNew(t) ? '<span class="dot cw-dot" data-cw-new role="img" aria-label="New"></span>' : "") + tagHtml(t, over) +
      IC.chev + "</a>";
  }
  // The group on the Trips tab comes in two parts: top is the trips still
  // ahead, each a card, between the call and the week. foot is the rows that
  // go with the crew row under the week: planning a new one, and past ones.
  function crewTripsHtml(st) {
    if (!st || !st.crew) return { top: "", foot: "" };
    var today = todayIso(), live = [], past = [];
    (st.trips || []).forEach(function (t) { (t.status !== "done" && t.date >= today ? live : past).push(t); });
    function soonest(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.from == null ? 99 : a.from) - (b.from == null ? 99 : b.from); }
    live.sort(soonest);
    past.sort(function (a, b) { return soonest(b, a); });
    return { top: '<section class="grp" data-cw-trips><h2 class="vh">Crew trips</h2>' + live.map(crewTripCard).join("") + "</section>",
      foot: '<a class="row" href="#/crew/new" data-cw-plan><span class="tx"><b>Plan a trip</b><span>Pick one and a day. The crew sees it.</span></span>' +
      IC.chev + "</a>" +
      (past.length ? '<button class="row cw-rowbtn" type="button" data-cw-past aria-expanded="' + (cwT.past ? "true" : "false") + '"><span class="tx"><b>Past trips</b><span>' +
        past.length + (past.length === 1 ? " trip" : " trips") + "</span></span>" + IC.chev + "</button>" +
        (cwT.past ? past.map(crewTripRow).join("") : "") : "") };
  }
  function crewTripsDraw() {
    var host = app.querySelector('[data-view="trips"] [data-cw-trips-slot]'), foot = app.querySelector('[data-view="trips"] [data-cw-foot-slot]');
    if (host) host.innerHTML = crewTripsHtml(crewSt()).top;
    if (foot) foot.innerHTML = crewRowHtml();
    // A row in the week says when the crew is on it. Redraw the week only
    // when one of those lines would change.
    if (host && lastPlan && app.querySelector("[data-week] [data-day]") && crewWeekSig(crewIn()) !== weekSig) drawTrips(lastPlan);
  }
  // The saved trips are on screen already. This asks for fresh ones.
  function crewTripsLoad() {
    if (!RIG.crew || !RIG.crew.session()) return;
    RIG.crew.state({ onFresh: crewTripsDraw }).then(crewTripsDraw);
  }

  // ---- the two buttons on a Hot Trip
  function hotCrewHtml(day, t) {
    var st = crewIn();
    if (!st) return "";
    var have = sameTrip(st, t.planId, day.iso);
    if (have) {
      var who = namesFor(have, "going");
      return '<div class="cw cw-make" data-cw-make><a class="gold cw-go" href="#/crew/trip/' + esc(have.id) + '" data-cw-open-trip>Open the crew trip</a>' +
        cwMsg((have.status === "planned" ? "It is on. " : have.status === "done" ? "Done. " : "Floated as an idea. ") + (who.length ? "Going: " + who.join(", ") + "." : ""), "", "data-cw-make-msg") + "</div>";
    }
    return '<div class="cw cw-make" data-cw-make>' + tellHtml("hot") + '<div class="pair"><button class="gold cw-go" type="button" data-cw-do="planned">We are doing this</button>' +
      '<button class="quiet" type="button" data-cw-do="idea">Float it</button></div>' +
      cwSaid(cwT.hotMsg, "Either one puts this trip in front of the crew.", "data-cw-make-msg") + "</div>";
  }
  function hotCrewSync() {
    var host = app.querySelector('[data-view="hot"] [data-cw-make-slot]'), f = host && findTrip(host.getAttribute("data-cw-key"));
    if (f) host.innerHTML = hotMainHtml(f.day, f.t);
  }
  function hotCrewLoad() {
    if (!RIG.crew || !RIG.crew.session()) return;
    RIG.crew.state({ onFresh: hotCrewSync }).then(hotCrewSync);
  }
  function hotCrewMake(key, status) {
    var f = findTrip(key), st = crewIn();
    if (!f || !st) return;
    var have = sameTrip(st, f.t.planId, f.day.iso);
    if (have) { location.hash = "#/crew/trip/" + have.id; return; }
    cwOnce("make", function () {
      cwT.hotMsg = { t: "Making it..." }; hotCrewSync();
      var t = f.t, here = location.hash, r2 = function (h) { return Math.round(h * 100) / 100; };
      return RIG.crew.createTrip(withTell({ planId: t.planId, spotId: t.spot, species: t.species, title: String(t.name).slice(0, 120), date: f.day.iso,
        from: r2(t.from), to: r2(t.to), status: status, seedList: seedOf(t.planId) }, "hot")).then(function (r) {
        // Still on the card they tapped: go to the new trip. Wandered off: leave them be.
        if (r && r.ok && r.trip) { cwT.hotMsg = null; if (location.hash === here) location.hash = "#/crew/trip/" + r.trip.id; return; }
        cwT.hotMsg = { t: r && r.offline ? "No signal. Making a trip needs one. Try again when you have some." : RIG.crew.say(r, "The trip could not be made. Try again."), no: true };
        hotCrewSync();
      });
    });
  }

  // ---- the forecast a crew page reads
  // The same saved forecast the week is built from. A crew page opened cold
  // asks for it once, and says so plainly until it lands.
  function tripDetail(trip) {
    if (!plannerReady() || !RIG.trips.detail) return null;
    var c = RIG.trips.cached();
    if (c && c.waters && cwT.watersAt !== c.at) { cwT.watersAt = c.at; RIG.trips.addWaters(c.waters); }
    return RIG.trips.detail({ planId: trip.planId, iso: trip.date, from: trip.from, to: trip.to,
      wx: c ? c.wx : {}, tides: c ? c.tides : {}, flow: c ? c.flow : {} });
  }
  // then() runs only when a newer forecast than the one on screen lands. One
  // ask at a time: a second caller just changes who hears about it.
  function wxLoad(then) {
    if (!plannerReady()) return;
    cwT.wxThen = then;
    if (cwT.wxBusy) return;
    var c = RIG.trips.cached(), had = c ? c.at : 0;
    cwT.wxBusy = true;
    RIG.trips.load().then(function (data) {
      cwT.wxBusy = false;
      if (data && data.at !== had && cwT.wxThen) cwT.wxThen();
    }, function () { cwT.wxBusy = false; /* no forecast: the line says so */ });
  }
  // The live go or no-go, in one plain line.
  function condHtml(trip, det) {
    if (!det || trip.status === "done") return "";
    var today = todayIso(), s = det.status, kind = "", text;
    if (trip.date < today) { s = "past"; text = "That day has passed."; }
    else if (s === "ok") {
      var heat = det.trip.heat, why = RIG.trips.whyLine(det.trip, 3);
      text = (heat === "Hot" ? "Hot" : heat === "Slow" ? "Go, but slow" : "Go") + (why ? ": " + lowerFirst(why) : ".");
      kind = heat === "Slow" ? "slow" : "go";
    } else if (s === "nogo") { text = "No-go: " + det.why + "."; kind = "no"; }
    else if (s === "dark") { text = "Dark by then. Sunset is " + clk(det.sunset) + ", and this one fishes in daylight."; kind = "warn"; }
    else if (s === "closed") {
      text = det.why ? "Off the list for now. " + String(det.why).replace(/[.\s]*$/, "") + "." : "Out of season on that day.";
      kind = "warn";
    } else if (s === "nodata") {
      if (trip.date > isoPlus(today, 6)) {
        var back = isoPlus(trip.date, -6), n = Math.round((isoDay(back) - isoDay(today)) / 864e5);
        text = "The forecast reaches 7 days out. Check back " + (n <= 1 ? "tomorrow" : n < 7 ? DAYFULL[isoDay(back).getDay()] : dayDate(back)) + ".";
      } else text = "No forecast for that day on this phone yet.";
    } else text = "The app has no plan for this one, so it cannot call the day.";
    return '<p class="cw-cond' + (kind ? " " + kind : "") + '" data-cw-cond data-status="' + s + '">' + esc(text) + "</p>";
  }

  // ---- planning a trip from scratch: #/crew/new
  function planOptions(iso, picked) {
    var groups = [], by = {};
    RIG.trips.plansOn(iso).forEach(function (p) {
      var sp = findSpecies(p.species), fish = sp ? sp.name : p.species;
      if (!by[fish]) { by[fish] = []; groups.push(fish); }
      by[fish].push(p);
    });
    return '<option value="">Pick a trip</option>' + groups.map(function (g) {
      return '<optgroup label="' + esc(g) + '">' + by[g].map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === picked ? " selected" : "") + ">" + esc(p.name) + "</option>";
      }).join("") + "</optgroup>";
    }).join("");
  }
  function planSig(iso) { return RIG.trips.plansOn(iso).map(function (p) { return p.id; }).join(","); }
  function newCondHtml() {
    var v = crewUi.vals;
    if (!v.newPlan || !/^\d{4}-\d\d-\d\d$/.test(v.newDate || "")) return "";
    var trip = { planId: v.newPlan, date: v.newDate, from: boxHour(v.newFrom), to: boxHour(v.newTo), status: "idea" };
    return condHtml(trip, tripDetail(trip));
  }
  // The parts of the form that follow the day and the pick, changed in place.
  // The whole screen is not redrawn: that would shut a date wheel mid-spin.
  function newSync() {
    var view = app.querySelector('[data-view="crewnew"]');
    if (!view) return;
    var v = crewUi.vals, sel = view.querySelector("[data-cw-what]"), slot = view.querySelector("[data-cw-cond-slot]"), msg = view.querySelector("[data-cw-new-msg]");
    if (sel) {
      var open = RIG.trips.plansOn(v.newDate || ""), lost = v.newPlan && !open.some(function (p) { return p.id === v.newPlan; }) ? planOf(v.newPlan) : null;
      if (lost) { v.newPlan = ""; cwT.newMsg = { t: lost.name + " is not in season on that day. Pick another.", no: true }; }
      // Only when the choices really changed: rebuilding a list under an open wheel shuts it.
      var sig = planSig(v.newDate || "");
      if (lost || sel.getAttribute("data-sig") !== sig) { sel.innerHTML = planOptions(v.newDate || "", v.newPlan || ""); sel.setAttribute("data-sig", sig); }
    }
    if (slot) slot.innerHTML = newCondHtml();
    [].forEach.call(view.querySelectorAll("[data-cw-pick]"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-cw-pick") === cwT.newStatus ? "true" : "false"); });
    if (msg) { msg.textContent = cwT.newMsg ? cwT.newMsg.t : ""; msg.className = "cw-msg" + (cwT.newMsg && cwT.newMsg.no ? " no" : ""); }
  }
  function renderCrewNew() {
    if (!crewGate()) return;
    var st = crewSt(), v = crewUi.vals, today = todayIso();
    var head = topHtml("trips", "crew") + '<div data-view="crewnew">' +
      headHtml("The crew", "Plan a trip", "Pick one and a day. The crew sees it.", { href: "#/trips", text: "Hot Trips" });
    if (cwT.nav) window.scrollTo(0, 0);
    if (!crewQuiet) wxLoad(newSync);
    if (!st || !st.crew) {
      app.innerHTML = head + '<div class="cw float">' + (st ? '<p class="cw-lead" data-nocrew>You are signed in, but you are not on a crew yet. Ask Coach to add you.</p>'
        : cwMsg(cwT.stErr || "Loading the crew...", cwT.stErr ? "no" : "", "data-cw-new-msg") +
          (cwT.stErr ? '<button class="cw-plain" type="button" data-cw-retry>Try again</button>' : "")) +
        (st ? '<a class="cw-plain" href="#/crew">The crew</a>' : "") + "</div></div>" + tripBarHtml();
      if (!crewQuiet && !st) crewStLoad();
      return;
    }
    if (!/^\d{4}-\d\d-\d\d$/.test(v.newDate || "")) v.newDate = today;
    if (!plannerReady() || !RIG.trips.plansOn) {
      app.innerHTML = head + '<div class="cw float">' + cwMsg("The trip planner did not load. Open Rig Card once with a signal.", "no", "data-cw-new-msg") + "</div></div>" + tripBarHtml();
      return;
    }
    app.innerHTML = head + '<div class="cw float">' +
      cwField("What", '<select data-cw-what data-keep="newPlan" data-sig="' + esc(planSig(v.newDate)) + '">' + planOptions(v.newDate, v.newPlan || "") + "</select>") +
      cwField("When", '<input data-cw-date data-keep="newDate" type="date" min="' + today + '" max="' + isoPlus(today, 60) + '" value="' + kv("newDate") + '">') +
      '<div class="cw-condslot" data-cw-cond-slot>' + newCondHtml() + "</div>" +
      '<div class="cw-two">' +
        cwField("From (optional)", '<input data-cw-from data-keep="newFrom" type="time" step="900" value="' + kv("newFrom") + '">') +
        cwField("To (optional)", '<input data-cw-to data-keep="newTo" type="time" step="900" value="' + kv("newTo") + '">') + "</div>" +
      '<div class="cw-seg" role="group" aria-label="How sure">' +
        '<button class="cw-pick" type="button" data-cw-pick="idea" aria-pressed="' + (cwT.newStatus === "idea" ? "true" : "false") + '">Just an idea</button>' +
        '<button class="cw-pick" type="button" data-cw-pick="planned" aria-pressed="' + (cwT.newStatus === "planned" ? "true" : "false") + '">It is on</button></div>' +
      cwField("A note (optional)", '<textarea data-cw-note data-keep="newNote" maxlength="280" placeholder="Meet at the pier at 5">' + kv("newNote") + "</textarea>") +
      tellHtml("new") + '<button class="gold cw-go" type="button" data-cw-create>Make the trip</button>' +
      cwSaid(cwT.newMsg, "", "data-cw-new-msg") + "</div></div>" + tripBarHtml();
  }
  // A trip is where a text or an alert lands, so it is often opened cold, on a
  // crew this phone saved hours ago. The Tell row and Who has it are drawn
  // from that, and a sender must not be choosing from yesterday's people: the
  // crew is asked for quietly, at most once a minute. The answer redraws the
  // trip through the one RIG.crew.onChange listener.
  function crewStFresh() {
    if (Date.now() - (cwT.stAt || 0) < 60e3) return;
    cwT.stAt = Date.now();
    RIG.crew.state({ fresh: true }).then(function (r) { if (!r || !r.me || r.stale) cwT.stAt = 0; });
  }
  // Nothing saved yet (a cold open straight onto a crew page): ask once.
  function crewStLoad() {
    cwT.stErr = "";
    RIG.crew.state().then(function (r) {
      if (r && !r.me && !r.signedOut) cwT.stErr = r.offline ? "No signal, and the crew is not saved on this phone yet." : r.error || "The crew could not be loaded. Try again in a minute.";
      crewRedraw();
    });
  }
  function newCreate() {
    var v = crewUi.vals, p = planOf(v.newPlan), today = todayIso(), from = boxHour(v.newFrom), to = boxHour(v.newTo);
    var note = String(v.newNote || "").trim(), bad = "";
    if (!p) bad = "Pick the trip first.";
    else if (!/^\d{4}-\d\d-\d\d$/.test(v.newDate || "") || v.newDate < today || v.newDate > isoPlus(today, 60)) bad = "Pick a day from today to " + dayDate(isoPlus(today, 60)) + ".";
    else if (!RIG.trips.plansOn(v.newDate).some(function (x) { return x.id === p.id; })) bad = p.name + " is not in season on that day. Pick another.";
    else if (from != null && to != null && !(to > from)) bad = "The end has to come after the start.";
    else if (note.length > 280) bad = "Keep the note to 280 characters.";
    if (bad) { cwT.newMsg = { t: bad, no: true }; newSync(); return; }
    cwOnce("create", function () {
      cwT.newMsg = { t: "Making it..." }; newSync();
      var here = location.hash;
      var body = { planId: p.id, spotId: p.spot, species: p.species, title: String(p.name).slice(0, 120), date: v.newDate, status: cwT.newStatus, seedList: seedOf(p.id) };
      if (from != null) body.from = from;
      if (to != null) body.to = to;
      if (note) body.note = note;
      return RIG.crew.createTrip(withTell(body, "new")).then(function (r) {
        if (r && r.ok && r.trip) {
          v.newPlan = ""; v.newDate = ""; v.newFrom = ""; v.newTo = ""; v.newNote = ""; cwT.newMsg = null; cwT.newStatus = "idea";
          if (location.hash === here) location.hash = "#/crew/trip/" + r.trip.id;
          return;
        }
        cwT.newMsg = { t: r && r.offline ? "No signal. Making a trip needs one. Try again when you have some." : RIG.crew.say(r, "The trip could not be made. Try again."), no: true };
        newSync();
      });
    });
  }

  // ---- notes, the list and catches on a trip
  // Three boxes on the trip page, each filled by one function. d is
  // { trip, comments, list, catches } as tripData gives it, with waiting
  // writes already laid over it. A trip seen only in the week (d.thin) has
  // none of the three saved yet, so nothing is drawn until the whole trip lands.
  //   cwNotesHtml(d, section, shown)   section is a run card section id, or "" for the whole trip.
  //                             shown (trip page only) lists the section ids the run card has
  //                             right now: a note pinned to one it has dropped joins the trip's own.
  //   cwListHtml(d)             the list, a summary on top, a box to add a line
  //   cwCatchesHtml(d)          catches and Log a fish, once the day has come
  function isOwner() { var st = crewSt(); return !!(st && st.crew && st.crew.role === "owner"); }
  // "Tue 4:12 PM", or "Nov 9, 4:12 PM" once the weekday alone would not say which.
  function noteTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var near = Math.abs(Date.now() - d.getTime()) < 6 * 864e5;
    return (near ? DAY3[d.getDay()] : MON3[d.getMonth()] + " " + d.getDate() + ",") + " " + clk(d.getHours() + d.getMinutes() / 60);
  }
  function oldestFirst(rows) {
    return rows.map(function (r, i) { return { r: r, i: i }; })
      .sort(function (a, b) { return ((Date.parse(a.r.at) || 0) - (Date.parse(b.r.at) || 0)) || a.i - b.i; })
      .map(function (x) { return x.r; });
  }
  function waitTag() { return '<span class="cw-wait" data-cw-wait>' + (tripUi.sending ? "Sending" : "Waiting to send") + "</span>"; }
  // Delete asks once, inside the page. The question takes the place of the
  // small Delete, and the real one sits a line lower, so a double tap on the
  // first can never land on the second.
  function askHtml(words, yesAttr) {
    return '<p class="cw-asks">' + words + '</p><div class="cw-acts2"><button class="cw-act no" type="button" ' + yesAttr + ">Delete</button>" +
      '<button class="cw-act" type="button" data-cw-ask-no>Keep</button></div>';
  }
  function focusKeep(key) {
    var el = app.querySelector('[data-keep="' + key + '"]');
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not that kind of box */ } }
  }

  // New notes on a section. rig.crewlook.v1 is { tripId: { section: the
  // newest note time this phone has looked at there } }. A run card row gets
  // a dot while it holds someone else's note newer than that, and opening
  // the section is the look. A person's own note never raises one.
  var LOOK_KEY = "rig.crewlook.v1";
  function lookAll() {
    try { var m = JSON.parse(localStorage.getItem(LOOK_KEY) || "{}"); return m && typeof m === "object" ? m : {}; } catch (e) { return {}; }
  }
  function lookNew(tripId, sec, d) {
    var seen = Date.parse((lookAll()[tripId] || {})[sec] || "") || 0;
    return (d.comments || []).some(function (c) { return c.section === sec && !c.mine && !c.waiting && Date.parse(c.at) > seen; });
  }
  function lookMark(tripId, sec, d) {
    var newest = 0, at = "";
    (d.comments || []).forEach(function (c) {
      var when = c.section === sec && !c.waiting ? Date.parse(c.at) : 0;
      if (when > newest) { newest = when; at = c.at; }
    });
    var all = lookAll(), mine = all[tripId] || {};
    if (!at || Date.parse(mine[sec] || "") >= newest) return;
    mine[sec] = at;
    // Trips that have left the week need no memory.
    var st = crewSt(), live = {};
    if (st && st.trips && st.trips.length) {
      st.trips.forEach(function (t) { live[t.id] = true; });
      Object.keys(all).forEach(function (k) { if (!live[k]) delete all[k]; });
    }
    all[tripId] = mine;
    try { localStorage.setItem(LOOK_KEY, JSON.stringify(all)); } catch (e) { /* private mode: this visit only */ }
  }

  // The run card's parts by name, for a note whose part is not on the card
  // today (the weather and the river only show while the forecast reaches).
  var SEC_NAMES = { plan: "The plan", what: "What it is", gear: "Gear", bait: "Bait and lures", how: "How", wx: "Tide and weather",
    river: "River flow", spot: "The spot", expect: "What to expect", rules: "Rules" };
  function cwNotesHtml(d, section, shown) {
    if (d.thin) return "";
    var sec = section || "", owner = isOwner(), key = "t.note." + (sec || "trip");
    var mine = oldestFirst((d.comments || []).filter(function (c) {
      return (c.section || "") === sec || (!sec && shown && c.section && shown.indexOf(c.section) === -1);
    }));
    var notes = mine.map(function (c) {
      var id = esc(c.id), part = !sec && c.section ? SEC_NAMES[c.section] || "" : "";
      return '<li class="cw-note" data-cw-note="' + id + '"' + (c.waiting ? " data-waiting" : "") + ">" +
        '<p class="cw-note-h"><b data-cw-note-who>' + esc(c.by ? firstName(c.by.name) : "Someone") + "</b>" +
        '<span data-cw-note-at>' + esc(noteTime(c.at)) + "</span>" + (part ? '<span data-cw-note-part>' + esc(part) + "</span>" : "") +
        (c.waiting ? waitTag() : "") + "</p>" +
        '<p class="cw-note-b" data-cw-note-body>' + esc(c.body) + "</p>" +

  // "7 of 12 packed. Russell has 3, Coach has 4, 5 nobody."

  // Catch photos with no signal. A photo that has been on this screen is
  // kept on the phone (the browser's own cache store, the newest PHOTO_KEEP
  // of them), so a catch that was seen still has its picture at the pier.
  var PHOTO_BOX = "rigphotos-v1", PHOTO_KEEP = 60, photoLocal = {}, photoAsked = {};
  function photoBox() {
    try { return window.caches ? window.caches.open(PHOTO_BOX).then(null, function () { return null; }) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); }
  }
  function photoSrc(url) { return photoLocal[url] || url; }
  function photoKeep(url) {
    if (!/^https:\/\//.test(url || "") || photoAsked[url]) return;
    photoAsked[url] = true;
    photoBox().then(function (box) {
      if (!box) return null;
      return box.match(url).then(function (hit) {
        if (hit) return null;
        return fetch(url, { mode: "cors", credentials: "omit" }).then(function (res) {
          if (!res.ok) return null;
          return box.put(url, res).then(function () { return box.keys(); }).then(function (keys) {
            return Promise.all(keys.slice(0, Math.max(0, keys.length - PHOTO_KEEP)).map(function (k) { return box.delete(k); }));
          });
        });
      });
      // One try for each photo on each visit: a store that will not hand it
      // over is not asked again every time the screen is redrawn.
    }).then(null, function () { /* not kept this time */ });
  }
  // The phone's own copy of a photo, as an address an <img> can show, or "".
  function photoSaved(url) {
    if (photoLocal[url]) return Promise.resolve(photoLocal[url]);
    return photoBox().then(function (box) { return box ? box.match(url) : null; })
      .then(function (hit) { return hit ? hit.blob() : null; })
      .then(function (b) { if (b) photoLocal[url] = URL.createObjectURL(b); return photoLocal[url] || ""; }, function () { return ""; });
  }
  function photoMiss(img) {
    var b = img.closest("[data-cw-photo]");
    img.hidden = true;
    if (b) { b.setAttribute("data-nophoto", ""); b.setAttribute("aria-label", "This photo needs a signal"); }
  }
  // Neither load nor error bubbles, so both are caught on the way down.
  app.addEventListener("load", function (e) {
    var img = e.target;
    if (img && img.matches && img.matches("img[data-cw-img]")) photoKeep(img.getAttribute("data-cw-img"));
  }, true);
  app.addEventListener("error", function (e) {
    var img = e.target;
    if (!img || !img.matches || !img.matches("img[data-cw-img]")) return;
    if (img.getAttribute("data-tried")) { photoMiss(img); return; }
    img.setAttribute("data-tried", "1");
    photoSaved(img.getAttribute("data-cw-img")).then(function (local) {
      if (!img.isConnected) return;
      if (local && img.getAttribute("src") !== local) img.src = local; else photoMiss(img);
    });
  }, true);

  function sizeWords(c) {

  // One write from the trip page. While any is on its way the waiting tags

  // but signed out, and the screen is redrawn after it.
  function tripWrite(id, start, done) {
    tripUi.sending++;
    return start().then(function (r) {
      if (tripUi.id !== id) return;
      tripUi.sending = Math.max(0, tripUi.sending - 1);

  }
  function noteAdd(id, sec) {

    var tell = tellIds("note");
    v[key] = ""; tripUi.nMsg = null;
    tripWrite(id, function () { return RIG.crew.addComment(id, sec || null, words, tell ? { tell: tell } : null); }, function (r) {
      // Refused: the words go back in the box, with the reason.

    });

  }

  // The Log a fish form.
  function catchPhoto(file) {
    if (tripUi.photoUrl) { try { URL.revokeObjectURL(tripUi.photoUrl); } catch (e) { /* gone already */ } }
    tripUi.photo = file || null; tripUi.photoUrl = "";

  }
  function catchFormShut(clear) {
    tripUi.cOpen = false;
    if (!clear) return;
    ["t.species", "t.len", "t.wt", "t.lure", "t.cnote"].forEach(function (k) { delete crewUi.vals[k]; });
    catchPhoto(null);
  }
  // "" is nothing typed (null), "14" is 14, "1,5" is 1.5, anything else is not a number (NaN).
  function numBox(text) {
    var s = String(text == null ? "" : text).trim().replace(",", ".");
    if (!s) return null;
    return /^(\d+\.?\d*|\.\d+)$/.test(s) && Number(s) > 0 ? Number(s) : NaN;
  }
  function catchSave(id, trip) {
    if (tripUi.cBusy) return;
    var v = crewUi.vals, species = String(v["t.species"] || "").trim(), len = numBox(v["t.len"]), wt = numBox(v["t.wt"]), bad = "";
    if (!species) bad = "Which fish was it?";
    else if (len !== null && isNaN(len)) bad = "Length is a number, in inches. Or leave it empty.";
    else if (wt !== null && isNaN(wt)) bad = "Weight is a number, in pounds. Or leave it empty.";
    if (bad) { tripUi.cMsg = { t: bad, no: true }; crewRedraw(); return; }
    var spot = findSpot(trip.spotId), had = {}, kept = false, tell = tellIds("catch");
    ((tripData(id) || {}).catches || []).forEach(function (c) { had[c.id] = true; });
    var fields = { species: species, lengthIn: len, weightLb: wt, lure: v["t.lure"] || "", notes: v["t.cnote"] || "", spotName: spot ? spot.name : trip.title };
    if (tripUi.photo) fields.photo = tripUi.photo;
    tripUi.cBusy = true; tripUi.cMsg = { t: "Saving..." }; crewRedraw();
    // The moment the phone itself holds the catch the form's work is done:
    // the row is in the list with its photo, and sending is the queue's job.
    var stop = RIG.crew.onChange(function (w) {
      if (kept || !w || w.kind !== "queue" || w.tripId !== id || tripUi.id !== id) return;
      var now = tripData(id);
      if (!now || !(now.catches || []).some(function (c) { return c.waiting && !had[c.id]; })) return;
      kept = true; tripUi.cBusy = false; tripUi.cMsg = null;

  // The trip as this phone knows it, with waiting writes laid over it. A trip
  // seen only in the week has no notes, list or catches saved yet.
  function tripData(id) {
    var full = RIG.crew.cachedTrip(id), st = RIG.crew.cached();

    if (!full) return row ? { trip: row, comments: [], list: [], catches: [], thin: true } : null;

    allCards().forEach(function (c) { byId[c.id] = c; });
    // A content edit can delete a card a saved trip still points at. Drop it
    // quietly rather than rendering a hole or throwing.
    var cards = state.cards.map(function (id) { return byId[id]; }).filter(Boolean);
    setScene(fieldScene(cards));
    app.innerHTML =
      '<div data-view="field" class="fieldmode">' +
        heroHtml({ title: "This trip", chips:
          '<button class="chip back" type="button" data-mode-library>' + IC.back + "<span>Library</span></button>" +
          '<span class="chip" data-trip-count>' + cards.length + (cards.length === 1 ? " card" : " cards") + "</span>" +
          '<input class="tripdate" type="date" data-trip-date value="' + esc(state.date) + '" aria-label="Trip date">' }) +
        noticeHtml() +
        (cards.length
          ? cards.map(function (c) { return cardHtml(c, { addable: false }); }).join("")
          : '<div class="well"><p>Nothing in this trip yet. Go back to the library and add cards.</p></div>') +
      "</div>";
  }

  RIG.go = function (speciesId, locationId, cardId) {
    var h = speciesId ? "#/" + speciesId + (locationId ? "/" + locationId : "") +
      (cardId ? "/" + cardId : "") : "#/";
    if (location.hash === h) render();
    else location.hash = h;
  };

  // Knot step players. Cards are re-rendered as plain HTML, so the players
  // are wired after every render. data-ready stops a second rail stacking up.
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function initTyers(root) {
    [].forEach.call(root.querySelectorAll(".tyer"), function (fig) {
      if (fig.dataset.ready) return;
      var steps = [].slice.call(fig.querySelectorAll(".kstep"));
      var rail = fig.querySelector(".rail"), cap = fig.querySelector(".cap"), play = fig.querySelector(".play");
      if (!steps.length || !rail || !cap || !play) return;
      fig.dataset.ready = "1";
      var cur = 0, timer = null;
      steps.forEach(function (g) {
        [].forEach.call(g.querySelectorAll(".draw"), function (p) {
          try { p.style.setProperty("--len", Math.ceil(p.getTotalLength()) + 4); }
          catch (e) { p.classList.remove("draw"); }
        });
      });
      var btns = steps.map(function (g, i) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = i + 1;
        b.setAttribute("aria-label", "Step " + (i + 1) + " of " + steps.length);
        b.addEventListener("click", function () { stop(); go(i); });
        rail.appendChild(b); return b;
      });
      function go(i) {
        cur = i;
        steps.forEach(function (g, k) { g.classList.toggle("on", k === i); });
        btns.forEach(function (b, k) {
          b.setAttribute("aria-current", k === i ? "true" : "false");
          b.classList.toggle("done", k < i);
        });
        cap.innerHTML = "<b>" + (i + 1) + ".</b> " + (steps[i].dataset.cap || "");
      }
      function stop() { if (timer) { clearTimeout(timer); timer = null; } play.textContent = "Play"; }
      function run() {
        if (cur >= steps.length - 1) go(0);
        play.textContent = "Stop";
        timer = setTimeout(function tick() {
          if (!fig.isConnected) { timer = null; return; }
          if (cur < steps.length - 1) { go(cur + 1); timer = setTimeout(tick, reduce ? 900 : 1900); }
          else stop();
        }, reduce ? 900 : 1500);
      }
      play.addEventListener("click", function () { if (timer) stop(); else run(); });
      go(0);
    });
  }

  // ---- the sky: the screen is the light Coach is standing in -------------
  // Sunrise, sunset, cloud cover and rain come from the forecast the week is
  // already built from, so this costs no extra call. "auto" follows the sky;
  // "light" and "dark" hold it when the glare on the water says otherwise.
  var SKY_KEY = "rig.skymode.v1";
  function skyMode() {
    try { var v = localStorage.getItem(SKY_KEY); return v === "light" || v === "dark" ? v : "auto"; } catch (e) { return "auto"; }
  }
  function setSkyMode(v) { try { localStorage.setItem(SKY_KEY, v); } catch (e) { /* private mode: this visit only */ } }
  // Today's sun and cloud at the water, from the cached forecast.
  function skyNow() {
    var n = new Date(), h = n.getHours() + n.getMinutes() / 60;
    var iso = n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
    var c = RIG.trips && RIG.trips.cached && RIG.trips.cached();
    var w = c && c.wx && (c.wx.redondo || c.wx[Object.keys(c.wx)[0]]);
    var sun = (w && w.sun && w.sun[iso]) || null;
    var hr = null;
    if (w && w.hours) {
      var want = iso + "T" + ("0" + Math.floor(h)).slice(-2);
      for (var i = 0; i < w.hours.length; i++) if (w.hours[i].t.slice(0, 13) === want) { hr = w.hours[i]; break; }
    }
    return { h: h, sun: sun, wx: { clouds: hr && hr.clouds != null ? hr.clouds : 80, rain: (hr && hr.rain) || 0 } };
  }
  function applySky() {
    if (!RIG.sky) return;
    var mode = skyMode(), s = skyNow();
    var r = RIG.sky.resolve(s.h, s.sun, s.wx, mode);
    RIG.sky.apply(document.documentElement, r);
    if (RIG.water) RIG.water.dress(document.documentElement, r.p);
    // The top of the page is sky now, so that is the colour the phone's own
    // bar takes.
    var theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute("content", r.p.sky[0]);
    app.querySelectorAll("[data-skymode]").forEach(function (b) {
      b.setAttribute("data-held", mode === "auto" ? "no" : "yes");
      b.setAttribute("aria-label", mode === "auto" ? "Screen follows the sky. Tap to hold it light."
        : mode === "light" ? "Screen held light. Tap to hold it dark." : "Screen held dark. Tap to follow the sky.");
      var l = b.querySelector("[data-skylabel]");
      if (l) l.textContent = mode === "auto" ? "Sky" : mode === "light" ? "Light" : "Dark";
    });
    var w = skyWords();
    app.querySelectorAll("[data-skyname]").forEach(function (el) { el.textContent = w.name; });
    app.querySelectorAll("[data-sunset]").forEach(function (el) { el.textContent = w.sunset; });
  }

  // When the screen was last drawn, and for which day. The installed app is
  // suspended, not reloaded, when Coach switches away from it, so coming
  // back the next morning would otherwise leave yesterday's trips on screen.
  var drawnDay = "", drawnAt = 0;
  function todayIso() {
    var n = new Date();
    return n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
  }
  function refreshIfStale() {
    if (document.visibilityState === "hidden") return;
    // Same day and still fresh: nothing to redraw, but the sun may have set
    // while the phone was in a pocket, so the sky is checked every time.
    if (drawnDay === todayIso() && Date.now() - drawnAt < 3 * 3600e3) { applySky(); return; }
    render();
    checkRules();
  }

  // Once the page has moved, the dock keeps a band of sky behind it (kit.css
  // reads data-scrolled), so what scrolls past goes behind it.
  var movedOn = false;
  function markMoved() {
    var on = (window.scrollY || document.documentElement.scrollTop || 0) > 6;
    if (on !== movedOn) { movedOn = on; document.documentElement.toggleAttribute("data-scrolled", on); }
  }
  window.addEventListener("scroll", markMoved, { passive: true });

  function render() {
    drawnDay = todayIso(); drawnAt = Date.now();
    renderView();
    applySky();
    fillRules();
    initTyers(app);
    var top = app.querySelector(".top");
    if (top) document.documentElement.style.setProperty("--toph", (top.offsetHeight + 8) + "px");
    // A screen that opens on a heading, not a card: the heading gets glass
    // under it and the title gives up some sky (see .sect.lead in the styles).
    var hero = app.querySelector("[data-view] > .hero"), el = hero && hero.nextElementSibling;
    while (el && !el.offsetHeight) el = el.nextElementSibling;
    var h = el && el.matches(".grp") ? el.querySelector(":scope > h2.sect") : null;
    if (h) { h.classList.add("lead"); hero.classList.add("tight"); }
    // The open filter chip is scrolled into view, not left off the edge.
    var cur = app.querySelector('.jump [aria-current="true"]');
    if (cur) cur.parentNode.scrollLeft = cur.offsetLeft - (cur.parentNode.clientWidth - cur.offsetWidth) / 2;
    markMoved();
  }

  function renderView() {
    if (mode() === "field") { renderField(); return; }
    var parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);

    if (parts[0] === "learn") {
      var fc = parts[1] && fundamentals().filter(function (c) { return c.id === parts[1]; })[0];
      if (fc) {
        var sec = fc.section ? fc.section.toLowerCase() : "";
        renderCard({ tab: "learn", active: sec, card: fc,
          list: fundamentals().filter(function (c) { return c.section === fc.section; }),
          hrefFor: function (c) { return "#/learn/" + c.id; },
          upHref: "#/learn" + (sec ? "/" + sec : ""), upText: fc.section || "Learn" });
      } else renderLearn(parts[1]);
      return;
    }
    // The bare url opens on Hot Trips: the week first, the library a tap away.
    if (!parts.length) { renderTrips(); return; }
    if (parts[0] === "trips" && parts[1] === "map") { renderMap(); return; }
    if (parts[0] === "join") { renderJoin(parts[1] || ""); return; }
    if (parts[0] === "crew" && parts[1] === "new") { renderCrewNew(); return; }
    if (parts[0] === "crew" && parts[1] === "trip" && parts[2]) { renderCrewTrip(decodeURIComponent(parts[2]), parts[3] || ""); return; }
    if (parts[0] === "crew") { renderCrew(); return; }
    if (parts[0] === "trips") { if (parts[1]) renderHot(decodeURIComponent(parts[1]), parts[2]); else renderTrips(); return; }
    if (parts[0] === "fish") { renderFish(); return; }
    if (parts[0] === "water") {
      var t = findType(parts[1]);
      if (t && spotsOfType(t.id).length) renderWater(t); else renderHome();
      return;
    }
    if (parts[0] === "spot") {
      var s = findSpot(parts[1]);
      if (!s) { renderHome(); return; }
      var at = speciesAt(s.id);
      // One fish at this spot: a menu of one is a wasted tap.
      if (at.length === 1) { location.replace("#/" + at[0].id + "/" + s.id); return; }
      renderSpot(s);
      return;
    }

    // Old links from when salmon was one tab land on coho, its closest heir.
    if (parts[0] === "salmon") { location.replace("#/" + ["coho"].concat(parts.slice(1)).join("/")); return; }
    var sp = parts[0] ? findSpecies(parts[0]) : null;
    if (!sp) { renderHome(); return; }
    var loc = findLocation(sp, parts[1]);
    var list = ordered(cardsFor(sp, loc));
    var card = parts[2] && list.filter(function (c) { return c.id === parts[2]; })[0];
    if (card) {
      var base = speciesBase(sp, loc);
      renderCard({ tab: "fish", active: sp.id, card: card, list: list,
        rules: card.dated && loc ? { spot: loc.id, species: sp.id, since: card.dated } : null,
        hrefFor: function (c) { return base + "/" + c.id; },
        upHref: base, upText: sp.name + (loc ? " \u00b7 " + loc.name : "") });
      return;
    }
    renderSpecies(sp, loc);
  }

  // A double tap. The first tap redrew the screen, and the second lands on
  // the same spot a moment later.
  //   "slid"    a different control is under the thumb now (a new line pushed
  //             Add down, a Delete turned into its question). On a crew trip
  //             that tap is dropped: it was never meant for what it hit.
  //   "repeat"  the same control again. cwT.repeat says so, and the handlers
  //             where once is enough (add, tick, who has it) let it go by.
  var lastTap = null;
  function tapSig(t) {
    var c = t.closest("button,a,input,textarea,select,label");
    return c ? c.tagName + "|" + Object.keys(c.dataset).sort().map(function (k) { return k + "=" + c.dataset[k]; }).join("|") : "";
  }
  function tapKind(e) {
    // A label passes its tap on to the file box inside it. That is one tap.
    if (e.target.matches && e.target.matches('input[type="file"]')) return "";
    var was = lastTap, now = { at: e.timeStamp, x: e.clientX, y: e.clientY, sig: tapSig(e.target) };
    var again = !!(was && e.detail && now.at - was.at < 400 && Math.abs(now.x - was.x) < 12 && Math.abs(now.y - was.y) < 12);
    // A dropped tap does not move the mark: a third tap is still measured from the first.
    if (again && now.sig !== was.sig) return "slid";
    lastTap = now;
    return again ? "repeat" : "";
  }

  app.addEventListener("click", function (e) {
    var t = e.target;
    var tap = tapKind(e);
    cwT.repeat = tap === "repeat";
    if (tap === "slid" && t.closest('[data-view="crewtrip"]')) { e.preventDefault(); return; }
    var addBtn = t.closest("[data-addtrip]");
    if (addBtn) { RIG.trip.toggle(addBtn.dataset.addtrip); return; }
    if (t.closest("[data-mode-field]")) { setMode("field"); return; }
    if (crewClick(t)) return;
    if (tripsClick(t)) return;
    // A crew trip screen owns every tap inside it. Its section and edit pages
    // carry data-sec, which further down means "open that part of Learn": a
    // tap into a box there used to leave the page.
    if (t.closest('[data-view="crewnew"],[data-view="crewtrip"]')) return;
    var sm = t.closest("[data-skymode]");
    if (sm) {
      var next = { auto: "light", light: "dark", dark: "auto" }[skyMode()];
      setSkyMode(next); applySky(); return;
    }
    if (t.closest("[data-refresh]")) { renderTrips(true); checkRules(); return; }
    var ak = t.closest("[data-ack]");
    if (ak) { RIG.rules.ack(ak.dataset.ack); fillRules(); return; }
    if (t.closest("[data-mode-library]")) { setMode("library"); return; }
    var tab = t.closest("[data-tab]");
    if (tab) { location.hash = { trips: "#/trips", water: "#/water", fish: "#/fish", learn: "#/learn" }[tab.dataset.tab]; return; }
    var ty = t.closest("[data-type]");
    if (ty) { location.hash = "#/water/" + ty.dataset.type; return; }
    var sc = t.closest("[data-sec]");
    if (sc) { location.hash = "#/learn/" + sc.dataset.sec; return; }
    var tm = t.closest("[data-tmode]");
    if (tm) { location.hash = tm.dataset.tmode === "map" ? "#/trips/map" : "#/trips"; return; }
    var md = t.closest("[data-mapday]");
    if (md) { mapDay = md.dataset.mapday; if (lastPlan) drawMap(lastPlan); return; }
    var pick = t.closest("[data-species]");
    if (pick) { RIG.go(pick.dataset.species); return; }
    var loc = t.closest("[data-loc]");
    if (loc) {
      RIG.go((location.hash || "").replace(/^#\/?/, "").split("/")[0], loc.dataset.loc);
      return;
    }
    if (t.closest("[data-back]")) RIG.go(null);
  });

  app.addEventListener("change", function (e) {
    var d = e.target.closest("[data-trip-date]");
    if (d) RIG.trip.setDate(d.value);
    // Log a fish: the photo that was picked shows small, before anything is sent.
    var ph = e.target.closest("[data-cw-catch-photo]");
    if (ph) { catchPhoto(ph.files && ph.files[0]); tripUi.cMsg = null; crewRedraw(); }
    // Alerts: a new quiet hour is saved as it is picked.
    var qh = e.target.closest("[data-al-quiet-from],[data-al-quiet-to]");
    if (qh && crewUi.al.got) {
      var quiet = {};
      quiet[qh.hasAttribute("data-al-quiet-from") ? "quietFrom" : "quietTo"] = Number(qh.value);
      alSave(quiet, "quiet");
    }
    // Planning a trip: the list of plans and the conditions line follow the
    // day, the pick and the window.
    var f = e.target.closest('[data-view="crewnew"] [data-keep]');
    if (f) {
      crewUi.vals[f.getAttribute("data-keep")] = f.value;
      if (f.matches("[data-cw-what]")) cwT.newMsg = null;
      if (f.matches("[data-cw-what],[data-cw-date],[data-cw-from],[data-cw-to]")) newSync();
    }
  });
  // What is typed into a crew box is remembered, so a redraw never eats it.
  app.addEventListener("input", function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute("data-keep");
    if (k) crewUi.vals[k] = e.target.value;
  });
  // Go on the phone keyboard presses the button the box belongs to.
  app.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && tripUi.big) { tripUi.big = ""; crewRedraw(); return; }
    if (e.key !== "Enter" || !e.target || !e.target.getAttribute) return;
    var press = e.target.getAttribute("data-enter"), btn = press && app.querySelector("[" + press + "]");
    if (btn) { e.preventDefault(); btn.click(); }
  });

  // Back from the app switcher, or the phone woke up: redraw if the day
  // turned or the forecast has aged out. Both events fire on iOS.
  document.addEventListener("visibilitychange", refreshIfStale);
  window.addEventListener("pageshow", refreshIfStale);

  window.addEventListener("hashchange", function () {
    // A card in a trip can link into the library, and squid-gear links into
    // the rod course. In field mode the hash changed and nothing rendered, so
    // the link read as broken. Follow it, but do NOT persist the switch:
    // leaving field mode to read something must not cost the pier default,
    // and the trip bar is already the way back.
    var h = (location.hash || "").replace(/^#\/?/, "");
    if (activeMode === "field" && h) activeMode = "library";
    cwT.nav = true;
    cwT.tell = {};
    try { render(); } finally { cwT.nav = false; }
  });

  load();
  resolveMode();
  render();
  cwT.nav = false;
  applySky();
  // The sky moves while the app is open: dusk arrives without a tap.
  setInterval(applySky, 10 * 60e3);
  // Background rule check on every load. The page never waits for it.
  checkRules();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/rigs/sw.js", { scope: "/rigs/" })
        .catch(function (e) { console.warn("rigs: service worker did not register", e); });
      // coachpilot.org/rigs with no slash is outside that scope, so with no
      // signal it would be the browser's error page. A second, tiny
      // registration catches that one address and hands it to /rigs/. It
      // needs the server to allow the wider scope (Service-Worker-Allowed);
      // where it does not, this fails quietly and nothing else changes.
      navigator.serviceWorker.register("/rigs/sw.js", { scope: "/rigs" }).catch(function () { /* not allowed here */ });
    });
    // A tapped alert asks the open app to go to its trip.
    navigator.serviceWorker.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type !== "rig-open" || typeof d.url !== "string") return;
      try { var u = new URL(d.url, location.href); if (u.origin === location.origin && u.hash) location.hash = u.hash; } catch (x) { /* not a link */ }
    });
  }
})();
</script>
</body>
</html>
