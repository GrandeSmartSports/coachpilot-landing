<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Field Command - Coach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230e3b2e'/><path d='M50 22 L78 50 L50 78 L22 50 Z' fill='%23f4f1e8'/><path d='M50 34 L66 50 L50 66 L34 50 Z' fill='%23c96f2f'/></svg>" />
<link rel="manifest" href="/fields/app/manifest.webmanifest" />
<meta name="theme-color" content="#0e3b2e" />
<link rel="apple-touch-icon" href="/fields/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="/fields/flm-rules.js"></script>
<style>
  :root {
    --pine: #0e3b2e; --pine-2: #14523f; --grass: #2d6a4f; --chalk: #f4f1e8; --chalk-2: #ece8db;
    --clay: #c96f2f; --clay-dark: #a8571d;
    --ink: #1c2420; --muted: #6d7a72; --line: #dcd8ca; --white: #ffffff;
    --shadow: 0 8px 26px rgba(14, 59, 46, 0.10);
    --disp: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--chalk); color: var(--ink); height: 100%; }
  body { font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  h1, h2, h3 { font-family: var(--disp); text-transform: uppercase; }

  header.top { background: linear-gradient(160deg, var(--pine) 0%, var(--pine-2) 100%); color: var(--chalk); padding: 16px 16px 12px; position: sticky; top: 0; z-index: 10; }
  header.top .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header.top h1 { font-weight: 700; font-size: 22px; letter-spacing: 0.03em; }
  header.top .sub { font-family: var(--disp); font-weight: 500; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #b7cfc2; }
  .chalkline { height: 5px; background: repeating-linear-gradient(90deg, var(--clay) 0 36px, var(--chalk) 36px 46px); }
  .signout { background: rgba(244,241,232,0.14); border: 1px solid rgba(244,241,232,0.3); color: var(--chalk); border-radius: 18px; padding: 7px 13px; font-family: var(--disp); font-weight: 600; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 100px; min-height: calc(100vh - 160px); }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; background: var(--pine); color: var(--chalk); border: none; border-radius: 12px; padding: 14px 18px; width: 100%; box-shadow: var(--shadow); }
  .btn.clay { background: var(--clay); }
  .btn.ghost { background: var(--white); color: var(--pine); border: 2px solid var(--pine); }
  .btn.quiet { background: transparent; color: var(--muted); box-shadow: none; border: 1px solid var(--line); }
  .btn.sm { font-size: 14px; padding: 10px 14px; width: auto; }
  .btn[disabled] { opacity: 0.55; }
  .btnrow { display: flex; gap: 10px; margin-top: 10px; }
  .btnrow .btn { flex: 1; }
  .linkbtn { background: none; border: none; color: var(--grass); text-decoration: underline; font-size: 14px; padding: 6px 0; }

  /* ---------- cards ---------- */
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 19px; letter-spacing: 0.03em; margin-bottom: 8px; }
  .card .hint { font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
  .err { background: #fdefe9; border: 1px solid #f2c9b4; color: #a8571d; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 8px 0; }
  .ok { background: #ecf5ef; border: 1px solid #bfdccb; color: #1e5138; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 8px 0; }
  .hidden { display: none !important; }

  /* ---------- sign-in ---------- */
  .signwrap { max-width: 420px; margin: 40px auto 0; padding: 0 6px; }
  .signwrap .diamond { width: 52px; height: 52px; margin: 0 auto 14px; display: block; }
  .signwrap h1 { text-align: center; font-size: 26px; margin-bottom: 4px; }
  .signwrap .lede { text-align: center; color: var(--muted); font-size: 14.5px; margin-bottom: 18px; }
  label.flabel { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin: 10px 0 5px; }
  input.finput { width: 100%; font-size: 17px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; }
  input.finput:focus { outline: none; border-color: var(--clay); box-shadow: 0 0 0 3px rgba(201,111,47,0.18); }
  input.pin { letter-spacing: 0.5em; text-align: center; font-weight: 700; }

  /* ---------- booking windows (day/time pills) ---------- */
  .fieldblock { margin-bottom: 14px; }
  .fieldblock .fname { font-family: var(--disp); font-weight: 700; font-size: 16.5px; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 7px; }
  .pillgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pill { border-radius: 11px; padding: 12px 10px; font-size: 14px; font-weight: 600; text-align: center; border: 1.5px dashed #cfcaba; color: var(--muted); }
  .pill.open { border-style: solid; border-color: var(--grass); color: var(--grass); background: #ecf5ef; }
  .pill.mine { border-style: solid; border-color: var(--clay); background: #fdf3ea; color: var(--clay-dark); }
  .pill.taken { background: #f4f2eb; color: #a39d8c; border-color: #e2ded0; }
  .pill.pending { background: #f4f2eb; color: #a39d8c; border-color: #e2ded0; font-style: italic; }
  .pill small { display: block; font-weight: 500; font-size: 11px; margin-top: 2px; }

  /* ---------- week / alerts rows ---------- */
  .weekrow { border-top: 1px solid var(--chalk-2); padding: 12px 0; }
  .weekrow:first-child { border-top: none; padding-top: 0; }
  .weekrow .wr-when { font-family: var(--disp); font-weight: 700; font-size: 15.5px; letter-spacing: 0.02em; text-transform: uppercase; }
  .weekrow .wr-what { font-size: 13.5px; color: var(--muted); margin-top: 1px; }
  .weekrow .wr-actions { display: flex; gap: 8px; margin-top: 8px; }
  .weekrow .wr-actions .btn { font-size: 12.5px; padding: 8px 10px; }
  .badge { display: inline-block; font-family: var(--disp); font-weight: 700; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 10px; padding: 2px 9px; margin-left: 6px; vertical-align: middle; }
  .badge.game { background: #e7edff; color: #3a5fb8; }
  .badge.released { background: #f4f2eb; color: #a39d8c; }

  .alertrow { border-left: 5px solid var(--grass); background: #fbfaf5; border-radius: 10px; padding: 10px 13px; margin-bottom: 8px; }
  .alertrow.warning { border-left-color: var(--clay); background: #fdf6ec; }
  .alertrow.urgent, .alertrow.closure { border-left-color: #b3432b; background: #fdefe9; }
  .alertrow h4 { font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase; }
  .alertrow p { font-size: 13.5px; color: #3c463f; margin-top: 2px; }

  /* ---------- setup ---------- */
  .setupbanner { background: var(--clay); color: #fff; border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .setupbanner button { background: rgba(255,255,255,0.22); border: none; color: #fff; border-radius: 8px; padding: 7px 11px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
  .stepicon { width: 34px; height: 34px; color: var(--pine); }
  .stepnum { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--pine); color: var(--chalk); font-family: var(--disp); font-weight: 700; font-size: 14px; margin-right: 8px; }
  ol.steps { margin: 10px 0 14px 0; list-style: none; }
  ol.steps li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--chalk-2); font-size: 14.5px; }
  ol.steps li:last-child { border-bottom: none; }
  ol.steps .stepnum2 { font-family: var(--disp); font-weight: 700; color: var(--clay-dark); min-width: 20px; }

  /* ---------- my people ---------- */
  .person { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .person .role { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .person .nm { font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
  .person .pcontact { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .person .pcontact a { background: var(--chalk-2); color: var(--pine); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600; }

  /* ---------- bottom tab bar ---------- */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(14,59,46,0.08); z-index: 20; }
  nav.tabbar button { flex: 1; background: none; border: none; padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-family: var(--disp); font-weight: 600; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; }
  nav.tabbar button.on { color: var(--pine); }
  nav.tabbar svg { width: 22px; height: 22px; }

  .loading { text-align: center; color: var(--muted); padding: 60px 10px; font-size: 15px; }
  .centerwrap { max-width: 440px; margin: 10px auto 0; text-align: center; }
  .instrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
  .instrow .ic { width: 30px; height: 30px; flex: 0 0 30px; color: var(--pine); }
  .instrow .tx { font-size: 14.5px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =======================================================================
   Field Command v3, the coach app (preview). /fields/app/
   Reuses the SAME gateway, SAME localStorage keys, and SAME auth as the
   live /fields/ hub (fields/index.html) so a coach signed in on one is
   signed in on the other. This file never modifies fields/index.html.
   ======================================================================= */
var API = "https://geigvuysptjvvqanumld.supabase.co/functions/v1/flm-gateway";
var VAPID_PUBLIC_KEY = "BDvNJFl3B89RD88uFJRJy01SQeZ2CLLZdPlKaPjQEtOilQng__xQoZ2tdQ0DXseF-7rsem9sfm45O0joeQ6Nn8s";

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

var CRED_C = {
  id: lsGet("flm_coach_id") || "",
  pin: lsGet("flm_coach_pin") || "",
  email: lsGet("flm_coach_email") || "",
  name: lsGet("flm_coach_name") || ""
};
function isCoachSignedIn() { return !!(CRED_C.id && CRED_C.pin); }
function coachApi(action, extra) {
  var body = extra || {};
  body.coach_id = CRED_C.id;
  body.coach_pin = CRED_C.pin;
  return fetch(API + "?action=" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
}
function publicApi(action, body) {
  return fetch(API + "?action=" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json(); });
}

var DAYS = [
  { k: "mon", label: "Monday", sat: false }, { k: "tue", label: "Tuesday", sat: false },
  { k: "wed", label: "Wednesday", sat: false }, { k: "thu", label: "Thursday", sat: false },
  { k: "fri", label: "Friday", sat: false },
  { k: "sat_9_11", label: "Sat 9–11am", sat: true }, { k: "sat_11_1", label: "Sat 11–1pm", sat: true },
  { k: "sat_1_3", label: "Sat 1–3pm", sat: true }, { k: "sat_3_5", label: "Sat 3–5pm", sat: true }
];
var DOW_INDEX = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat_9_11: 6, sat_11_1: 6, sat_1_3: 6, sat_3_5: 6 };
var DOW_DAYKEYS = { 1: ["mon"], 2: ["tue"], 3: ["wed"], 4: ["thu"], 5: ["fri"], 6: ["sat_9_11", "sat_11_1", "sat_1_3", "sat_3_5"] };

function todayStr() {
  var d = new Date();
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function ymd(d) {
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function mondayOf(d) {
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
}
function dateForDayThisWeek(dayK) {
  var idx = DOW_INDEX[dayK];
  if (!idx) return null;
  var mon = mondayOf(new Date());
  var target = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + (idx - 1));
  return ymd(target);
}
function fmtDateShort(str) {
  var p = String(str || "").split("-");
  return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}
function fieldStartLabel(f) { return f && f.default_start === "18:00" ? "6:00 PM" : "5:00 PM"; }
function fieldById(id) { return (P.fields || []).filter(function (f) { return f.id === id; })[0] || null; }
function teamById(id) { return (P.teams || []).filter(function (t) { return t.id === id; })[0] || null; }
/* Is this slot "live" on this specific calendar date? Mirrors fields/index.html's
   slotsOnDate, generalized off the public season/day/field filter already applied
   by the caller. */
function slotLiveOnDate(s, dateStr) {
  if (s.cancelled_at) return false;
  if (s.held && !s.team_id) return false;
  if (s.single_date) return s.single_date === dateStr;
  if (Array.isArray(s.skip_dates) && s.skip_dates.indexOf(dateStr) >= 0) return false;
  return true;
}

/* =======================================================================
   App state
   ======================================================================= */
var P = { fields: [], teams: [], slots: [], games: [], settings: {}, seasons: [], announcements: [] };
var H = null;          // coach_state payload
var SEASON = null;     // chosen open season id
var S = { screen: "loading", err: "" };
var DEFERRED_INSTALL = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); DEFERRED_INSTALL = e; });

function openSeason() {
  var remembered = lsGet("flm_season");
  var open = (P.seasons || []).filter(function (s) { return !s.locked; });
  var rememberedOk = open.filter(function (s) { return s.id === remembered; })[0];
  return (rememberedOk || open[0] || P.seasons[0] || null);
}
function myTeam() { return H && H.coach && H.coach.team_id ? teamById(H.coach.team_id) : null; }
function myTeamIds() { return (H && H.coach && H.coach.team_ids) || []; }
function mySlots() {
  if (!SEASON) return [];
  var ids = myTeamIds();
  return (P.slots || []).filter(function (s) { return s.season_id === SEASON.id && ids.indexOf(s.team_id) >= 0; });
}
function hasBookedAnything() { return mySlots().some(function (s) { return !s.cancelled_at; }); }

function root() { return document.getElementById("root"); }

/* =======================================================================
   Boot: load public state, then coach_state if signed in.
   ======================================================================= */
function boot() {
  render();
  fetch(API + "?action=state").then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { S.screen = "error"; S.err = d.error || "Could not load the schedule."; render(); return; }
    P = d;
    SEASON = openSeason();
    if (SEASON) lsSet("flm_season", SEASON.id);
    if (!isCoachSignedIn()) { S.screen = "signin"; render(); return; }
    loadCoachState(function (ok) {
      S.screen = ok ? (hasBookedAnything() ? "home" : "book") : "signin";
      render();
    });
  }).catch(function () {
    S.screen = "error"; S.err = "Could not reach the server. Check your connection and reload.";
    render();
  });
}
function loadCoachState(cb) {
  coachApi("coach_state", {}).then(function (j) {
    if (!j.ok) {
      if (j._status === 401 || j._status === 403) { signOut(true); }
      if (cb) cb(false);
      return;
    }
    H = j;
    if (cb) cb(true);
  }).catch(function () { if (cb) cb(false); });
}
function signOut(quiet) {
  CRED_C = { id: "", pin: "", email: "", name: "" };
  lsDel("flm_coach_id"); lsDel("flm_coach_pin"); lsDel("flm_coach_email"); lsDel("flm_coach_name");
  H = null;
  S.screen = "signin";
  if (!quiet) render();
}

/* =======================================================================
   Render dispatcher
   ======================================================================= */
function render() {
  var r = root();
  if (S.screen === "loading") { r.innerHTML = '<div class="loading">Loading Field Command&hellip;</div>'; return; }
  if (S.screen === "error") {
    r.innerHTML = '<div class="centerwrap" style="margin-top:60px;"><div class="card"><h2>Something went wrong</h2><p class="hint">' + esc(S.err) + '</p><button class="btn" id="eReload">Reload</button></div></div>';
    document.getElementById("eReload").addEventListener("click", function () { location.reload(); });
    return;
  }
  if (S.screen === "signin") { renderSignIn(); return; }
  renderShell();
}

/* =======================================================================
   Sign-in (email -> PIN, same accounts as the live coach hub)
   ======================================================================= */
function renderSignIn() {
  var r = root();
  r.innerHTML =
    '<div class="signwrap">' +
      '<svg class="diamond" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#0e3b2e"/><path d="M50 22 L78 50 L50 78 L22 50 Z" fill="#f4f1e8"/><path d="M50 34 L66 50 L50 66 L34 50 Z" fill="#c96f2f"/></svg>' +
      '<h1>Field Command</h1>' +
      '<p class="lede">Book your practice field in two taps. Enter the email your league has on file.</p>' +
      '<label class="flabel" for="siEmail">Your email</label>' +
      '<input id="siEmail" class="finput" type="email" placeholder="you@example.com" autocomplete="email" />' +
      '<div id="siPinWrap" class="hidden">' +
        '<label class="flabel" for="siPin">Your 4 digit PIN</label>' +
        '<input id="siPin" class="finput pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="current-password" />' +
      '</div>' +
      '<div class="btnrow"><button class="btn clay" id="siGo" style="margin-top:14px;">Continue</button></div>' +
      '<div id="siErr" class="err hidden"></div>' +
      '<div id="siOk" class="ok hidden"></div>' +
      '<p style="text-align:center;margin-top:14px;"><a href="/fields/" class="linkbtn">Open the full coach hub instead</a></p>' +
    '</div>';
  var em = document.getElementById("siEmail");
  var pinWrap = document.getElementById("siPinWrap");
  var pn = document.getElementById("siPin");
  var go = document.getElementById("siGo");
  var err = document.getElementById("siErr");
  var ok = document.getElementById("siOk");
  var stage = "email";
  if (CRED_C.email) em.value = CRED_C.email;
  function showErr(t) { err.textContent = t; err.classList.remove("hidden"); ok.classList.add("hidden"); }
  function showOk(t) { ok.innerHTML = t; ok.classList.remove("hidden"); err.classList.add("hidden"); }
  function checkEmail() {
    var email = em.value.trim();
    err.classList.add("hidden"); ok.classList.add("hidden");
    if (!email || email.indexOf("@") < 1) { showErr("Enter your email address."); return; }
    go.disabled = true; go.textContent = "Checking…";
    publicApi("coach_request_access", { email: email }).then(function (j) {
      go.disabled = false; go.textContent = "Continue";
      if (!j.ok) { showErr(j.error || "That did not work."); return; }
      if (!j.found) { showErr("That email is not on the coach list. Ask your league admin to add you, or open the full coach hub for support."); return; }
      if (j.has_pin) {
        stage = "pin"; pinWrap.classList.remove("hidden"); go.textContent = "Sign in";
        setTimeout(function () { pn.focus(); }, 20);
      } else {
        showOk("You're on the list. We just emailed you a link to set your PIN. Open it on this phone, then come back here and sign in.");
      }
    }).catch(function () { go.disabled = false; go.textContent = "Continue"; showErr("Could not reach the server. Try again."); });
  }
  function doLogin() {
    var email = em.value.trim(), pin = pn.value.trim();
    err.classList.add("hidden");
    if (!/^\d{4}$/.test(pin)) { showErr("Enter your 4 digit PIN."); return; }
    go.disabled = true; go.textContent = "Signing in…";
    publicApi("coach_login", { email: email, pin: pin }).then(function (j) {
      if (!j.ok) { showErr(j.error || "That did not work."); go.disabled = false; go.textContent = "Sign in"; return; }
      CRED_C.id = j.coach.id; CRED_C.pin = pin; CRED_C.email = j.coach.email; CRED_C.name = j.coach.name;

  }
  var paHtml = playerAgents.length ? playerAgents.map(function (c) { return personCard(c.name, c.role, c.phone, c.email); }).join("") : '<p class="hint">No player agent on file yet.</p>';
  var coachHtml = otherCoaches.length ? otherCoaches.map(function (t) { return personCard(t.coach_name || t.name, t.name + " coach", t.coach_phone, ""); }).join("") : '<p class="hint">No other coaches listed in your division yet.</p>';
  var boardHtml = board.length ? board.map(function (c) { return personCard(c.name, c.role, c.phone, c.email); }).join("") : '<p class="hint">No board contacts posted yet.</p>';

  return '<div class="card"><h2>Your player agent</h2>' + paHtml + '</div>' +
    '<div class="card"><h2>Coaches in ' + esc(div || "your division") + '</h2>' + coachHtml + '</div>' +
    '<div class="card"><h2>League board</h2>' + boardHtml + '</div>';
}

/* =======================================================================
   Small overlay + toast helpers
   ======================================================================= */
function openOverlay(innerHtml) {
  var d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;background:rgba(14,59,46,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0;";
  d.innerHTML = '<div style="background:transparent;width:100%;max-width:640px;padding:14px;">' + innerHtml + '</div>';
  document.body.appendChild(d);
  d.addEventListener("click", function (e) { if (e.target === d) closeOverlay(d); });
  return d;
}
function closeOverlay(d) { if (d && d.parentNode) d.parentNode.removeChild(d); }
function toast(msg) {
  var t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:14px;right:14px;bottom:86px;background:#0e3b2e;color:#f4f1e8;padding:12px 16px;border-radius:12px;font-size:14px;z-index:70;box-shadow:0 8px 26px rgba(14,59,46,0.3);text-align:center;";
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3200);
}

function wireScreen(screen) {
  if (screen === "book") {
    var recheck = document.getElementById("bkRecheck");
    if (recheck) recheck.addEventListener("click", function () { loadCoachState(render); });
    var done = document.getElementById("bkDoneBtn");
    if (done) done.addEventListener("click", function () { S.screen = "home"; render(); });
    document.querySelectorAll("[data-daypill]").forEach(function (b) {
      if (b.getAttribute("data-tag") === "taken") return;
      b.addEventListener("click", function () { openClaimConfirm(b.getAttribute("data-day"), b.getAttribute("data-field")); });
    });
  } else if (screen === "setup") {
    wireSetup();
  } else if (screen === "home") {
    wireHome();
  }
}

boot();
</script>
