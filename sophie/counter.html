<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Sophie's Counter-Offer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231b2a4a'/><text x='50' y='68' font-family='Georgia,serif' font-size='56' font-weight='700' fill='%23faf6ef' text-anchor='middle'>S</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#1b2a4a; --coral:#e8623c; --coral-dark:#c94f2c; --cream:#faf6ef; --gold:#d4a24c; --ink:#26324f; --muted:#8a8378; --line:#e6ddc9; }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { background: var(--cream); color: var(--ink); font-family: "Inter", system-ui, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .card { max-width: 420px; width: 100%; background: #fff; border-radius: 18px; padding: 28px 24px; box-shadow: 0 14px 34px rgba(27,42,74,0.14); }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 22px; color: var(--navy); margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .time { font-size: 19px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .loc { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .btn { width: 100%; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; padding: 15px; margin-bottom: 10px; }
  .btnAccept { background: var(--coral); color: #fff; }
  .btnDecline { background: #f1ead9; color: var(--navy); }
  .hidden { display: none !important; }
  .loading, .done, .err { text-align: center; color: var(--muted); padding: 10px 0; }
  .done h2 { font-family: "Fraunces", Georgia, serif; color: var(--navy); margin-bottom: 6px; }
</style>
</head>
<body>
<div class="card">
  <div id="loading" class="loading">Loading&hellip;</div>
  <div id="offer" class="hidden">
    <h1>Sophie proposed a new time</h1>
    <p class="sub" id="athleteLine"></p>
    <p class="time" id="timeLine"></p>
    <p class="loc" id="locLine"></p>
    <button class="btn btnAccept" id="acceptBtn">Yes, that works!</button>
    <button class="btn btnDecline" id="declineBtn">That doesn't work for us</button>
  </div>
  <div id="done" class="done hidden">
    <h2 id="doneTitle"></h2>
    <p id="doneBody"></p>
  </div>
  <div id="err" class="err hidden"></div>
</div>
<script>
(function () {
  var API = "https://geigvuysptjvvqanumld.supabase.co/functions/v1/sls-gateway";
  var el = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(window.location.search).get("token") || "";
  function show(id) { ["loading", "offer", "done", "err"].forEach(function (x) { el(x).classList.toggle("hidden", x !== id); }); }

  if (!token) { show("err"); el("err").textContent = "This link is missing its token."; return; }

  fetch(API + "?action=counter_info&token=" + encodeURIComponent(token)).then(function (r) {
    return r.json();
  }).then(function (j) {
    if (!j.ok) { show("err"); el("err").textContent = j.error || "This offer is no longer available."; return; }
    show("offer");
    el("athleteLine").textContent = "For " + j.request.athlete_name;
    el("timeLine").textContent = j.request.counter_time_display;
    if (j.request.location) el("locLine").textContent = j.request.location.name + (j.request.location.address ? ", " + j.request.location.address : "");
  }).catch(function () { show("err"); el("err").textContent = "Could not reach the server."; });

  function respond(choice) {
    show("loading");
    fetch(API + "?action=counter_respond", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, choice: choice }),
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { show("err"); el("err").textContent = j.error || "Something went wrong."; return; }
      show("done");
      if (j.result === "accepted") {
        el("doneTitle").textContent = "You're all set!";
        el("doneBody").textContent = "Sophie has confirmed the session. A confirmation email is on its way.";
      } else {
        el("doneTitle").textContent = "Got it";
        el("doneBody").textContent = "We let Sophie know that time doesn't work. She may follow up directly.";
      }
    }).catch(function () { show("err"); el("err").textContent = "Could not reach the server."; });
  }
  el("acceptBtn").addEventListener("click", function () { respond("accept"); });
  el("declineBtn").addEventListener("click", function () { respond("decline"); });
})();
</script>
</body>
</html>
