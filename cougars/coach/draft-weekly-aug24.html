<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>DRAFT PREVIEW: Weekly Update</title>
<link rel="icon" type="image/png" href="/cougars/assets/cougars-favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #c8102e; --red-dark: #a50d26; --black: #141416; --ink: #1f2326; --muted: #7a8087;
    --line: #e4e6e8; --bg: #f2f3f4; --white: #fff;
    --shadow: 0 10px 30px rgba(20,20,22,.08);
    --disp: "Oswald", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  .hero { background: radial-gradient(120% 160% at 85% -20%, #2b2b2f 0%, var(--black) 55%); color: #fff; }
  .hero-inner { max-width: 760px; margin: 0 auto; padding: 26px 22px 22px; }
  .kicker { font-family: var(--disp); font-weight: 600; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--red); }
  .hero h1 { font-family: var(--disp); font-weight: 700; font-size: clamp(34px, 7vw, 48px); text-transform: uppercase; letter-spacing: .02em; line-height: 1; margin-top: 4px; }
  .slash { height: 6px; background: linear-gradient(90deg, var(--red) 0%, var(--red) 62%, var(--red-dark) 100%); }
  .shell { max-width: 760px; margin: 0 auto; padding: 24px 22px 56px; }
  .update { background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px; }
  .update .d { font-family: var(--disp); font-weight: 600; font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
  .update .b { font-size: 15px; color: #33383d; }
  .update .b p { margin: 0 0 10px; }
  .update .b p:last-child { margin-bottom: 0; }
  .update .b .sec { font-family: var(--disp); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--black, #141416); border-left: 3px solid var(--red); padding-left: 9px; margin: 18px 0 8px; }
  .update .b .sec:first-child { margin-top: 2px; }
  .update .b .ulink { color: var(--red); font-weight: 700; text-decoration: underline; }
  .update .b .ubtn { display: inline-block; background: linear-gradient(120deg, var(--red), var(--red-dark)); color: #fff; font-family: var(--disp); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; padding: 12px 18px; border-radius: 10px; margin: 6px 0 2px; }
  .update .b .ubtn:active { transform: scale(.98); }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 15px; }
  .back { display: inline-block; margin-top: 20px; font-family: var(--disp); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .back:hover { color: var(--red); }
</style>
<style>
  .draftbar { background: #fff7e0; color: #8a6a00; border-bottom: 2px solid #e6c85a; padding: 12px 22px; font-size: 14px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <div class="draftbar">DRAFT PREVIEW for Coach only. Parents cannot see this. Publishing happens from Coach HQ and sends one notification.</div>
  <div class="hero"><div class="hero-inner">
    <div class="kicker">BLS Cougars &bull; Fall 2026</div>
    <h1>Weekly Updates</h1>
  </div></div>
  <div class="slash"></div>
  <div class="shell">
    <div id="list"></div>
  </div>
<script type="application/json" id="draft-data">{"update_date":"2026-08-24","body":"**Week of August 24**\n\n**Practices this week**\n\n**Thursday: Tehaleh Heights, 6:00 to 8:00.** We will push for 8:00, but if it gets dark we will call it early. I know the girls have back to school nights happening. Do your best. If you miss, you miss. Thursday will be a fielding practice with live baserunning and situational plays.\n\n**Saturday: Mountain View Middle School, 9:00 to 11:00. Completely optional.** This is a hitting practice focused on individual hitting, so girls will not miss any team instruction if they can't make it. I am still working on sourcing a pitching machine, but one way or another, show up for the full 2 hours or for 15 minutes and your daughter will leave with her body tired from swinging. We will have nets, heavy balls, small balls, soft toss, and maybe even a live pitcher or two.\n\nParents, this is a fun one to jump in on. There are plenty of easy ways to help: shag some balls, run a hitting net, or grab a chair and throw soft toss. Siblings are welcome too, we can always use extra ball chasers. It takes a village.\n\n**Field changes from the district**\n\nThe district has reserved school fields for school teams until 6:00. I do not believe this affects us directly since Tehaleh does not have any school teams. It may affect joint practices with other teams, especially later in the season when it gets dark before 7:00. We will navigate it. Spring prepared us well for adjusting to lost fields and rainouts, and we will lean on unconventional practices when we need to: Mike and Terrys, public parks, and whatever else works.\n\n**Interlock games and travel**\n\nWe will be interlocking with other little leagues this fall, so some of our Saturday games may involve travel to places like Kent, Auburn, and South Hill. Schedule details will come as the league finalizes them.\n\n**What fall ball is about**\n\nA reminder from the coaches meeting: fall is a development league, not a competitive one. We will not argue calls. Our focus is on each girl's growth, her skills, and her confidence. The scoreboard comes second, every time.\n\n**Fields and weather**\n\nTeams are responsible for field maintenance, and I appreciate how willing everyone has been to help. The league told us chances of makeup games are slim to none, so we will do everything in our power to make fields playable when weather allows. That means pumping water, applying field dry, raking, and adding fresh dirt. If it has been wet out and we have a game, field prep help will be huge.\n\n**First game**\n\nFirst game is the weekend of September 12. As of right now I will not be there. I will be in Arizona for my mom's 60th, but I am trying to get out of it :)\n\n**Uniforms**\n\nThe league has ordered uniforms, but we may not have them until the second game. They are doing what they can. Uniforms come with a shirt, red socks, and a belt. Parents need to get grey pants for the girls:\n[Grey pants on Amazon](https://www.amazon.com/Mivei-2T-16Years-Softball-Toddler-Baseball/dp/B0GTTKSN34/)\n\n**Team funds**\n\nSweatshirts: if you have not filled out the [sweatshirt form](https://coachpilot.org/cougars/sweatshirt.html) yet, please do. If you are not sure whether you did, fill it out again. You can pay through the [team funds page](https://coachpilot.org/cougars/funds.html).\n[Open the funds page](https://coachpilot.org/cougars/funds.html)\n\nThere is also a Mike and Terrys batting cage fund for tokens and cage time. Renting a cage runs about $80 an hour, but we usually just buy tokens and form a line, which comes out to far less.\n\n**Bows and socks**\n\nIn past seasons a couple of parents have taken on bows and matching socks, and honestly, that is for the best. I am happy to set up a team fund for them, but nobody wants me in charge of anything fashion related. If you would like to run bows or socks this season, reach out and we will work it out together.\n\n**Walk-up songs**\n\nIf you have not filled out the walk-up song form, please do it this week. I am getting started on those now.\n[Pick her walk-up song](https://coachpilot.org/cougars/walkup.html)\n\n**Looking ahead**\n\n**Day at the cages next week.** We are planning an evening at the batting cages next week, Monday, Tuesday, or Wednesday. Vote for every evening that works for your family and we will go with the night that gets the most votes. This one is optional, make it if you can. More details next week.\n[Vote for cage night](https://coachpilot.org/cougars/cagevote.html)\n\n**Scrimmage September 10.** I have set up a scrimmage with the Bears for Thursday, September 10. We will determine the field as it gets closer. Plan for it to take the place of our normal practice that week.\n\nI am also trying to set up a second scrimmage with the Bruins on September 8. No promises yet. If it comes together I will let you know."}</script>
<script>
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fmtDate(d) {
    try {
      var p = d.split("-");
      return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" });
    } catch (e) { return d; }
  }
  // Body renderer: blank line = paragraph, a line of only **text** = section header,
  // a line of only [label](url) = button, inline **bold** and [label](url) links.
  function lineHtml(line) {
    return esc(line)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s<]+)\)/g, '<a class="ulink" href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function renderBody(body) {
    var blocks = String(body || "").split(/\n\s*\n/);
    return blocks.map(function (block) {
      var t = block.replace(/^\s+|\s+$/g, "");
      if (!t) return "";
      var mHead = t.match(/^\*\*([^*]+)\*\*$/);
      if (mHead) return '<div class="sec">' + esc(mHead[1]) + "</div>";
      var html = t.split("\n").map(function (line) {
        var lt = line.trim();
        var mBtn = lt.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/);
        if (mBtn) return '<a class="ubtn" href="' + esc(mBtn[2]) + '" target="_blank" rel="noopener">' + esc(mBtn[1]) + "</a>";
        return lineHtml(line);
      }).join("<br>");
      return "<p>" + html + "</p>";
    }).join("");
  }
  var u = JSON.parse(document.getElementById("draft-data").textContent);
  document.getElementById("list").innerHTML =
    '<div class="update"><div class="d">' + esc(fmtDate(u.update_date)) + '</div><div class="b">' + renderBody(u.body) + '</div></div>';
})();
</script>
</body>
</html>
