<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Field Help Sign-Up — BLS Cougars</title>
<link rel="icon" type="image/png" href="/cougars/assets/cougars-favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #c8102e; --red-dark: #a50d26; --black: #141416; --ink: #1f2326; --muted: #7a8087;
    --line: #e4e6e8; --bg: #f2f3f4; --white: #fff; --green: #21622f;
    --shadow: 0 10px 30px rgba(20,20,22,.08);
    --disp: "Oswald", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  .hero { background: radial-gradient(120% 160% at 85% -20%, #2b2b2f 0%, var(--black) 55%); color: #fff; }
  .hero-inner { max-width: 640px; margin: 0 auto; padding: 26px 22px 22px; }
  .kicker { font-family: var(--disp); font-weight: 600; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--red); }
  .hero h1 { font-family: var(--disp); font-weight: 700; font-size: clamp(30px, 7vw, 44px); text-transform: uppercase; line-height: 1.05; margin-top: 4px; }
  .hero .tag { margin-top: 8px; color: #a9acb2; font-size: 14px; }
  .slash { height: 6px; background: linear-gradient(90deg, var(--red) 0%, var(--red) 62%, var(--red-dark) 100%); }
  .shell { max-width: 640px; margin: 0 auto; padding: 24px 22px 56px; }
  .game { background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .game .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .game .g { font-family: var(--disp); font-weight: 600; font-size: 17px; }
  .chip { font-family: var(--disp); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 20px; padding: 4px 12px; white-space: nowrap; }
  .chip.home { background: #fbe9ec; color: var(--red); }
  .chip.away { background: #eee; color: #55575c; }
  .chip.open { background: #ecf6ee; color: var(--green); }
  .chip.taken { background: #eee; color: #666; }
  .game .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .game .job { font-size: 14px; color: #33383d; margin-top: 8px; padding: 9px 11px; background: #f8f8f9; border-radius: 10px; }
  .game .job b { color: var(--red); }
  .slot { border-top: 1px dashed #eef0f1; margin-top: 10px; padding-top: 10px; }
  .slot .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .slot .r { font-weight: 600; font-size: 14.5px; }
  .slot .who { font-size: 14px; color: var(--green); font-weight: 600; margin-top: 3px; }
  .slot .claim { display: none; }
  .slot.expanded .claim { display: block; }
  .slot input[type=text] { width: 100%; font-size: 15px; padding: 11px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fdfdfd; margin-top: 8px; }
  .slot input:focus { outline: none; border-color: var(--red); }
  .btn { border: 0; border-radius: 10px; font-family: var(--disp); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; padding: 11px 16px; cursor: pointer; }
  .btn-take { background: linear-gradient(120deg, var(--red), var(--red-dark)); color: #fff; margin-top: 10px; width: 100%; }
  .btn-open { background: var(--white); border: 2px solid var(--black); color: var(--ink); margin-top: 8px; font-size: 12.5px; padding: 8px 14px; }
  .m { font-size: 13.5px; font-weight: 600; margin-top: 8px; min-height: 16px; }
  .m.ok { color: var(--green); } .m.bad { color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .back { display: inline-block; margin-top: 16px; font-family: var(--disp); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div class="hero"><div class="hero-inner">
    <div class="kicker">BLS Cougars &bull; Game Days</div>
    <h1>Field Help Sign-Up</h1>
    <p class="tag">League rule: the home team sets up the field before the game, and the away team cleans up after. Takes about 15 minutes with a couple of parents. Grab a job on a game that works for you.</p>
  </div></div>
  <div class="slash"></div>
  <div class="shell">
    <div id="board"><div class="empty">Loading&hellip;</div></div>
    <a class="back" href="/cougars/?stay">&larr; Back to the team hub</a>
  </div>
<script>
(function () {
  var API = "https://geigvuysptjvvqanumld.supabase.co/functions/v1/cougars-gateway";

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function load() {
    fetch(API + "?action=field_slots")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var board = document.getElementById("board");
        var slots = d.slots || [];
        if (!slots.length) { board.innerHTML = '<div class="empty">No games posted yet.</div>'; return; }

        // Group slots by game_no, keeping schedule order.
        var games = [];
        var byNo = {};
        slots.forEach(function (s) {
          if (!byNo[s.game_no]) { byNo[s.game_no] = { info: s, slots: [] }; games.push(byNo[s.game_no]); }
          byNo[s.game_no].slots.push(s);
        });

        board.innerHTML = games.map(function (g) {
          var info = g.info;
          var side = info.is_home
            ? '<span class="chip home">Home</span>'
            : '<span class="chip away">Away</span>';
          var job = info.is_home
            ? '<b>We set up the field.</b> One parent drags the field and sets the bases, one or two parents chalk the lines. All before the game.'
            : '<b>We clean up.</b> After the game, one parent puts the bases away and one parent drags the field.';
          var rows = g.slots.map(function (s) {
            if (s.claimed_by) {
              return '<div class="slot"><div class="top"><span class="r">' + esc(s.role_label) + '</span><span class="chip taken">Covered</span></div>' +
                '<div class="who">' + esc(s.claimed_by) + '</div></div>';
            }
            return '<div class="slot" id="slot-' + s.id + '">' +
              '<div class="top"><span class="r">' + esc(s.role_label) + '</span><span class="chip open">Open</span></div>' +
              '<div class="claim">' +
                '<input type="text" id="fam-' + s.id + '" placeholder="Family name (e.g. The Skube family)">' +
                '<button class="btn btn-take" onclick="claim(' + s.id + ')">We\'ve got this one</button>' +
                '<div class="m" id="m-' + s.id + '"></div>' +
              '</div>' +
              '<button class="btn btn-open" onclick="document.getElementById(\'slot-' + s.id + '\').classList.add(\'expanded\'); this.style.display=\'none\';">Take this job</button>' +
            '</div>';
          }).join("");
          return '<div class="game">' +
            '<div class="head"><span class="g">' + esc(info.game_label) + '</span>' + side + '</div>' +
            '<div class="meta">' + esc(info.venue || "") + (info.game_time ? ' &middot; ' + esc(info.game_time) : '') + '</div>' +
            '<div class="job">' + job + '</div>' +
            rows +
          '</div>';
        }).join("");
      })
      .catch(function () {
        document.getElementById("board").innerHTML = '<div class="empty">Could not load. Try again in a minute.</div>';
      });
  }

  window.claim = function (id) {
    var fam = document.getElementById("fam-" + id).value.trim();
    var m = document.getElementById("m-" + id);
    if (!fam) { m.className = "m bad"; m.textContent = "Add your family name."; return; }
    m.className = "m"; m.textContent = "Claiming…";
    fetch(API + "?action=claim_field", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slot_id: id, family_name: fam }),
    })
      .then(function (r) {
        if (r.status === 409) throw new Error("Another family just grabbed this one. Pick a different job!");
        if (!r.ok) throw new Error("Could not claim. Try again.");
        return r.json();
      })
      .then(function () { load(); })
      .catch(function (e) { m.className = "m bad"; m.textContent = e.message; });
  };

  load();
  try { fetch(API + "?action=page_view", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ page: "fieldhelp" }), keepalive: true }).catch(function () {}); } catch (e) {}
})();
</script>
</body>
</html>
